<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Teste de Performance · Bio em Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: faixa escura da marca no topo, coluna única de leitura (max 760px), questões em fichas; painel do professor em grade de blocos. */
:root{
  --paper:#FBFAF0; --surface:#FFFFFF; --surface-2:#F1F1E6; --ink:#2E2F3B; --ink-2:#56576A; --ink-3:#7C7B72;
  --line:#DCDED1; --accent:#3F5E5B; --accent-ink:#FFFFFF; --leaf:#7FD997; --leaf-wash:#E8F6EC;
  --band:#2E2F3B; --band-ink:#F0EFE1;
  --ok:#2F8F5B; --ok-wash:#E4F4EA; --warn:#A87A12; --warn-wash:#FBF3DC; --crit:#B24B4B; --crit-wash:#F8E7E5;
  --f-display:"Archivo",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-ui:"Archivo",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#23242D; --surface:#2E2F3B; --surface-2:#383A4A; --ink:#F0EFE1; --ink-2:#CFCEC2; --ink-3:#A3A298;
  --line:#474A5C; --accent:#7FD997; --accent-ink:#1E2A22; --leaf:#7FD997; --leaf-wash:#2B3D35;
  --band:#1C1D25; --band-ink:#F0EFE1;
  --ok:#7FD997; --ok-wash:#2B3D35; --warn:#E9C45E; --warn-wash:#3E3826; --crit:#E48F8F; --crit-wash:#48303A; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#23242D; --surface:#2E2F3B; --surface-2:#383A4A; --ink:#F0EFE1; --ink-2:#CFCEC2; --ink-3:#A3A298;
  --line:#474A5C; --accent:#7FD997; --accent-ink:#1E2A22; --leaf:#7FD997; --leaf-wash:#2B3D35;
  --band:#1C1D25; --band-ink:#F0EFE1;
  --ok:#7FD997; --ok-wash:#2B3D35; --warn:#E9C45E; --warn-wash:#3E3826; --crit:#E48F8F; --crit-wash:#48303A; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px;border-radius:4px}
.band{background:var(--band);color:var(--band-ink);padding-block:18px 22px;padding-inline:16px}
.band-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.band-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.band img{height:46px;width:auto;display:block}
.band h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,36px);line-height:1.1;margin:0;text-wrap:balance}
.band h1 span{color:#7FD997}
.band p{margin:0;color:#D6D5C9;font-family:var(--f-body);font-size:17px;max-width:60ch}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes button{background:transparent;border:1px solid #5A5D70;color:var(--band-ink);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;cursor:pointer}
.modes button[aria-pressed="true"]{background:#7FD997;border-color:#7FD997;color:#1E2A22}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:flex;flex-direction:column;gap:18px}
.wide{max-width:1040px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
h2{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0 0 8px}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.facts div{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.facts b{display:block;font-family:var(--f-display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.facts span{font-size:13px;color:var(--ink-2)}
.areas-list{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0;padding:0;list-style:none}
.areas-list li{font-size:13px;background:var(--leaf-wash);color:var(--ink);border-radius:999px;padding:3px 10px}
label.fl{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
input[type=text],textarea{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 200px;min-width:0}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 18px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:14px}
.btn.danger{background:var(--crit);color:#fff}
.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.done{background:var(--accent)}
.progress i.cur{background:var(--leaf)}
.step-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.step-h small{color:var(--ink-3);font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px}
.qn{width:32px;height:32px;border-radius:7px;background:var(--band);color:#F0EFE1;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.qb{min-width:0}
.qb p{margin:0 0 10px;font-family:var(--f-body);font-size:17px;line-height:1.55}
.qb .cmd{font-family:var(--f-ui);font-weight:700;font-size:15.5px}
.qt{overflow-x:auto;margin:4px 0 12px}
.qt table{border-collapse:collapse;font-size:14px}
.qt th{background:var(--band);color:#F0EFE1;text-align:left;padding:6px 10px;font-size:13px}
.qt td{padding:6px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.clado{margin:4px 0 12px;color:var(--ink);overflow-x:auto}
.clado svg{max-width:100%;height:auto;display:block}
.gap{display:inline-block;width:60px;border-bottom:1.5px solid var(--ink);margin:0 3px}
b.lac{color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--paper);font-family:var(--f-body);font-size:16px;line-height:1.45}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .l{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink-3);display:flex;align-items:center;justify-content:center;font-family:var(--f-ui);font-weight:700;font-size:13px;color:var(--ink-2)}
.opt:has(input:checked){border-color:var(--accent);background:var(--leaf-wash)}
.opt:has(input:checked) .l{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt:has(input:focus-visible){outline:3px solid var(--leaf);outline-offset:2px}
.note{border-radius:8px;padding:12px 14px;font-size:15px}
.note.ok{background:var(--ok-wash)}
.note.warn{background:var(--warn-wash)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all;background:var(--surface-2);border-radius:6px;padding:10px;margin:8px 0;user-select:all}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 128px;gap:10px;align-items:center;font-size:14px}
.bar .t{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:6px}
.pill{display:inline-block;white-space:nowrap;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;text-align:center}
.pill.ok{background:var(--ok-wash);color:var(--ok)}
.pill.warn{background:var(--warn-wash);color:var(--warn)}
.pill.crit{background:var(--crit-wash);color:var(--crit)}
.fill-ok{background:var(--ok)}.fill-warn{background:var(--warn)}.fill-crit{background:var(--crit)}
.eqlist{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.eq{border-left:4px solid var(--crit);background:var(--surface-2);border-radius:0 8px 8px 0;padding:10px 12px}
.eq h4{margin:0 0 4px;font-size:15px;font-family:var(--f-display)}
.eq p{margin:0 0 4px;font-family:var(--f-body);font-size:15px}
.eq small{color:var(--ink-3)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpis div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpis b{display:block;font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.kpis span{font-size:13px;color:var(--ink-2)}
.tscroll{overflow-x:auto}
table.data{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.data th{text-align:left;background:var(--band);color:#F0EFE1;padding:7px 9px;font-size:12.5px;white-space:nowrap}
table.data td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
table.data td.c{text-align:center}
.sc{display:inline-block;min-width:26px;text-align:center;border-radius:5px;padding:1px 5px;font-weight:700}
.sc.ok{background:var(--ok-wash);color:var(--ok)}.sc.warn{background:var(--warn-wash);color:var(--warn)}.sc.crit{background:var(--crit-wash);color:var(--crit)}
.dist{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2);min-width:90px}
.empty{text-align:center;padding:28px 16px;color:var(--ink-2)}
.hint{font-size:13px;color:var(--ink-3)}
@media (max-width:560px){
  .facts{grid-template-columns:1fr 1fr 1fr}
  .q{grid-template-columns:1fr;padding:14px}
  .bar{grid-template-columns:1fr auto}
  .bar .t{grid-column:1/-1;grid-row:2}
  .qb p{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;overflow:hidden}
.profbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
</style>
</head>

const DATA = [{"id": "BQ1", "area": "Bioquímica", "ponto": "Enzimas e temperatura: calor desnatura (irreversível), frio só reduz a atividade (reversível)", "html": "<p>Três amostras de uma mesma enzima digestiva humana, cuja atividade é máxima por volta de 37 °C, foram mantidas por 30 minutos a 0 °C (amostra 1), 37 °C (amostra 2) e 80 °C (amostra 3). Em seguida, as três foram levadas a 37 °C e receberam o substrato da enzima.<\/p>", "cmd": "Qual resultado é esperado? Assinale a alternativa correta.", "alts": {"a": "As amostras 1 e 3 ficam praticamente inativas, pois tanto o frio intenso quanto o calor intenso destroem a estrutura da enzima de forma permanente.", "b": "A amostra 3 apresenta a maior atividade, pois o aquecimento prévio deixa a enzima mais ativa e acelera as reações químicas que ela catalisa.", "c": "A amostra 1 recupera atividade semelhante à da 2; a amostra 3 fica quase inativa, pois o sítio ativo perdeu a forma de encaixe.", "d": "As três amostras apresentam atividade semelhante, pois, ao voltar a 37 °C, a enzima aquecida recupera a forma original, assim como a resfriada."}, "gab": "c", "eq": {"a": {"nome": "Frio desnatura como o calor", "exp": "O aluno acha que qualquer temperatura extrema “mata” a enzima, mas o frio, em geral, apenas reduz a agitação molecular e a atividade, de forma reversível, sem alterar a forma da proteína."}, "b": {"nome": "Mais calor, mais atividade (sem limite)", "exp": "O aluno generaliza a regra da cinética química (temperatura acelera reações) e ignora que, acima da temperatura ótima, a enzima se desnatura e perde a atividade."}, "d": {"nome": "Desnaturação sempre reversível", "exp": "O aluno trata o efeito do calor como o do frio, supondo que a enzima “volta ao normal”, mas a desnaturação por calor intenso em geral é irreversível."}}, "ok": "O frio reduz a energia cinética das moléculas e a frequência dos encontros enzima-substrato, mas, em geral, não altera a forma da enzima: de volta a 37 °C, ela funciona normalmente. O calor excessivo rompe as interações que mantêm a estrutura tridimensional (desnaturação) e deforma o sítio ativo, que deixa de se encaixar em seu substrato específico; em geral, isso é irreversível.", "int": "Construir com a turma o gráfico atividade × temperatura e discutir o que acontece ao “voltar” de cada lado da curva (alimento na geladeira × alimento cozido)."}, {"id": "BQ2", "area": "Bioquímica", "ponto": "Carboidratos × lipídios: fonte imediata × reserva de energia; amido/glicogênio × celulose", "html": "<p>Um atleta vai disputar uma corrida daqui a uma hora e pode escolher entre três alimentos: pão (rico em amido), salada de alface (rica em celulose) e azeite (rico em lipídios). Ele quer uma fonte de energia de uso rápido durante a prova.<\/p>", "cmd": "Sobre essa escolha, assinale a alternativa correta.", "alts": {"a": "O pão é a melhor opção: o amido é digerido em glicose, de uso rápido; o azeite tem mais energia por grama, mas é digerido e oxidado mais lentamente.", "b": "A salada é tão boa quanto o pão: a celulose, assim como o amido, é formada por moléculas de glicose e, por isso, é digerida e fornece a mesma energia.", "c": "O azeite é a melhor opção: como os lipídios liberam mais energia por grama do que os carboidratos, eles são também a fonte de energia de uso mais imediato.", "d": "O pão é a melhor opção: o amido é absorvido intacto e fica armazenado como amido no fígado e nos músculos, que é a forma de reserva típica dos animais."}, "gab": "a", "eq": {"b": {"nome": "Celulose = amido (todo polímero de glicose é digerível)", "exp": "O aluno sabe que ambos são polímeros de glicose, mas ignora que as ligações da celulose não são quebradas por enzimas humanas; ela atua como fibra, não como fonte de energia."}, "c": {"nome": "Mais energia por grama = energia mais rápida", "exp": "O aluno confunde a quantidade de energia armazenada com a rapidez de uso; lipídios são uma reserva densa, mas são digeridos, absorvidos e oxidados mais lentamente do que a glicose."}, "d": {"nome": "Amido como reserva animal (confusão amido × glicogênio)", "exp": "O aluno acerta a escolha, mas acha que o amido é absorvido e armazenado como tal; ele é digerido em glicose, e a reserva animal é o glicogênio (o amido é reserva vegetal)."}}, "ok": "Carboidratos digeríveis (amido, glicogênio, açúcares) liberam glicose, fonte de energia de uso imediato; os animais armazenam glicose como glicogênio, e as plantas, como amido. Lipídios fornecem mais que o dobro de energia por grama, mas são digeridos, absorvidos e oxidados mais lentamente e funcionam sobretudo como reserva de longo prazo. A celulose, também formada por glicose, não é digerida por humanos e atua como fibra alimentar.", "int": "Comparar em uma tabela amido, glicogênio, celulose e triglicerídeos (onde ocorrem, função, se humanos digerem) e discutir por que “mais energia” não significa “energia mais rápida”."}, {"id": "BQ3", "area": "Bioquímica", "ponto": "Ácidos nucleicos: DNA × RNA; DNA não é proteína; a maioria dos genes codifica proteínas", "html": "<p>A tabela resume a análise de duas moléculas, X e Y, extraídas de uma célula humana.<\/p><div class=\"qt\"><table><thead><tr><th>Característica<\/th><th>Molécula X<\/th><th>Molécula Y<\/th><\/tr><\/thead><tbody><tr><td>Açúcar<\/td><td>desoxirribose<\/td><td>ribose<\/td><\/tr><tr><td>Bases nitrogenadas<\/td><td>A, T, C, G<\/td><td>A, U, C, G<\/td><\/tr><tr><td>Número de fitas<\/td><td>duas<\/td><td>uma<\/td><\/tr><\/tbody><\/table><\/div>", "cmd": "Sobre essas moléculas, assinale a alternativa correta.", "alts": {"a": "X é o DNA, uma proteína em dupla-hélice formada por aminoácidos; Y é o RNA, uma versão menor dessa proteína, com uma só fita.", "b": "X é o RNA e Y é o DNA, pois a uracila e a ribose são componentes exclusivos do DNA, a molécula da hereditariedade.", "c": "X é o DNA e Y é o RNA; cada gene de X já é a própria característica (por exemplo, a cor dos olhos), transmitida diretamente, sem participação de Y.", "d": "X é o DNA e Y é o RNA; um gene é um trecho de X transcrito em moléculas como Y, que, em geral, orientam a produção de uma proteína."}, "gab": "d", "eq": {"a": {"nome": "DNA é proteína (formado por aminoácidos)", "exp": "O aluno associa “molécula biológica grande” a proteína; DNA e RNA são ácidos nucleicos, polímeros de nucleotídeos (açúcar, fosfato e base nitrogenada), não de aminoácidos."}, "b": {"nome": "Troca das marcas do DNA e do RNA", "exp": "O aluno inverte açúcares e bases; a timina e a desoxirribose são exclusivas do DNA, e a uracila e a ribose, do RNA."}, "c": {"nome": "Gene = característica pronta", "exp": "O aluno pensa que o gene “é” a característica; o gene é uma sequência de bases que, por meio do RNA, orienta a produção de proteínas, e estas participam da formação da característica."}}, "ok": "DNA: desoxirribose, bases A, T, C, G e, em geral, duas fitas; RNA: ribose, bases A, U, C, G e, em geral, uma fita. Ambos são ácidos nucleicos (polímeros de nucleotídeos), não proteínas. Um gene é um segmento de DNA transcrito em RNA; na maioria dos genes, o RNA mensageiro é traduzido em proteína, que contribui para o fenótipo (alguns genes produzem RNAs funcionais que não são traduzidos).", "int": "Construir com a turma o esquema DNA → RNA → proteína → característica, com modelos de nucleotídeos e de aminoácidos lado a lado para diferenciar os monômeros."}, {"id": "BQ4", "area": "Bioquímica", "ponto": "Proteínas: a sequência de aminoácidos determina forma e função; desnaturação altera a forma, não a sequência", "html": "<p>Ao cozinhar um ovo, a clara, rica em proteínas como a ovalbumina, passa de líquida e transparente a sólida e branca, e não volta ao estado original quando esfria.<\/p>", "cmd": "Sobre o que ocorreu com as moléculas de ovalbumina, assinale a alternativa correta.", "alts": {"a": "O calor quebrou as ligações entre os aminoácidos, e a ovalbumina foi fragmentada em aminoácidos livres, como ocorre na digestão.", "b": "A ovalbumina perdeu a forma tridimensional (desnaturação), mas manteve a sequência de aminoácidos; com outra forma, mudaram suas propriedades.", "c": "O calor trocou a posição de alguns aminoácidos na cadeia, e foi essa nova sequência de aminoácidos que deu à ovalbumina uma nova forma.", "d": "A forma da ovalbumina mudou, mas, como os aminoácidos são os mesmos, ela continuaria exercendo a mesma função biológica se estivesse em um organismo."}, "gab": "b", "eq": {"a": {"nome": "Desnaturação = hidrólise (digestão)", "exp": "O aluno acha que o calor “quebra” a proteína em aminoácidos; a desnaturação rompe interações que mantêm a forma, não as ligações peptídicas, que só são quebradas por hidrólise (como a feita por enzimas digestivas)."}, "c": {"nome": "Mudança de forma exige mudança de sequência (desnaturação = mutação)", "exp": "O aluno confunde desnaturação com alteração da sequência; o calor não reordena aminoácidos, e a sequência só muda quando muda o gene que codifica a proteína."}, "d": {"nome": "Função independe da forma", "exp": "O aluno acha que a função depende só da composição de aminoácidos; a função depende da forma tridimensional, que por sua vez é determinada pela sequência."}}, "ok": "A sequência de aminoácidos (estrutura primária) determina como a cadeia se dobra, e a forma tridimensional determina a função. O calor rompe interações que mantêm o dobramento (desnaturação), sem quebrar as ligações peptídicas: a sequência continua a mesma, mas a forma e as propriedades mudam. As cadeias desenoveladas se ligam umas às outras (agregação), formando uma rede sólida e opaca; por isso a mudança não se desfaz ao esfriar.", "int": "Contrastar três situações — ovo cozido (desnaturação), digestão de proteínas (hidrólise) e anemia falciforme (troca de um aminoácido por mutação) — indicando o que muda em cada uma: forma, ligações ou sequência."}, {"id": "CEL1", "area": "Biologia celular", "ponto": "Osmose: a água vai para o meio hipertônico; hemólise em água destilada; parede impede o rompimento da célula vegetal", "html": "<p>Em um experimento, hemácias humanas e células de folha de uma planta aquática, previamente mantidas em solução salina concentrada, foram colocadas, separadamente, em água destilada. Após alguns minutos, as células foram observadas ao microscópio.<\/p>", "cmd": "Sobre o resultado esperado, assinale a alternativa correta.", "alts": {"a": "As hemácias e as células vegetais perdem água para a água destilada, que é mais “pura” que o citoplasma, e ficam murchas e enrugadas.", "b": "As hemácias ganham água por osmose e sofrem hemólise; as células vegetais também ganham água e ficam túrgidas, mas a parede impede que estourem.", "c": "Tanto as hemácias quanto as células vegetais ganham água até se romperem, pois ambas têm membrana plasmática permeável à água e incham sem limite.", "d": "O volume das células não se altera: os sais saem das células para a água destilada até as concentrações se igualarem, pois na osmose quem se move é o soluto."}, "gab": "b", "eq": {"a": {"nome": "Direção invertida da osmose", "exp": "O aluno acha que a água sai da célula para o meio “mais puro”; na osmose, a água passa do meio hipotônico (água destilada) para o hipertônico (interior da célula)."}, "c": {"nome": "Célula vegetal estoura como a animal", "exp": "O aluno ignora a parede celular, que resiste à pressão de turgor e impede o rompimento da célula vegetal."}, "d": {"nome": "Osmose = movimento do soluto", "exp": "O aluno confunde osmose com difusão de solutos; a membrana é pouco permeável aos íons, e o que se desloca em grande quantidade é a água."}}, "ok": "Na osmose, a água atravessa a membrana do meio hipotônico para o hipertônico. Em água destilada, o citoplasma é hipertônico em relação ao meio: a hemácia, sem parede, incha e sofre hemólise; a célula vegetal fica túrgida, e a parede celular impede seu rompimento.", "int": "Fazer (ou mostrar) a demonstração de fatias de batata ou folhas em água e em salmoura, pedindo que os alunos desenhem setas do movimento da água antes de ver o resultado."}, {"id": "CEL2", "area": "Biologia celular", "ponto": "Mitose × meiose: número de células-filhas e ploidia (meiose reduz à metade, mitose mantém)", "html": "<p>Uma célula humana tem 46 cromossomos (2n = 46). Uma célula da pele de um homem sofre mitose, e um espermatócito de seus testículos sofre meiose, originando células que se diferenciarão em espermatozoides.<\/p>", "cmd": "Quantas células-filhas se formam a partir de cada célula que se divide, e com quantos cromossomos cada uma?", "alts": {"a": "Mitose: 2 células com 23 cromossomos (n); meiose: 4 células com 23 cromossomos (n).", "b": "Mitose: 2 células com 46 cromossomos (2n); meiose: 4 células com 46 cromossomos (2n).", "c": "Mitose: 2 células com 92 cromossomos (4n); meiose: 4 células com 46 cromossomos (2n).", "d": "Mitose: 2 células com 46 cromossomos (2n); meiose: 4 células com 23 cromossomos (n)."}, "gab": "d", "eq": {"a": {"nome": "Toda divisão reduz à metade", "exp": "O aluno acha que “dividir” a célula divide os cromossomos pela metade; na mitose, a duplicação prévia e a separação das cromátides-irmãs mantêm 46 cromossomos em cada célula-filha."}, "b": {"nome": "Meiose = mitose com quatro células", "exp": "O aluno reconhece que a meiose forma 4 células, mas não que ela reduz o número de cromossomos à metade, o que é essencial para que a fecundação restabeleça 2n."}, "c": {"nome": "Duplicação do DNA dobra o número de cromossomos das filhas", "exp": "O aluno soma a duplicação da interfase ao resultado final; a duplicação apenas forma cromátides-irmãs, que são separadas na divisão, sem aumentar o número de cromossomos das células-filhas."}}, "ok": "A mitose forma 2 células geneticamente idênticas à original, com o mesmo número de cromossomos (46, 2n), e serve ao crescimento e à reposição de tecidos. A meiose tem duas divisões sucessivas após uma única duplicação do DNA e forma 4 células com metade dos cromossomos (23, n); na fecundação, 23 + 23 restabelece 46.", "int": "Simular mitose e meiose com modelos de cromossomos (massinha ou barbante) partindo de 2n = 4, contando cromossomos e cromátides em cada etapa."}, {"id": "CEL3", "area": "Biologia celular", "ponto": "Respiração × fotossíntese: plantas respiram dia e noite, nas mitocôndrias; O₂ é o aceptor final de elétrons", "html": "<p>Uma planta cultivada em solução nutritiva estéril foi colocada em uma câmara transparente e hermeticamente fechada, mantida em escuro total por 24 horas. Sensores mediram as concentrações de O₂ e de CO₂ no ar da câmara durante esse período.<\/p>", "cmd": "Assinale a alternativa que descreve corretamente o resultado e sua explicação.", "alts": {"a": "O O₂ diminui e o CO₂ aumenta: a planta continua respirando nas mitocôndrias, onde o O₂ é o aceptor final de elétrons, mesmo sem fotossíntese.", "b": "As concentrações não se alteram: plantas não respiram, pois obtêm energia diretamente da fotossíntese, que no escuro fica interrompida.", "c": "O O₂ aumenta e o CO₂ diminui: as plantas absorvem CO₂ e liberam O₂ continuamente, e essa é a sua forma de respiração.", "d": "O O₂ diminui e o CO₂ aumenta: no escuro, os cloroplastos passam a funcionar ao contrário e fazem a respiração, já que células vegetais não têm mitocôndrias."}, "gab": "a", "eq": {"b": {"nome": "Plantas não respiram", "exp": "O aluno acredita que a fotossíntese substitui a respiração; as células vegetais precisam de ATP o tempo todo e o obtêm pela respiração celular, que usa a glicose produzida na fotossíntese."}, "c": {"nome": "Fotossíntese como “respiração” da planta, contínua", "exp": "O aluno inverte as trocas gasosas da respiração e ignora que a fotossíntese depende de luz; no escuro, só há respiração: consumo de O₂ e liberação de CO₂."}, "d": {"nome": "Plantas sem mitocôndrias (respiração nos cloroplastos)", "exp": "O aluno acerta as trocas gasosas, mas acha que a respiração vegetal ocorre nos cloroplastos; células vegetais têm mitocôndrias, e a respiração é um processo distinto, não a fotossíntese “ao contrário”."}}, "ok": "Plantas respiram dia e noite, nas mitocôndrias, consumindo O₂ (aceptor final de elétrons da cadeia respiratória, que forma água) e liberando CO₂. De dia, com luz suficiente, a fotossíntese supera a respiração e o saldo é de liberação de O₂; no escuro, só a respiração ocorre.", "int": "Discutir um gráfico de O₂ liberado × intensidade luminosa (com valores negativos no escuro e o ponto de compensação) e desfazer a ideia de que plantas “respiram só à noite”."}, {"id": "CEL4", "area": "Biologia celular", "ponto": "Procarioto × eucarioto × vírus: bactérias têm ribossomos e membrana, sem núcleo nem mitocôndrias; vírus não são células", "html": "<p>Um estudante comparou, com base em micrografias eletrônicas e em informações de livros, três agentes: uma bactéria (<i>Escherichia coli<\/i>, capaz de fazer respiração aeróbica), uma levedura (fungo unicelular) e um vírus.<\/p>", "cmd": "Assinale a alternativa correta.", "alts": {"a": "A bactéria, por não ter núcleo, não possui DNA nem ribossomos, sendo uma estrutura tão simples quanto o vírus.", "b": "O vírus é a menor célula procariótica conhecida: assim como a bactéria, tem membrana plasmática, ribossomos e material genético.", "c": "A bactéria tem membrana, ribossomos e DNA, mas não tem núcleo nem mitocôndrias; o vírus não tem ribossomos nem metabolismo e não é célula.", "d": "A bactéria, assim como a levedura, possui mitocôndrias, pois faz respiração aeróbica; a diferença entre elas é apenas a ausência de núcleo na bactéria."}, "gab": "c", "eq": {"a": {"nome": "Sem núcleo = sem DNA (e sem ribossomos)", "exp": "O aluno acha que o DNA só existe dentro de um núcleo; nas bactérias, o DNA fica no citoplasma (nucleoide), e elas têm ribossomos para produzir suas proteínas."}, "b": {"nome": "Vírus é uma célula (bactéria pequena)", "exp": "O aluno trata o vírus como um micróbio celular; vírus não têm ribossomos nem metabolismo próprio e só se reproduzem dentro de células hospedeiras."}, "d": {"nome": "Respiração aeróbica exige mitocôndria", "exp": "O aluno associa respiração aeróbica obrigatoriamente à mitocôndria; nas bactérias, a cadeia respiratória fica na membrana plasmática, e elas não têm organelas membranosas."}}, "ok": "Bactérias são procariontes: têm membrana plasmática, citoplasma, ribossomos e DNA (no nucleoide), mas não têm núcleo nem organelas membranosas, como mitocôndrias. Leveduras são eucariontes, com núcleo e mitocôndrias. Vírus são acelulares: material genético envolto por um capsídeo de proteína (às vezes também por um envelope lipídico), sem ribossomos nem metabolismo, dependentes de uma célula hospedeira.", "int": "Montar uma tabela de presença/ausência (membrana, ribossomos, DNA, núcleo, mitocôndria, metabolismo próprio) para bactéria, célula animal, célula vegetal, fungo e vírus, relacionando-a ao alvo dos antibióticos."}, {"id": "GEN1", "area": "Genética", "ponto": "Probabilidade independente: cada gestação de Aa × Aa tem 1/4 de chance de aa, qualquer que seja o histórico", "html": "<p>A fibrose cística é uma doença autossômica recessiva. Um casal em que ambos são heterozigotos (Aa) tem três filhos, e os três são afetados (aa). O casal espera agora o quarto filho.<\/p>", "cmd": "Qual é a probabilidade de o quarto filho ser afetado?", "alts": {"a": "1/4, pois cada gestação é um evento independente, e os resultados anteriores não alteram a probabilidade.", "b": "Praticamente nula, pois o casal já teve mais filhos afetados do que o esperado, e agora os próximos tendem a ser normais para compensar.", "c": "1/256, pois essa é a probabilidade de nascerem quatro filhos afetados em sequência: (1/4)⁴.", "d": "Maior que 1/4, pois a sequência de três filhos afetados mostra que esse casal tende a transmitir o alelo a com mais frequência."}, "gab": "a", "eq": {"b": {"nome": "Falácia da compensação (do jogador)", "exp": "O aluno acha que a proporção 3 : 1 precisa “se cumprir” em cada família; proporções mendelianas são probabilidades, e o acaso não compensa resultados passados."}, "c": {"nome": "Probabilidade de um evento × de uma sequência", "exp": "O aluno calcula a chance de toda a sequência de quatro filhos afetados, mas três já nasceram; a pergunta é sobre um único evento futuro, com chance 1/4."}, "d": {"nome": "Tendência familiar (“mão quente”)", "exp": "O aluno acha que resultados repetidos revelam uma tendência do casal; como ambos são Aa, cada gameta tem 1/2 de chance de levar o alelo a, em qualquer gestação."}}, "ok": "Cada fecundação é independente das anteriores: a chance de um filho de Aa × Aa ser aa é 1/2 × 1/2 = 1/4, em qualquer gestação. A regra do “e” (multiplicação de probabilidades) só se aplica quando se pergunta a chance de uma sequência de eventos que ainda não ocorreram.", "int": "Simular gestações com duas moedas (A/a) lançadas por vários grupos e comparar as “famílias” individuais com o total da turma, discutindo por que o 1/4 vale para cada lançamento."}, {"id": "GEN2", "area": "Genética", "ponto": "Herança ligada ao X: o pai não transmite seu X ao filho homem e o transmite a todas as filhas", "html": "<p>O daltonismo é determinado por um alelo recessivo (d) localizado no cromossomo X. Um homem daltônico (X^d Y) tem filhos com uma mulher de visão normal e homozigota (X^D X^D).<\/p>", "cmd": "Quanto aos descendentes desse casal, assinale a alternativa correta.", "alts": {"a": "Todos os filhos, homens e mulheres, serão portadores (Dd) e terão visão normal, pois cada um recebe um alelo d do pai e um alelo D da mãe.", "b": "Todos os filhos homens serão daltônicos, pois herdam do pai as características determinadas pelos cromossomos sexuais.", "c": "Nenhum filho homem herdará o alelo d, pois recebe do pai o cromossomo Y; todas as filhas serão portadoras, com visão normal.", "d": "Todas as filhas serão daltônicas, pois recebem obrigatoriamente do pai o cromossomo X com o alelo d, que se manifesta nelas."}, "gab": "c", "eq": {"a": {"nome": "Herança ligada ao X tratada como autossômica", "exp": "O aluno aplica o raciocínio de genes autossômicos (dd × DD → todos Dd), mas o pai tem um único X e o passa só às filhas; os filhos homens recebem o Y e não herdam o alelo d."}, "b": {"nome": "Pai passa o X ao filho homem", "exp": "O aluno associa “herança ligada ao sexo” a “passar de pai para filho”; o filho homem recebe do pai o Y, e seu X vem sempre da mãe."}, "d": {"nome": "Recessivo se manifesta mesmo em heterozigose", "exp": "O aluno acerta que todas as filhas recebem o alelo d, mas esquece que elas também recebem X^D da mãe; sendo X^D X^d, têm visão normal, pois o alelo recessivo não se manifesta em heterozigose."}}, "ok": "O pai transmite seu X a todas as filhas e seu Y a todos os filhos. Assim, todas as filhas serão X^D X^d (portadoras, visão normal) e todos os filhos serão X^D Y (visão normal). Na herança recessiva ligada ao X, não há transmissão de pai para filho homem.", "int": "Montar o quadro de Punnett com os cromossomos sexuais desenhados (X e Y de tamanhos diferentes) e seguir o caminho do X do pai em heredogramas."}, {"id": "GEN3", "area": "Genética", "ponto": "Dominante ≠ mais frequente nem “mais forte”; genótipo × fenótipo; alelo × gene", "html": "<p>A acondroplasia, uma forma de nanismo, é causada por um alelo dominante de um gene envolvido no crescimento dos ossos. Mesmo assim, é rara: a grande maioria das pessoas é homozigota recessiva e tem estatura típica. Um estudante estranhou: “Se o alelo é dominante, ele não deveria ser o mais comum?”<\/p>", "cmd": "Assinale a alternativa que responde corretamente ao estudante.", "alts": {"a": "Com o passar das gerações, o alelo dominante tende a substituir o recessivo, por ser mais forte, e a acondroplasia se tornará comum.", "b": "Dominância indica apenas que o alelo se manifesta no fenótipo do heterozigoto; ela não determina a frequência desse alelo na população.", "c": "O estudante tem razão: se a acondroplasia é rara, o alelo que a causa deve ser, na verdade, recessivo.", "d": "As pessoas de estatura típica não possuem o gene relacionado à acondroplasia; só as pessoas afetadas têm esse gene."}, "gab": "b", "eq": {"a": {"nome": "Dominante = mais forte (tende a se espalhar)", "exp": "O aluno acha que dominância é uma vantagem que faz o alelo aumentar de frequência; a frequência depende de seleção, mutação, deriva e migração, não da dominância."}, "c": {"nome": "Frequência determina dominância", "exp": "O aluno deduz a dominância pela frequência na população; dominância se define pelo fenótipo do heterozigoto (Aa), e alelos dominantes podem ser raros."}, "d": {"nome": "Gene × alelo (ter o gene = ter a condição)", "exp": "O aluno confunde gene com alelo; todas as pessoas têm o gene, e o que varia entre elas são os alelos (versões) desse gene."}}, "ok": "Dominância descreve a relação entre alelos no heterozigoto: o alelo dominante determina o fenótipo mesmo em dose única (Aa). Não tem relação com frequência nem com “força”. Todas as pessoas têm o gene; a maioria tem dois alelos recessivos (aa, estatura típica), e os afetados têm ao menos um alelo dominante. Quase todos os afetados são heterozigotos (Aa); o genótipo AA costuma ser letal.", "int": "Listar exemplos de alelos dominantes raros (acondroplasia, doença de Huntington) e recessivos comuns (alelo i, do tipo sanguíneo O) e fixar o vocabulário gene/alelo/genótipo/fenótipo com um quadro-resumo."}, {"id": "GEN4", "area": "Genética", "ponto": "Todas as células somáticas têm o mesmo DNA; a diferenciação vem da expressão gênica seletiva", "html": "<p>Um neurônio e uma célula muscular de uma mesma pessoa têm formas e funções muito diferentes: o neurônio produz neurotransmissores, e a célula muscular produz grandes quantidades de proteínas contráteis, como a miosina. Ambas se originaram, por mitoses, do mesmo zigoto.<\/p>", "cmd": "Qual é a explicação correta para essa diferença?", "alts": {"a": "Durante a diferenciação, cada célula perde os genes de que não precisa e conserva apenas aqueles ligados à sua função.", "b": "Cada tipo de célula acumulou mutações diferentes, adequadas à sua função, e por isso neurônio e célula muscular têm DNA diferente.", "c": "Ambas têm os mesmos genes, e todos eles são expressos o tempo todo e na mesma intensidade; por isso, a diferença entre elas não depende dos genes.", "d": "Ambas têm os mesmos genes, mas diferem quanto aos genes que estão sendo transcritos (expressos), o que resulta em proteínas diferentes."}, "gab": "d", "eq": {"a": {"nome": "Diferenciação por perda de genes", "exp": "O aluno acha que a célula especializada “descarta” genes; a clonagem a partir do núcleo de uma célula diferenciada (como na ovelha Dolly) mostra que o genoma completo continua presente."}, "b": {"nome": "Diferenciação por mutações dirigidas", "exp": "O aluno acha que cada tecido tem um DNA “adaptado”; as mitoses copiam o mesmo DNA, e mutações são raras, aleatórias e não direcionadas à função."}, "c": {"nome": "Ter o gene = expressá-lo (todos os genes sempre ativos)", "exp": "O aluno sabe que o DNA é o mesmo, mas acha que ter um gene equivale a usá-lo e, por isso, busca a diferença fora dos genes; a expressão é regulada, e cada tipo celular transcreve um conjunto diferente de genes."}}, "ok": "Todas as células somáticas de um indivíduo derivam do zigoto por mitose e têm, praticamente, o mesmo DNA. A diferenciação resulta da expressão gênica seletiva: cada tipo celular transcreve apenas parte de seus genes e produz RNAs e proteínas específicos (miosina no músculo, enzimas de síntese de neurotransmissores no neurônio).", "int": "Usar a analogia do “livro de receitas completo em cada cozinha, com receitas diferentes em uso” e apresentar a clonagem da ovelha Dolly como evidência de que o genoma não se perde."}, {"id": "EVO1", "area": "Evolução", "ponto": "Lamarckismo: necessidade ou uso/desuso não produzem características herdáveis", "html": "<p>Em cavernas totalmente escuras vivem populações de um peixe com olhos muito reduzidos ou ausentes. Populações da mesma espécie que vivem em rios iluminados têm olhos funcionais. Estudos indicam que os peixes de caverna descendem de ancestrais com olhos normais.<\/p>", "cmd": "Qual explicação é compatível com a teoria evolutiva atual?", "alts": {"a": "Como os olhos não eram usados no escuro, eles atrofiaram ao longo da vida de cada peixe, e essa atrofia foi transmitida aos descendentes.", "b": "A necessidade de economizar energia no escuro levou os organismos dos peixes a produzirem justamente as mutações que reduziram os olhos.", "c": "A escuridão agiu diretamente sobre os embriões, impedindo a formação dos olhos, e essa alteração passou a ser herdada pelas gerações seguintes.", "d": "Variações hereditárias que reduziam os olhos surgiram ao acaso; no escuro, não eram desvantajosas e se tornaram comuns ao longo de muitas gerações."}, "gab": "d", "eq": {"a": {"nome": "Uso e desuso com herança de caracteres adquiridos", "exp": "O aluno aplica o raciocínio de Lamarck; modificações do corpo durante a vida (como a atrofia) não alteram o DNA dos gametas e não são herdadas."}, "b": {"nome": "Necessidade induz mutação", "exp": "O aluno acha que o organismo produz as mutações de que precisa; mutações surgem ao acaso, independentemente de serem úteis, e o ambiente apenas seleciona."}, "c": {"nome": "Ambiente molda diretamente características herdáveis", "exp": "O aluno acha que o ambiente “imprime” mudanças nos descendentes; efeitos do ambiente sobre o desenvolvimento de um indivíduo não se tornam herdáveis por isso."}}, "ok": "Na teoria evolutiva atual, a variação hereditária surge por mutação e recombinação, ao acaso em relação às necessidades do organismo. No escuro, os olhos deixaram de trazer vantagem (e têm custo energético), de modo que variantes com olhos reduzidos não eram eliminadas — ou eram favorecidas — e se acumularam na população ao longo de gerações.", "int": "Pedir que os alunos reescrevam explicações teleológicas (“a girafa esticou o pescoço para alcançar as folhas”) em termos de variação, herança e reprodução diferencial, e discutir por que o filho de um fisiculturista não nasce musculoso."}, {"id": "EVO2", "area": "Evolução", "ponto": "Quem evolui é a população, não o indivíduo: mudança de frequência alélica ao longo de gerações", "html": "<p>Em uma região que se industrializou, a proporção de mariposas escuras em uma população passou de cerca de 2% para 90% ao longo de 50 gerações. A cor é hereditária e determinada principalmente por um gene, cujo alelo para cor escura é dominante. Os troncos das árvores escureceram com a fuligem, tornando as mariposas claras mais visíveis aos pássaros predadores.<\/p>", "cmd": "Sobre esse processo, assinale a alternativa correta.", "alts": {"a": "Cada mariposa clara escureceu gradualmente ao longo da vida, ajustando sua cor aos troncos para escapar dos predadores.", "b": "A população evoluiu: o alelo para cor escura ficou mais frequente ao longo das gerações, sem que nenhuma mariposa mudasse de cor.", "c": "Não houve evolução, pois todas as mariposas continuam pertencendo à mesma espécie; evolução exige o surgimento de uma nova espécie.", "d": "A evolução ocorreu no momento em que nasceu a primeira mariposa escura mutante; o aumento posterior das escuras foi apenas uma consequência."}, "gab": "b", "eq": {"a": {"nome": "O indivíduo evolui (transformação individual)", "exp": "O aluno imagina que cada organismo muda para se adaptar; a cor de cada mariposa é determinada por seus genes, e o que muda é a proporção de claras e escuras na população."}, "c": {"nome": "Evolução = especiação ou grande transformação", "exp": "O aluno só reconhece evolução em mudanças grandes; evolução é qualquer mudança hereditária na frequência de alelos de uma população ao longo das gerações."}, "d": {"nome": "Evolução = surgimento de uma mutação em um indivíduo", "exp": "O aluno confunde a origem da variação com a evolução; uma mutação em um indivíduo é apenas matéria-prima, e a evolução é a mudança de frequência dessa variante na população."}}, "ok": "Indivíduos não evoluem: nascem e morrem com seus genótipos. Evolução é a mudança na frequência de alelos de uma população ao longo de gerações. No exemplo, mariposas escuras sobreviveram e se reproduziram mais, e a proporção do alelo para cor escura aumentou — isso já é evolução, mesmo sem formação de nova espécie.", "int": "Simular a predação com papéis coloridos sobre fundos claro e escuro, registrar em gráfico as proporções de cada cor por “geração” e discutir quem mudou: o indivíduo ou a população."}, {"id": "EVO3", "area": "Evolução", "ponto": "Mutações surgem ao acaso; o antibiótico seleciona resistentes preexistentes, não induz a resistência", "html": "<p>Um paciente com infecção bacteriana tomou um antibiótico e melhorou. Semanas depois, a infecção voltou, e o exame mostrou que quase todas as bactérias presentes eram resistentes àquele antibiótico.<\/p>", "cmd": "Qual explicação é compatível com a teoria evolutiva atual?", "alts": {"a": "Bactérias resistentes, surgidas ao acaso (por mutação ou genes de outras bactérias), já existiam; o antibiótico matou as sensíveis, e elas se multiplicaram.", "b": "O antibiótico provocou nas bactérias as mutações necessárias para resistirem a ele, e essas mutações dirigidas passaram às bactérias descendentes.", "c": "As bactérias foram se habituando ao antibiótico durante a exposição, como quem cria tolerância, e transmitiram essa tolerância às bactérias-filhas.", "d": "O organismo do paciente ficou resistente ao antibiótico depois de tanto usá-lo, e o remédio, por isso, deixou de fazer efeito sobre as bactérias."}, "gab": "a", "eq": {"b": {"nome": "Agente seletivo induz a mutação", "exp": "O aluno acha que o antibiótico “cria” a resistência; variantes resistentes surgem espontaneamente (por mutação ou transferência de genes), mesmo sem contato com o antibiótico, que apenas as seleciona."}, "c": {"nome": "Habituação herdada (lamarckismo)", "exp": "O aluno imagina que cada bactéria se ajusta ao antibiótico e passa o ajuste adiante; tolerâncias adquiridas não alteram o DNA, e a resistência é genética e preexistente."}, "d": {"nome": "Resistência é do paciente, não da bactéria", "exp": "O aluno atribui a resistência ao corpo humano; quem se torna resistente é a população bacteriana, por seleção de variantes com genes de resistência."}}, "ok": "A resistência surge ao acaso, por mutação ou por genes recebidos de outras bactérias (transferência horizontal, como por plasmídeos), independentemente do antibiótico. Numa população bacteriana grande, algumas células já são resistentes antes do tratamento; o antibiótico mata as sensíveis, e as resistentes, sem competidoras, se multiplicam. Por isso, todo uso de antibiótico, sobretudo o desnecessário (como em viroses), seleciona bactérias resistentes; deve-se usá-lo só com indicação médica e pelo tempo prescrito.", "int": "Apresentar o experimento de réplica em placas (Lederberg), em que colônias resistentes são identificadas a partir de placas nunca expostas ao antibiótico, e discutir o uso racional de antibióticos."}, {"id": "EVO4", "area": "Evolução", "ponto": "Aptidão = sucesso reprodutivo relativo, não força, tamanho ou longevidade", "html": "<p>A tabela resume dados de quatro machos de uma mesma população de cervos, acompanhados até a morte.<\/p><div class=\"qt\"><table><thead><tr><th>Macho<\/th><th>Massa corporal (kg)<\/th><th>Longevidade (anos)<\/th><th>Filhotes nascidos<\/th><th>Filhotes que se reproduziram<\/th><\/tr><\/thead><tbody><tr><td>I<\/td><td>130<\/td><td>8<\/td><td>6<\/td><td>3<\/td><\/tr><tr><td>II<\/td><td>95<\/td><td>14<\/td><td>5<\/td><td>2<\/td><\/tr><tr><td>III<\/td><td>100<\/td><td>6<\/td><td>12<\/td><td>9<\/td><\/tr><tr><td>IV<\/td><td>105<\/td><td>9<\/td><td>20<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>", "cmd": "Do ponto de vista evolutivo, qual macho teve a maior aptidão (fitness)?", "alts": {"a": "O macho I, por ser o maior e mais forte, com mais chances de vencer disputas com outros machos.", "b": "O macho II, por ter vivido mais tempo, o que demonstra maior capacidade de sobrevivência.", "c": "O macho III, por ter deixado mais filhotes que chegaram a se reproduzir.", "d": "O macho IV, por ter gerado o maior número de filhotes."}, "gab": "c", "eq": {"a": {"nome": "Aptidão = força/tamanho (“sobrevivência do mais forte”)", "exp": "O aluno lê “mais apto” como “mais forte”; força só aumenta a aptidão se resultar em mais descendentes férteis, o que não ocorreu com o macho I."}, "b": {"nome": "Aptidão = longevidade", "exp": "O aluno acha que o mais apto é quem vive mais; sobreviver só importa evolutivamente se levar à reprodução, e o macho II deixou poucos descendentes."}, "d": {"nome": "Aptidão = número bruto de filhotes", "exp": "O aluno conta filhotes nascidos; o que passa os genes às gerações seguintes são os descendentes que sobrevivem e se reproduzem."}}, "ok": "Aptidão (fitness) é o sucesso reprodutivo relativo: a contribuição de um indivíduo, em descendentes férteis, para as gerações seguintes, em comparação com os demais da população. Força, tamanho e longevidade só importam na medida em que aumentam essa contribuição. O macho III, embora tenha vivido menos, foi o que deixou mais descendentes férteis, a melhor medida de aptidão disponível nos dados.", "int": "Discutir exemplos em que o “mais forte” ou o mais longevo não é o mais apto (cauda vistosa do pavão, espécies que investem em poucos filhotes) e fixar a definição de aptidão como descendência fértil relativa."}, {"id": "FIL1", "area": "Filogenia", "ponto": "Leitura de cladograma: parentesco pelo ancestral comum mais recente; ordem das pontas e rotação dos nós não importam", "html": "<p>Observe o cladograma a seguir, que representa as relações de parentesco entre quatro vertebrados atuais: Salmão, Celacanto, Sapo e Humano. O celacanto é um peixe de nadadeiras carnosas, coberto de escamas, que vive em águas profundas do oceano.<\/p><figure class=\"clado\"><svg viewBox=\"0 0 291 134\" width=\"291\" height=\"134\" role=\"img\" aria-label=\"Cladograma\"><g stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"square\" fill=\"none\"><line x1=\"18\" y1=\"16\" x2=\"18\" y2=\"92.5\"/><line x1=\"18\" y1=\"16\" x2=\"192\" y2=\"16\"/><line x1=\"18\" y1=\"92.5\" x2=\"76\" y2=\"92.5\"/><line x1=\"76\" y1=\"67.0\" x2=\"76\" y2=\"118\"/><line x1=\"76\" y1=\"67.0\" x2=\"134\" y2=\"67.0\"/><line x1=\"134\" y1=\"50\" x2=\"134\" y2=\"84\"/><line x1=\"134\" y1=\"50\" x2=\"192\" y2=\"50\"/><line x1=\"134\" y1=\"84\" x2=\"192\" y2=\"84\"/><line x1=\"76\" y1=\"118\" x2=\"192\" y2=\"118\"/><line x1=\"4\" y1=\"54.25\" x2=\"18\" y2=\"54.25\"/><\/g><g fill=\"currentColor\" font-size=\"14\" font-family=\"Archivo, Arial, sans-serif\"><text x=\"200\" y=\"21\">Salmão<\/text><text x=\"200\" y=\"55\">Humano<\/text><text x=\"200\" y=\"89\">Sapo<\/text><text x=\"200\" y=\"123\">Celacanto<\/text><\/g><\/svg><\/figure>", "cmd": "Com base nesse cladograma, assinale a alternativa correta.", "alts": {"a": "O humano é mais aparentado ao salmão do que ao celacanto, pois humano e salmão aparecem lado a lado no desenho.", "b": "O humano é mais aparentado ao celacanto do que ao salmão, pois humano e celacanto têm um ancestral comum mais recente.", "c": "O salmão é o menos evoluído dos quatro, pois é o primeiro grupo a se ramificar, na base do cladograma.", "d": "O celacanto é mais aparentado ao salmão do que ao sapo, pois ambos são peixes: têm nadadeiras, escamas e respiram por brânquias."}, "gab": "b", "eq": {"a": {"nome": "Parentesco pela vizinhança das pontas", "exp": "O aluno lê o cladograma pela proximidade das pontas; os ramos podem ser girados em torno dos nós sem alterar as relações, e o parentesco é dado pelo ancestral comum mais recente (humano e salmão só se unem no nó mais antigo)."}, "c": {"nome": "Ramo basal = primitivo (escada de progresso)", "exp": "O aluno lê o cladograma como uma escada; todas as espécies atuais evoluíram pelo mesmo tempo desde o ancestral comum, e o ramo que se separa primeiro não é “menos evoluído”."}, "d": {"nome": "Parentesco = semelhança geral (“peixe com peixe”)", "exp": "O aluno usa semelhanças gerais, herdadas de ancestrais antigos (nadadeiras, escamas, brânquias), em vez do cladograma; pela figura, celacanto e sapo têm um ancestral comum mais recente do que celacanto e salmão."}}, "ok": "Em um cladograma, o parentesco é dado pelo ancestral comum mais recente: quanto mais recente o nó que une dois grupos, mais aparentados eles são. Humano, sapo e celacanto compartilham um ancestral que não é ancestral do salmão; por isso o humano é mais aparentado ao celacanto do que ao salmão. Girar os ramos em torno de um nó muda a ordem das pontas, mas não as relações, e semelhanças como nadadeiras e brânquias, herdadas de ancestrais antigos, não indicam parentesco próximo.", "int": "Mostrar o mesmo cladograma desenhado de várias formas (ramos girados) e pedir que os alunos localizem, com o dedo, o nó do ancestral comum mais recente de diferentes pares, incluindo pares em que a intuição (“peixe com peixe”) engana."}, {"id": "FIL2", "area": "Filogenia", "ponto": "Humanos não descendem de chimpanzés: ancestral comum; nenhuma espécie atual é ancestral de outra atual", "html": "<p>Observe o cladograma a seguir, que representa as relações de parentesco entre quatro espécies atuais de grandes primatas: Orangotango, Gorila, Chimpanzé e Humano. Ao ver a figura, um estudante comentou: “Então é verdade que o homem veio do macaco.”<\/p><figure class=\"clado\"><svg viewBox=\"0 0 309 134\" width=\"309\" height=\"134\" role=\"img\" aria-label=\"Cladograma\"><g stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"square\" fill=\"none\"><line x1=\"18\" y1=\"16\" x2=\"18\" y2=\"75.5\"/><line x1=\"18\" y1=\"16\" x2=\"192\" y2=\"16\"/><line x1=\"18\" y1=\"75.5\" x2=\"76\" y2=\"75.5\"/><line x1=\"76\" y1=\"50\" x2=\"76\" y2=\"101.0\"/><line x1=\"76\" y1=\"50\" x2=\"192\" y2=\"50\"/><line x1=\"76\" y1=\"101.0\" x2=\"134\" y2=\"101.0\"/><line x1=\"134\" y1=\"84\" x2=\"134\" y2=\"118\"/><line x1=\"134\" y1=\"84\" x2=\"192\" y2=\"84\"/><line x1=\"134\" y1=\"118\" x2=\"192\" y2=\"118\"/><line x1=\"4\" y1=\"45.75\" x2=\"18\" y2=\"45.75\"/><\/g><g fill=\"currentColor\" font-size=\"14\" font-family=\"Archivo, Arial, sans-serif\"><text x=\"200\" y=\"21\">Orangotango<\/text><text x=\"200\" y=\"55\">Gorila<\/text><text x=\"200\" y=\"89\">Chimpanzé<\/text><text x=\"200\" y=\"123\">Humano<\/text><\/g><\/svg><\/figure>", "cmd": "Com base nesse cladograma, assinale a alternativa correta.", "alts": {"a": "Os humanos descendem dos chimpanzés, que ocupam no cladograma o ramo anterior ao humano, como uma etapa anterior da evolução humana.", "b": "Os chimpanzés atuais estão evoluindo em direção aos humanos e, com tempo suficiente, poderão se tornar humanos, o próximo passo do ramo.", "c": "O ancestral no nó que une chimpanzé e humano era um chimpanzé, pois os chimpanzés quase não mudaram desde então, ao contrário dos humanos.", "d": "O nó que une chimpanzé e humano representa um ancestral comum extinto, que não era nenhuma das duas espécies; nenhuma é ancestral da outra."}, "gab": "d", "eq": {"a": {"nome": "Espécie atual como ancestral de outra atual", "exp": "O aluno lê o cladograma como uma linha de descendência entre espécies atuais; chimpanzés e humanos são ramos irmãos, que partiram de um ancestral comum já extinto."}, "b": {"nome": "Evolução como progresso rumo ao humano", "exp": "O aluno imagina que a evolução tem uma meta; ela não tem direção predefinida, e a linhagem dos chimpanzés evolui em resposta ao seu próprio ambiente."}, "c": {"nome": "Espécie atual “parada no tempo”", "exp": "O aluno acha que uma das linhagens deixou de evoluir; as duas linhagens evoluíram pelo mesmo tempo desde o ancestral comum, que não era igual a nenhuma espécie atual."}}, "ok": "Humanos e chimpanzés são grupos-irmãos: o nó que os une representa um ancestral comum mais recente do que o de qualquer um deles com o gorila. Esse ancestral exclusivo de chimpanzé e humano viveu há cerca de 6 a 7 milhões de anos, está extinto e não era humano nem chimpanzé. Desde a separação, as duas linhagens evoluíram pelo mesmo intervalo de tempo.", "int": "Usar a analogia da árvore genealógica (primos não descendem um do outro, e sim de avós em comum) e localizar no cladograma o nó que representa o ancestral comum."}, {"id": "FIL3", "area": "Filogenia", "ponto": "Grupos monofiléticos × parafiléticos: aves são um ramo dos répteis; “répteis” sem aves é parafilético", "html": "<p>Observe o cladograma a seguir, que relaciona seis grupos atuais de tetrápodes: Anfíbios, Mamíferos, Escamados, Tartarugas, Crocodilos e Aves. Os escamados reúnem lagartos e serpentes. Na classificação tradicional, o grupo “Répteis” reúne escamados, tartarugas e crocodilos, mas exclui as aves.<\/p><figure class=\"clado\"><svg viewBox=\"0 0 416 202\" width=\"416\" height=\"202\" role=\"img\" aria-label=\"Cladograma\"><g stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"square\" fill=\"none\"><line x1=\"18\" y1=\"16\" x2=\"18\" y2=\"81.875\"/><line x1=\"18\" y1=\"16\" x2=\"308\" y2=\"16\"/><line x1=\"18\" y1=\"81.875\" x2=\"76\" y2=\"81.875\"/><line x1=\"76\" y1=\"50\" x2=\"76\" y2=\"113.75\"/><line x1=\"76\" y1=\"50\" x2=\"308\" y2=\"50\"/><line x1=\"76\" y1=\"113.75\" x2=\"134\" y2=\"113.75\"/><line x1=\"134\" y1=\"84\" x2=\"134\" y2=\"143.5\"/><line x1=\"134\" y1=\"84\" x2=\"308\" y2=\"84\"/><line x1=\"134\" y1=\"143.5\" x2=\"192\" y2=\"143.5\"/><line x1=\"192\" y1=\"118\" x2=\"192\" y2=\"169.0\"/><line x1=\"192\" y1=\"118\" x2=\"308\" y2=\"118\"/><line x1=\"192\" y1=\"169.0\" x2=\"250\" y2=\"169.0\"/><line x1=\"250\" y1=\"152\" x2=\"250\" y2=\"186\"/><line x1=\"250\" y1=\"152\" x2=\"308\" y2=\"152\"/><line x1=\"250\" y1=\"186\" x2=\"308\" y2=\"186\"/><line x1=\"4\" y1=\"48.9375\" x2=\"18\" y2=\"48.9375\"/><\/g><g fill=\"currentColor\" font-size=\"14\" font-family=\"Archivo, Arial, sans-serif\"><text x=\"316\" y=\"21\">Anfíbios<\/text><text x=\"316\" y=\"55\">Mamíferos<\/text><text x=\"316\" y=\"89\">Escamados<\/text><text x=\"316\" y=\"123\">Tartarugas<\/text><text x=\"316\" y=\"157\">Crocodilos<\/text><text x=\"316\" y=\"191\">Aves<\/text><\/g><\/svg><\/figure>", "cmd": "Com base nesse cladograma, assinale a alternativa correta.", "alts": {"a": "“Répteis”, no sentido tradicional, é um grupo monofilético, pois todos os seus membros, dos escamados aos crocodilos, descendem de um mesmo ancestral comum.", "b": "Os crocodilos são mais aparentados aos escamados do que às aves, pois crocodilos e escamados pertencem ao grupo tradicional dos “Répteis”.", "c": "“Répteis”, no sentido tradicional, é parafilético: inclui o ancestral comum de seus membros, mas exclui parte dos descendentes dele, as aves.", "d": "Crocodilos e aves não formam um grupo monofilético, pois são muito diferentes entre si: uns têm escamas e são quadrúpedes, e os outros têm penas."}, "gab": "c", "eq": {"a": {"nome": "Monofilia = apenas ter ancestral comum", "exp": "O aluno usa só metade da definição; um grupo monofilético inclui o ancestral comum e todos os seus descendentes, e “répteis” sem aves deixa descendentes de fora."}, "b": {"nome": "Classificação tradicional = parentesco", "exp": "O aluno supõe que os grupos tradicionais refletem proximidade evolutiva; pelo cladograma, crocodilos compartilham com as aves um ancestral mais recente do que com os escamados."}, "d": {"nome": "Grupo natural = organismos parecidos", "exp": "O aluno acha que monofilia depende de semelhança aparente; crocodilos e aves formam um grupo monofilético (arcossauros) porque reúnem um ancestral comum e todos os seus descendentes, apesar das diferenças."}}, "ok": "Um grupo monofilético (clado) reúne um ancestral e todos os seus descendentes. Pelo cladograma, as aves descendem do mesmo ancestral que originou escamados, tartarugas e crocodilos (mais precisamente, de dinossauros, parentes dos crocodilos); por isso, “Répteis” sem as aves é parafilético. Para ser monofilético, o grupo precisa incluir as aves: aves são répteis.", "int": "Pedir que os alunos circulem, em cladogramas, grupos formados por um nó e tudo o que está acima dele, e comparar com grupos tradicionais como “peixes” e “répteis”."}, {"id": "FIL4", "area": "Filogenia", "ponto": "Homologia × analogia: asa de ave × asa de inseto (convergência); membros de vertebrados homólogos", "html": "<p>Considere quatro estruturas: a asa de uma ave, a asa de uma borboleta, o braço humano e a nadadeira peitoral de uma baleia. As três estruturas de vertebrados têm o mesmo padrão de ossos (um osso no braço, dois no antebraço, ossos do punho e dos dedos); a asa da borboleta não tem ossos: é uma lâmina de cutícula sustentada por nervuras.<\/p>", "cmd": "Assinale a alternativa correta.", "alts": {"a": "As asas da ave e da borboleta são análogas (convergência); a asa da ave, o braço humano e a nadadeira da baleia são homólogos.", "b": "As asas da ave e da borboleta são homólogas, pois ambas desempenham a mesma função: permitir o voo do animal.", "c": "O braço humano e a nadadeira da baleia são análogos, pois têm funções e aparências diferentes, apesar de terem o mesmo padrão de ossos.", "d": "A semelhança de função entre as asas da ave e da borboleta indica que esses dois grupos são parentes próximos, descendentes de um ancestral alado recente."}, "gab": "a", "eq": {"b": {"nome": "Homologia = mesma função", "exp": "O aluno define homologia pela função; estruturas homólogas têm a mesma origem evolutiva, e estruturas com a mesma função e origens diferentes são análogas."}, "c": {"nome": "Funções diferentes excluem homologia", "exp": "O aluno acha que estruturas homólogas precisam ter a mesma função; o padrão ósseo comum revela herança de um ancestral, e a diferença de funções resulta de adaptação a modos de vida diferentes."}, "d": {"nome": "Convergência lida como parentesco", "exp": "O aluno toma semelhanças por analogia como evidência de parentesco próximo; aves e insetos adquiriram asas independentemente, sob pressões seletivas semelhantes."}}, "ok": "Estruturas homólogas têm a mesma origem evolutiva, ainda que hoje tenham funções diferentes (divergência adaptativa), como os membros anteriores dos vertebrados. Estruturas análogas têm função semelhante, mas origens diferentes, resultado de convergência evolutiva, como as asas de aves e de insetos. Apenas as homologias servem como evidência de parentesco.", "int": "Comparar esquemas dos membros anteriores de vertebrados com a asa de um inseto, pintando os ossos correspondentes da mesma cor, e discutir outros casos de convergência (forma do corpo de golfinho × tubarão)."}, {"id": "ZOO1", "area": "Zoologia", "ponto": "Classificação por características, não por habitat (cetáceos são mamíferos; tubarão é peixe)", "html": "<p>Um estudante montou um cartaz com quatro animais marinhos: golfinho, baleia-jubarte, tubarão-branco e sardinha. Ele concluiu que todos pertencem ao mesmo grupo, os peixes, porque vivem no mar, têm corpo hidrodinâmico e nadadeiras.<\/p>", "cmd": "Assinale a alternativa correta.", "alts": {"a": "O estudante está certo: os vertebrados são classificados pelo ambiente em que vivem e pela forma do corpo, e todos esses animais são aquáticos e nadadores.", "b": "Golfinho e baleia são mamíferos, pois as fêmeas têm glândulas mamárias e amamentam; tubarão (peixe cartilaginoso) e sardinha (peixe ósseo) são peixes.", "c": "Golfinho, baleia e tubarão-branco são mamíferos, pois os filhotes se desenvolvem dentro da mãe e nascem já formados; só a sardinha, que põe ovos, é peixe.", "d": "Golfinho e baleia são mamíferos, mas, por viverem na água, respiram por brânquias enquanto estão mergulhados e usam os pulmões apenas quando sobem à superfície."}, "gab": "b", "eq": {"a": {"nome": "Classificação pelo habitat", "exp": "O aluno agrupa os animais pelo ambiente e pela forma do corpo, mas corpo hidrodinâmico e nadadeiras são adaptações ao meio, que surgem em grupos diferentes; a classificação usa características como glândulas mamárias, pelos e tipo de respiração (pulmões × brânquias)."}, "c": {"nome": "Nascer vivo = mamífero", "exp": "O aluno acha que viviparidade define mamíferos, mas vários peixes (como tubarões) e répteis têm filhotes que nascem já formados, e há mamíferos que põem ovos (ornitorrinco); o que define mamífero são glândulas mamárias e pelos."}, "d": {"nome": "Animal aquático respira por brânquias", "exp": "O aluno supõe que viver na água obriga a respirar por brânquias, mas cetáceos só têm pulmões e prendem a respiração no mergulho, voltando à superfície para respirar pelo espiráculo."}}, "ok": "Golfinhos e baleias são mamíferos: respiram exclusivamente por pulmões, têm glândulas mamárias e alguns pelos. Tubarões são peixes cartilaginosos, e a sardinha é peixe ósseo. A semelhança de forma entre eles é convergência adaptativa ao meio aquático, não parentesco próximo.", "int": "Montar com os alunos uma tabela de características diagnósticas (respiração, tegumento, reprodução, mamas) e classificar animais &#x27;enganosos&#x27; (baleia, morcego, pinguim, peixe-boi) apenas por ela, sem olhar o habitat."}, {"id": "ZOO2", "area": "Zoologia", "ponto": "Artrópodes: insetos (6 patas, 3 tagmas, antenas) × aracnídeos (8 patas, cefalotórax, sem antenas)", "html": "<p>Numa aula de campo, alunos coletaram uma formiga, uma aranha, um escorpião e um besouro. Um deles afirmou: “Todos são insetos, porque são pequenos, têm patas articuladas e exoesqueleto.”<\/p>", "cmd": "Assinale a alternativa correta.", "alts": {"a": "O aluno está certo: patas articuladas e exoesqueleto são características exclusivas dos insetos, e por isso todos os quatro animais coletados pertencem a esse grupo.", "b": "Formiga, besouro e aranha são insetos, pois são pequenos e vivem no chão; só o escorpião, por ter ferrão na cauda e pinças, deve ser classificado como aracnídeo.", "c": "Formiga e besouro são insetos, com seis patas; aranha e escorpião são aracnídeos, com oito patas, mas, como os insetos, têm um par de antenas e corpo dividido em cabeça, tórax e abdome.", "d": "Formiga e besouro são insetos (seis patas, corpo em cabeça, tórax e abdome, um par de antenas); aranha e escorpião são aracnídeos (oito patas, cefalotórax e abdome, sem antenas)."}, "gab": "d", "eq": {"a": {"nome": "Inseto = qualquer artrópode (\"bichinho\")", "exp": "O aluno usa &quot;inseto&quot; como sinônimo de artrópode ou de bicho pequeno, mas patas articuladas e exoesqueleto são comuns a todos os artrópodes (insetos, aracnídeos, crustáceos, miriápodes)."}, "b": {"nome": "Aranha é inseto", "exp": "O aluno classifica pelo tamanho e pelo modo de vida e só reconhece o escorpião como diferente, mas a aranha tem oito patas, cefalotórax e não tem antenas, exatamente como o escorpião."}, "c": {"nome": "Plano corporal do inseto generalizado", "exp": "O aluno acerta o número de patas, mas estende aos aracnídeos as antenas e os três tagmas dos insetos; aracnídeos não têm antenas (os apêndices anteriores são quelíceras e pedipalpos) e têm o corpo em cefalotórax e abdome."}}, "ok": "Insetos e aracnídeos são classes de artrópodes. Insetos têm três pares de patas, corpo dividido em cabeça, tórax e abdome e um par de antenas. Aracnídeos (aranhas, escorpiões, carrapatos, ácaros) têm quatro pares de patas nos adultos e não têm antenas; em aranhas e escorpiões, o corpo divide-se em cefalotórax e abdome.", "int": "Fazer uma prática de observação (ou com imagens) contando patas, tagmas e antenas de vários artrópodes e construir uma chave dicotômica simples."}, {"id": "ZOO3", "area": "Zoologia", "ponto": "Excreta nitrogenada × ambiente e desenvolvimento (amônia, ureia, ácido úrico)", "html": "<p>A tabela mostra o principal excreta nitrogenado de três animais de ambientes e modos de desenvolvimento diferentes.<\/p><div class=\"qt\"><table><thead><tr><th>Animal<\/th><th>Principal excreta nitrogenado<\/th><\/tr><\/thead><tbody><tr><td>Peixe ósseo de água doce<\/td><td>Amônia<\/td><\/tr><tr><td>Ser humano<\/td><td>Ureia<\/td><\/tr><tr><td>Galinha<\/td><td>Ácido úrico<\/td><\/tr><\/tbody><\/table><\/div>", "cmd": "Sobre a excreção de ácido úrico pela galinha, assinale a alternativa correta.", "alts": {"a": "O ácido úrico é pouco tóxico e pouco solúvel, sendo eliminado com pouquíssima água; isso economiza água e permite ao embrião acumulá-lo dentro do ovo com casca.", "b": "A galinha produz ácido úrico porque se alimenta de grãos; animais que comem carne, como muitos peixes, e os seres humanos, de dieta variada, produzem outros excretas.", "c": "Ácido úrico e amônia são os excretas mais tóxicos e, por isso, precisam de grande volume de água para serem diluídos e eliminados, como ocorre em peixes e aves.", "d": "As aves não têm rins nem produzem urina; o ácido úrico é formado no intestino e eliminado diretamente com as fezes, na parte esbranquiçada das excretas."}, "gab": "a", "eq": {"b": {"nome": "Tipo de excreta determinado pela dieta", "exp": "O aluno acha que o excreta depende do alimento ingerido, mas ele é uma característica do grupo, relacionada à disponibilidade de água e ao tipo de desenvolvimento embrionário, não ao cardápio."}, "c": {"nome": "Ácido úrico tóxico como a amônia", "exp": "O aluno inverte as propriedades: a amônia é muito tóxica e exige muita água, mas o ácido úrico é o menos tóxico e o que exige menos água, justamente por isso é vantajoso em ambiente seco."}, "d": {"nome": "Aves sem rins (excreta = fezes)", "exp": "O aluno interpreta a parte branca das excretas como produto intestinal, mas aves têm rins, que excretam o ácido úrico (formado principalmente no fígado), eliminado pela cloaca junto com as fezes."}}, "ok": "A amônia é muito tóxica e solúvel e só é viável quando há muita água (animais aquáticos). A ureia é menos tóxica e exige água moderada (mamíferos, anfíbios adultos). O ácido úrico, quase insolúvel e pouco tóxico, economiza água e pode ser armazenado no ovo com casca; por isso predomina em aves, na maioria dos répteis terrestres e em insetos.", "int": "Montar um quadro relacionando excreta × toxicidade × água gasta × ambiente × tipo de ovo, discutindo por que o embrião dentro de um ovo fechado não poderia acumular amônia."}, {"id": "ZOO4", "area": "Zoologia", "ponto": "Anfíbios × répteis: ovo amniótico e independência da água", "html": "<p>Sapos e lagartos adultos vivem em terra firme, mas a maioria dos sapos depende de ambientes úmidos e de água para se reproduzir, enquanto muitos lagartos vivem em desertos e se reproduzem longe de rios e lagos.<\/p>", "cmd": "Qual das alternativas explica corretamente essa diferença?", "alts": {"a": "Os sapos adultos respiram principalmente por brânquias, como os girinos, e por isso precisam voltar com frequência à água; os lagartos respiram por pulmões.", "b": "Sapos e lagartos põem ovos semelhantes, protegidos por casca; o sapo depende de ambientes úmidos apenas porque sua pele precisa ficar molhada, e não por causa da reprodução.", "c": "Os répteis têm ovo amniótico (em geral com casca) e pele queratinizada, que evitam a desidratação; os anfíbios têm ovos sem casca, postos na água, e pele fina e úmida.", "d": "Os lagartos são animais de &quot;sangue quente&quot; (endotérmicos), que produzem o próprio calor e assim resistem ao deserto; já os sapos, de &quot;sangue frio&quot;, dependem da água para se manterem vivos."}, "gab": "c", "eq": {"a": {"nome": "Anfíbio adulto respira por brânquias", "exp": "O aluno estende ao adulto a respiração do girino, mas o sapo adulto respira por pulmões e pela pele úmida (respiração cutânea); sua dependência da água está na pele e na reprodução."}, "b": {"nome": "Ovo de anfíbio com casca", "exp": "O aluno supõe que todos os vertebrados terrestres põem ovos iguais, mas o ovo dos anfíbios não tem casca nem âmnio e desidrata fora da água; é o ovo amniótico que liberta os répteis da água."}, "d": {"nome": "Répteis endotérmicos", "exp": "O aluno associa sobreviver no deserto a produzir calor, mas lagartos, como sapos, são ectotérmicos; a vantagem deles é conservar água (pele queratinizada, ovo com casca, ácido úrico)."}}, "ok": "Anfíbios têm pele fina, úmida e permeável, usada na respiração cutânea, e ovos sem casca que precisam de água ou muita umidade; em geral a fecundação é externa e há larva aquática. Répteis têm pele queratinizada, fecundação interna e ovo amniótico (em geral com casca), que protege o embrião da desidratação e permite a reprodução em terra seca; alguns répteis são vivíparos.", "int": "Comparar com os alunos um ovo de sapo (desova gelatinosa) e um ovo de réptil/ave, identificando âmnio, córion, alantoide e casca e a função de cada um contra a desidratação."}, {"id": "BOT1", "area": "Botânica", "ponto": "Origem da massa da planta: CO2 fixado na fotossíntese, não o \"alimento\" do solo", "html": "<p>Uma muda de 2 kg foi plantada em um vaso com 100 kg de terra seca e regada apenas com água durante cinco anos. Ao final, a árvore pesava cerca de 75 kg (dos quais cerca de metade era água), enquanto a terra, novamente seca e pesada, havia perdido só algumas dezenas de gramas.<\/p>", "cmd": "De onde veio a maior parte da matéria orgânica (massa seca) acumulada pela planta?", "alts": {"a": "Dos nutrientes minerais da terra, que são o alimento da planta; como a planta absorve apenas o necessário, a perda de massa do solo foi pequena, mas suficiente.", "b": "Da água usada na rega, que foi absorvida pelas raízes e transformada diretamente em madeira e folhas, já que foi o único material fornecido à planta.", "c": "Do gás carbônico do ar, fixado na fotossíntese com o hidrogênio da água em glicose, depois convertida em celulose e outras moléculas.", "d": "Da luz do Sol, que durante a fotossíntese é convertida em matéria e se acumula nos tecidos da planta na forma de açúcares, amido e celulose."}, "gab": "c", "eq": {"a": {"nome": "Planta \"se alimenta\" do solo", "exp": "O aluno vê o solo como fonte de alimento, mas os minerais absorvidos respondem por uma fração mínima da massa seca, como mostra a perda de apenas algumas dezenas de gramas de terra."}, "b": {"nome": "Água vira massa da planta", "exp": "O aluno conclui que, se só foi dada água, ela virou madeira; mas a água fornece apenas o hidrogênio (e a maior parte dela, mais de 90%, é perdida na transpiração), enquanto o carbono e a maior parte do oxigênio da matéria orgânica vêm do CO2."}, "d": {"nome": "Luz convertida em matéria", "exp": "O aluno confunde energia com matéria: a luz fornece a energia que é armazenada nas ligações químicas dos açúcares, mas não se transforma em átomos."}}, "ok": "A massa seca de uma planta é formada sobretudo por moléculas orgânicas ricas em carbono (celulose, amido, proteínas). Esse carbono vem do CO2 atmosférico, fixado na fotossíntese; a água contribui com hidrogênio, e os minerais do solo, com uma pequena fração. A luz fornece energia, não matéria.", "int": "Fazer o balanço de átomos da equação da fotossíntese (6 CO2 + 6 H2O → C6H12O6 + 6 O2) e perguntar de onde vêm os carbonos da celulose de um tronco."}, {"id": "BOT2", "area": "Botânica", "ponto": "Xilema (seiva bruta, ascendente, células mortas) × floema (seiva elaborada, fontes → drenos, células vivas)", "html": "<p>Um agricultor retirou um anel completo da casca do tronco de uma árvore, removendo o floema, mas sem atingir o lenho (xilema). Nas semanas seguintes, as folhas continuaram verdes e hidratadas, e a região do tronco logo acima do corte ficou mais grossa.<\/p>", "cmd": "Qual alternativa explica corretamente essas observações?", "alts": {"a": "O xilema seguiu levando água às folhas; sem o floema, os açúcares vindos das folhas ficaram retidos acima do anel, estimulando o crescimento ali, e as raízes tendem a morrer.", "b": "O engrossamento é seiva bruta acumulada: a água e os sais minerais descem das folhas para as raízes pela casca, e o corte bloqueou essa descida, mas as folhas continuam recebendo água.", "c": "As folhas continuarão saudáveis indefinidamente, porque o alimento da planta é produzido nas raízes a partir do solo e sobe até as folhas pelo xilema, que não foi atingido.", "d": "A casca tem apenas função de proteção do tronco, sem papel no transporte; o engrossamento é só uma cicatrização do ferimento, e a árvore continuará saudável indefinidamente."}, "gab": "a", "eq": {"b": {"nome": "Xilema e floema trocados", "exp": "O aluno inverte os tecidos: a seiva bruta (água e sais) sobe pelo xilema, no lenho; o que corre na casca, das folhas para baixo, é a seiva elaborada, no floema."}, "c": {"nome": "Raiz produz o alimento da planta", "exp": "O aluno pensa que o açúcar vem do solo e sobe pelo xilema, mas os açúcares são produzidos nas folhas pela fotossíntese e distribuídos pelo floema às raízes e a outros drenos."}, "d": {"nome": "Casca só protege", "exp": "O aluno ignora que a parte interna da casca contém o floema; removê-lo interrompe o transporte de açúcares, o que acaba matando as raízes e depois a árvore."}}, "ok": "O xilema, formado por vasos de células mortas, conduz a seiva bruta (água e sais) das raízes às folhas. O floema, formado por células vivas e localizado na casca, conduz a seiva elaborada (açúcares) das fontes, como as folhas, aos drenos, como raízes, frutos e caules. No anel de Malpighi, o xilema mantém as folhas hidratadas, mas as raízes deixam de receber açúcares.", "int": "Desenhar um esquema de caule com xilema e floema, com setas de sentido e conteúdo de cada seiva, e prever os efeitos de diferentes cortes (anel na casca × corte do lenho)."}, {"id": "BOT3", "area": "Botânica", "ponto": "Fruto × semente: fruto é o ovário desenvolvido; só angiospermas têm fruto", "html": "<p>Na feira, uma estudante separou os produtos em “frutas” (banana, uva, laranja) e “legumes” (tomate, pepino, vagem de feijão, abobrinha). Levou também pinhões, da araucária, uma gimnosperma. A professora explicou que, em Botânica, a classificação é outra.<\/p>", "cmd": "Assinale a alternativa correta.", "alts": {"a": "Tomate, pepino, vagem e abobrinha não são frutos, pois em Botânica fruto é a estrutura carnosa e adocicada, consumida como sobremesa, que envolve as sementes.", "b": "O tomate e o pepino são frutos, mas a vagem de feijão é uma semente, pois é a parte da planta que, colocada no solo, dá origem a uma nova planta de feijão.", "c": "Tomate, pepino, vagem e abobrinha são frutos, e o pinhão também é fruto, pois toda planta que produz sementes as forma dentro de um fruto, que as protege.", "d": "Tomate, pepino, vagem e abobrinha são frutos, pois se formam a partir do ovário da flor; o pinhão é semente, pois gimnospermas não têm ovário nem fruto."}, "gab": "d", "eq": {"a": {"nome": "Critério culinário (fruto = doce)", "exp": "O aluno usa o critério da cozinha, mas em Botânica fruto é qualquer ovário desenvolvido, seja doce, seco ou salgado."}, "b": {"nome": "Vagem = semente", "exp": "O aluno confunde o fruto com a semente: a vagem é o fruto (ovário desenvolvido) e os grãos de feijão dentro dela são as sementes (óvulos desenvolvidos)."}, "c": {"nome": "Toda semente vem em fruto", "exp": "O aluno generaliza para todas as plantas com semente, mas gimnospermas não têm flores com ovário e, portanto, não formam fruto; suas sementes ficam expostas."}}, "ok": "Após a fecundação, o óvulo se desenvolve em semente e o ovário, em fruto. Por isso tomate, pepino, vagem, abobrinha, pimentão e milho são frutos (já a maçã e o caju são pseudofrutos: a parte carnosa vem de outras partes da flor). Só angiospermas têm ovário e, portanto, fruto; nas gimnospermas, como a araucária, as sementes são nuas, e o pinhão é uma semente.", "int": "Abrir em aula uma flor e um fruto (vagem, tomate), relacionando ovário → fruto e óvulo → semente, e contrastar com um estróbilo (pinha) de araucária ou de pinheiro."}, {"id": "BOT4", "area": "Botânica", "ponto": "Alternância de gerações: gametófito dominante nas briófitas; pteridófitas vasculares, sem sementes e sem flores", "html": "<p>Em um barranco úmido havia um musgo
