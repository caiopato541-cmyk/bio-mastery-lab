<script>
  // Dados do teste (espelho do Questoes.gs do Apps Script).
  var DADOS = {"config": {"curso": "Bio em Casa", "titulo": "Teste de Performance ENEM – Biologia", "versao": "enem-bio-v1", "tempoSugeridoMin": 90, "ctaTexto": "Quero estudar com o Bio em Casa", "ctaDescricao": "Os módulos marcados como prioridade são exatamente onde as aulas do Bio em Casa podem fazer mais diferença na sua nota.", "ctaLink": "enem.html", "metas": {"geral": 0.7, "Fácil": 0.9, "Médio": 0.7, "Difícil": 0.5, "modulo": 0.66}, "faixas": [{"min": 0.8, "nome": "Avançado", "texto": "Você domina a maior parte da biologia cobrada no ENEM. Agora o ganho está nos detalhes: revise os módulos abaixo da meta e treine questões difíceis com tempo marcado."}, {"min": 0.6, "nome": "Bom", "texto": "Você tem uma base sólida. Fechar as lacunas dos módulos marcados abaixo é o caminho mais curto para subir de faixa."}, {"min": 0.4, "nome": "Intermediário", "texto": "Você já reconhece vários conceitos, mas ainda perde pontos em temas que caem todo ano. Siga a ordem de prioridade abaixo."}, {"min": 0, "nome": "Base em construção", "texto": "Este é o ponto de partida, não o resultado final. Comece pelos módulos de prioridade e refaça o teste depois de estudá-los."}]}, "modulos": [{"id": 1, "nome": "Bioquímica"}, {"id": 2, "nome": "Biologia Celular"}, {"id": 3, "nome": "Genética"}, {"id": 4, "nome": "Evolução"}, {"id": 5, "nome": "Embriologia"}, {"id": 6, "nome": "Histologia"}, {"id": 7, "nome": "Classificação dos Seres Vivos"}, {"id": 8, "nome": "Zoologia"}, {"id": 9, "nome": "Botânica"}, {"id": 10, "nome": "Fisiologia"}, {"id": 11, "nome": "Ecologia"}, {"id": 12, "nome": "Diversidade dos Seres"}], "questoes": [{"modulo": 1, "nivel": "Fácil", "subtema": "Sais minerais e nutrição", "texto": "<p>Uma campanha de saúde pública em uma comunidade ribeirinha identificou alta prevalência de anemia ferropriva entre crianças. A equipe recomendou o consumo de feijão, folhas verde-escuras e carnes, acompanhados de frutas cítricas, além de suplementação orientada por profissionais de saúde.</p>", "comando": "A recomendação se justifica porque o ferro é um componente essencial da", "alternativas": ["insulina, hormônio que regula a glicemia.", "hemoglobina, proteína responsável pelo transporte de oxigênio no sangue.", "queratina, proteína estrutural que confere resistência à pele, aos cabelos e às unhas.", "clorofila, pigmento que participa da absorção de luz.", "tiroxina, hormônio que regula o metabolismo basal."], "correta": "B", "comentario": "O ferro faz parte do grupo heme da hemoglobina, que se liga ao oxigênio nas hemácias. Com pouco ferro, a síntese de hemoglobina cai e o transporte de O<sub>2</sub> fica prejudicado, causando cansaço e palidez. As frutas cítricas entram na recomendação porque a vitamina C aumenta a absorção do ferro de origem vegetal. Atenção aos distratores: a clorofila contém magnésio e a tiroxina contém iodo."}, {"modulo": 1, "nivel": "Médio", "subtema": "Enzimas e desnaturação", "texto": "<p>Para testar o amaciante de carne em pó, que contém a enzima papaína, um estudante preparou três recipientes com pedaços iguais de carne e a mesma quantidade do produto. O recipiente I ficou a 5 °C e o II, a 37 °C. No recipiente III, o amaciante foi fervido por 10 minutos antes de ser aplicado à carne, que depois também foi mantida a 37 °C.</p><p>Após duas horas, a carne mais macia foi a do recipiente II, e a do recipiente III praticamente não se alterou.</p>", "comando": "O resultado observado no recipiente III deve-se ao fato de a fervura", "alternativas": ["acelerar a reação, consumindo toda a enzima antes do contato com a carne.", "alterar a sequência de aminoácidos da papaína, produzindo uma nova proteína.", "modificar a estrutura tridimensional da papaína, comprometendo seu sítio ativo.", "transformar a papaína em substrato, que passa a ser digerido pela própria carne.", "reduzir a energia de ativação da reação, tornando a enzima desnecessária."], "correta": "C", "comentario": "Temperaturas elevadas rompem as interações que mantêm a forma tridimensional da enzima (desnaturação). Sem essa forma, o sítio ativo não se encaixa no substrato e a papaína deixa de agir. A sequência de aminoácidos (estrutura primária) não muda com o aquecimento, por isso a alternativa B está errada. No recipiente I, o frio apenas reduz a atividade da enzima, sem desnaturá-la."}, {"modulo": 2, "nivel": "Fácil", "subtema": "Membrana plasmática e osmose", "texto": "<p>É comum que folhas de alface temperadas com sal e vinagre fiquem murchas poucos minutos depois de servidas. Por isso, muitas pessoas preferem temperar a salada apenas na hora de comer.</p>", "comando": "O murchamento das folhas ocorre porque", "alternativas": ["o sal penetra nas células por transporte ativo, acumula-se no citoplasma e rompe a parede celular.", "o vinagre destrói os cloroplastos, interrompendo a fotossíntese.", "a água do tempero entra nas células até que elas se rompam.", "as células das folhas perdem água para o meio externo, que se torna hipertônico.", "as células absorvem sal por osmose e ficam mais pesadas."], "correta": "D", "comentario": "O tempero torna o meio externo mais concentrado em solutos (hipertônico). Por osmose, a água sai das células para esse meio, o vacúolo perde volume e a folha perde a turgescência. Osmose é o movimento da <strong>água</strong>, não do soluto (alternativa E). A alternativa C descreve um meio hipotônico, e mesmo nesse caso a parede celular impediria o rompimento."}, {"modulo": 2, "nivel": "Médio", "subtema": "Fermentação", "texto": "<p>Na fabricação caseira de pães, mistura-se farinha, água, açúcar e fermento biológico (leveduras). A massa é deixada em repouso, coberta e em local morno, e seu volume aumenta consideravelmente antes de ir ao forno. No interior da massa, a disponibilidade de gás oxigênio é baixa.</p>", "comando": "O crescimento da massa e o fato de o pão assado não ter teor alcoólico significativo são explicados, respectivamente, pela", "alternativas": ["produção de gás oxigênio na fotossíntese das leveduras e pela degradação do álcool pelas leveduras mortas.", "liberação de gás carbônico na fermentação lática e pela conversão do ácido lático em glicose no forno.", "produção de vapor de água na respiração aeróbia e pela ausência de etanol nessa via metabólica.", "liberação de gás carbônico na fermentação alcoólica e pela evaporação do etanol durante o forneamento.", "liberação de gás carbônico na respiração aeróbia e pela transformação do etanol em amido durante o cozimento."], "correta": "D", "comentario": "Com pouco oxigênio, as leveduras fazem fermentação alcoólica: a glicose é convertida em etanol e CO<sub>2</sub>. O gás fica preso na rede de glúten e forma as bolhas que fazem a massa crescer. No forno, o etanol, que é volátil, evapora. A fermentação lática (alternativa B) não libera CO<sub>2</sub>, e leveduras não fazem fotossíntese."}, {"modulo": 2, "nivel": "Difícil", "subtema": "Respiração celular e cadeia respiratória", "texto": "<p>O cianeto é uma substância altamente tóxica que se liga à enzima citocromo c oxidase, último componente da cadeia transportadora de elétrons na membrana interna das mitocôndrias. Essa enzima transfere os elétrons para o gás oxigênio.</p><p>Em casos de intoxicação, o sangue venoso da vítima pode apresentar concentração de oxigênio anormalmente alta, e os exames revelam aumento de ácido lático no sangue.</p>", "comando": "Os dois achados clínicos descritos podem ser explicados, respectivamente, pelo fato de", "alternativas": ["o cianeto se ligar à hemoglobina no lugar do oxigênio, e as células passarem a realizar fermentação alcoólica.", "a respiração celular ser acelerada pelo cianeto, e o excesso de piruvato produzido ser convertido em ácido lático dentro do ciclo de Krebs.", "o oxigênio passar a ser utilizado apenas na glicólise, e o ácido lático ser o produto final da cadeia respiratória.", "a fotofosforilação ser interrompida nas mitocôndrias, e o oxigênio acumulado ser convertido em ácido lático.", "as células deixarem de consumir o oxigênio que recebem, e a produção de ATP passar a depender da glicólise seguida de fermentação lática."], "correta": "E", "comentario": "Com a citocromo c oxidase bloqueada, o O<sub>2</sub> deixa de ser o aceptor final de elétrons e não é consumido: ele chega às células e volta no sangue venoso. A cadeia respiratória e o ciclo de Krebs param, e o ATP passa a vir só da glicólise. Para regenerar o NAD<sup>+</sup> usado na glicólise, o piruvato é convertido em lactato, causando acidose lática. Quem se liga à hemoglobina é o monóxido de carbono, e células humanas não fazem fermentação alcoólica."}, {"modulo": 3, "nivel": "Fácil", "subtema": "1ª Lei de Mendel", "texto": "<p>O albinismo oculocutâneo é uma condição de herança autossômica recessiva, caracterizada pela ausência ou redução da produção de melanina. Um casal com pigmentação normal teve um primeiro filho albino e planeja ter outro filho.</p>", "comando": "A probabilidade de o próximo filho do casal ser albino é de", "alternativas": ["0%.", "25%.", "50%.", "75%.", "100%."], "correta": "B", "comentario": "Se o filho é albino (aa), recebeu um alelo recessivo de cada genitor. Como os pais têm pigmentação normal, ambos são heterozigotos (Aa). No cruzamento Aa × Aa, a chance de um filho aa é 1/4, ou seja, 25%. Cada gestação é um evento independente: ter tido um filho albino não muda a probabilidade do próximo."}, {"modulo": 3, "nivel": "Médio", "subtema": "Biotecnologia e DNA recombinante", "texto": "<p>Até a década de 1980, pessoas com diabetes tipo 1 dependiam de insulina extraída do pâncreas de bois e porcos. Hoje, a maior parte da insulina utilizada é produzida por bactérias que receberam uma sequência de DNA com as instruções para fabricar a insulina humana, inserida em um plasmídeo.</p>", "comando": "A produção de insulina humana por essas bactérias só é possível porque", "alternativas": ["as bactérias possuem núcleo organizado e organelas membranosas, semelhantes aos das células humanas.", "o código genético é praticamente universal, e a bactéria transcreve e traduz a sequência humana.", "a insulina humana é idêntica a proteínas que as bactérias já produzem naturalmente.", "o plasmídeo transforma as bactérias em células pancreáticas humanas.", "as bactérias fabricam a insulina por fotossíntese, usando o plasmídeo como cloroplasto."], "correta": "B", "comentario": "Os mesmos códons correspondem aos mesmos aminoácidos em praticamente todos os seres vivos. Por isso a maquinaria da bactéria (RNA polimerase e ribossomos) consegue ler uma sequência humana e produzir a mesma proteína. O gene é inserido no plasmídeo com enzimas de restrição (que cortam o DNA) e DNA ligase (que une os fragmentos). Bactérias são procariontes, sem núcleo organizado."}, {"modulo": 3, "nivel": "Difícil", "subtema": "Identificação por DNA", "texto": "<p>Em exames de vínculo genético, laboratórios analisam regiões do DNA chamadas STR (repetições curtas em sequência), cujo número de repetições varia muito entre as pessoas. Cada indivíduo possui dois alelos para cada marcador: um herdado da mãe e outro do pai. O quadro mostra o número de repetições encontrado em três marcadores.</p>\n<div class=\"tabela-rolagem\"><table class=\"tabela-q\">\n  <thead><tr><th>Marcador</th><th>Mãe</th><th>Criança</th><th>Homem I</th><th>Homem II</th></tr></thead>\n  <tbody>\n    <tr><td>STR-1</td><td>12 e 15</td><td>15 e 18</td><td>9 e 18</td><td>14 e 18</td></tr>\n    <tr><td>STR-2</td><td>7 e 10</td><td>7 e 11</td><td>11 e 13</td><td>8 e 11</td></tr>\n    <tr><td>STR-3</td><td>20 e 22</td><td>22 e 24</td><td>21 e 24</td><td>19 e 23</td></tr>\n  </tbody>\n</table></div>", "comando": "Com base nos resultados, conclui-se que", "alternativas": ["o homem II é o pai biológico, pois compartilha alelos com a criança em todos os marcadores.", "nenhum dos dois homens pode ser excluído, pois ambos possuem o alelo 18 do marcador STR-1.", "o homem II é compatível com a paternidade, e o homem I é excluído pelo marcador STR-2.", "não é possível concluir nada sem analisar o DNA mitocondrial, que é herdado do pai.", "o homem I é compatível com a paternidade, e o homem II é excluído pelo marcador STR-3."], "correta": "E", "comentario": "Primeiro identifique o alelo que veio da mãe; o outro alelo da criança veio obrigatoriamente do pai. Os alelos paternos são 18 (STR-1), 11 (STR-2) e 24 (STR-3). O homem I tem os três; o homem II não tem o 24, o que o exclui. Basta um marcador incompatível para excluir, mas compatibilidade em poucos marcadores não prova a paternidade: na prática, analisam-se mais de 15. O DNA mitocondrial tem herança materna."}, {"modulo": 4, "nivel": "Fácil", "subtema": "Seleção natural e resistência bacteriana", "texto": "<p>O uso indiscriminado de antibióticos, como a automedicação e a interrupção do tratamento antes do prazo, tem contribuído para o surgimento das chamadas “superbactérias”, resistentes a vários medicamentos.</p>", "comando": "Do ponto de vista evolutivo, o aumento da frequência de bactérias resistentes é explicado porque o antibiótico", "alternativas": ["induz as bactérias a produzir mutações que as tornam resistentes.", "fortalece o sistema imunológico das bactérias após o primeiro contato.", "é transformado pelas bactérias em alimento, o que acelera sua reprodução.", "seleciona as bactérias que já eram resistentes, que sobrevivem e deixam descendentes.", "faz com que as bactérias adquiram resistência pelo uso, transmitindo-a aos descendentes."], "correta": "D", "comentario": "A variação já existia na população, gerada por mutações ao acaso e pela troca de plasmídeos entre bactérias. O antibiótico age como agente seletivo: elimina as sensíveis e as resistentes sobrevivem e se multiplicam. As alternativas A e E trazem a ideia equivocada de que o ambiente \"cria\" a característica, típica de raciocínio lamarckista e muito explorada como distrator no ENEM."}, {"modulo": 4, "nivel": "Difícil", "subtema": "Especiação", "texto": "<p>Populações de uma espécie de roedor foram separadas pela mudança no curso de um grande rio. Após milhares de gerações, pesquisadores observaram que as populações das duas margens apresentavam diferenças na coloração e no período reprodutivo.</p><p>Em laboratório, indivíduos das duas margens, quando colocados juntos, acasalaram e geraram descendentes, mas todos eles eram estéreis.</p>", "comando": "A partir dessas observações, conclui-se que", "alternativas": ["as duas populações ainda pertencem à mesma espécie, pois acasalaram e geraram descendentes.", "houve especiação, pois existe isolamento reprodutivo pós-zigótico entre as populações.", "as diferenças surgiram porque cada população se modificou intencionalmente para se adaptar ao ambiente.", "o rio provocou diretamente as mutações responsáveis pelas diferenças observadas.", "não houve especiação, pois o isolamento reprodutivo só existe quando o acasalamento é impossível."], "correta": "B", "comentario": "Espécies são definidas pela capacidade de gerar descendentes <strong>férteis</strong>. A esterilidade dos híbridos é um isolamento reprodutivo pós-zigótico e indica que houve especiação alopátrica. Na natureza, a diferença no período reprodutivo ainda acrescenta um isolamento pré-zigótico. O rio não causa mutações: ele interrompe o fluxo gênico, e as populações acumulam diferenças por mutação, seleção natural e deriva."}, {"modulo": 5, "nivel": "Médio", "subtema": "Gêmeos monozigóticos e dizigóticos", "texto": "<p>Uma maternidade registrou o nascimento de dois pares de gêmeos no mesmo dia. O primeiro par era formado por um menino e uma menina. O segundo par era formado por duas meninas que compartilhavam a mesma placenta e que, segundo exame de DNA, eram geneticamente idênticas.</p>", "comando": "Sobre a origem desses gêmeos, é correto afirmar que", "alternativas": ["o primeiro par veio de dois ovócitos fecundados, e o segundo, de um embrião que se dividiu no início do desenvolvimento.", "ambos os pares se originaram de um único zigoto, pois foram gestados ao mesmo tempo no mesmo útero.", "o primeiro par veio de um único zigoto, e a diferença de sexo surgiu por uma mutação ocorrida na gestação.", "o segundo par veio de um único ovócito fecundado por dois espermatozoides, o que explica a placenta compartilhada pelas meninas.", "os dois pares são dizigóticos, pois gêmeos geneticamente idênticos nunca compartilham a mesma placenta."], "correta": "A", "comentario": "Gêmeos de sexos diferentes só podem ser dizigóticos (fraternos): dois ovócitos liberados no mesmo ciclo e fecundados por espermatozoides diferentes, com semelhança genética igual à de irmãos comuns. Gêmeos monozigóticos surgem quando um único embrião se divide nas primeiras fases do desenvolvimento, por isso têm o mesmo material genético e o mesmo sexo. Quando essa divisão acontece um pouco mais tarde, os gêmeos podem compartilhar a placenta. Um ovócito fecundado por dois espermatozoides gera um zigoto triploide, inviável."}, {"modulo": 5, "nivel": "Médio", "subtema": "Anexos embrionários", "texto": "<p>A conquista definitiva do ambiente terrestre pelos vertebrados está associada ao surgimento do ovo amniótico, presente em répteis e aves. Nesse tipo de ovo, o embrião se desenvolve envolto por membranas chamadas anexos embrionários, e a casca porosa permite trocas gasosas.</p>", "comando": "Nesse ovo, as funções de proteger o embrião contra a desidratação e choques mecânicos e de armazenar excretas nitrogenadas são desempenhadas, respectivamente, pelo(a)", "alternativas": ["cório e saco vitelínico.", "âmnio e alantoide.", "placenta e cordão umbilical.", "saco vitelínico e âmnio.", "alantoide e cório."], "correta": "B", "comentario": "O âmnio forma uma bolsa cheia de líquido (líquido amniótico) que envolve o embrião, evitando a desidratação e amortecendo choques. A alantoide armazena as excretas nitrogenadas (ácido úrico, pouco tóxico e insolúvel) e, junto com o cório, participa das trocas gasosas. O saco vitelínico guarda o vitelo, reserva nutritiva. Placenta e cordão umbilical são estruturas de mamíferos placentários."}, {"modulo": 6, "nivel": "Fácil", "subtema": "Tecido hematopoiético", "texto": "<p>Pacientes com leucemia podem precisar de transplante de medula óssea. Nesse procedimento, células retiradas do interior de ossos como os da bacia de um doador compatível são infundidas no paciente e passam a produzir novas células sanguíneas. A medula óssea não deve ser confundida com a medula espinal.</p>", "comando": "O sucesso do transplante depende da presença, no material doado, de", "alternativas": ["neurônios capazes de regenerar a medula espinal do paciente.", "osteoclastos, que produzem diretamente os anticorpos do sangue.", "células-tronco hematopoéticas, capazes de originar hemácias, leucócitos e plaquetas.", "hemácias jovens, que continuam se dividindo na corrente sanguínea e repõem as células perdidas pelo paciente.", "fibras de colágeno, que formam o plasma sanguíneo."], "correta": "C", "comentario": "A medula óssea vermelha é um tecido hematopoiético, que fica no interior de ossos como os da bacia, o esterno e as vértebras. Ela contém células-tronco hematopoéticas, capazes de originar todas as linhagens do sangue: hemácias, leucócitos e plaquetas. Hemácias maduras humanas não têm núcleo e não se dividem. A medula espinal é tecido nervoso e faz parte do sistema nervoso central."}, {"modulo": 6, "nivel": "Difícil", "subtema": "Tecido ósseo", "texto": "<p>O tecido ósseo é continuamente remodelado por dois tipos celulares: os osteoblastos, que produzem a matriz óssea, e os osteoclastos, que a reabsorvem. Após a menopausa, a queda na produção de estrógeno aumenta a atividade dos osteoclastos, o que eleva o risco de osteoporose.</p><p>No tratamento, um medicamento comum inibe especificamente os osteoclastos. Os médicos também recomendam exposição moderada ao sol, alimentação rica em cálcio e exercícios com impacto, como a caminhada.</p>", "comando": "O conjunto dessas recomendações contribui para a saúde óssea porque", "alternativas": ["a reabsorção da matriz diminui, a vitamina D produzida na pele com o sol aumenta a absorção de cálcio, e o impacto estimula os osteoblastos.", "os osteoclastos passam a produzir matriz, o calor do sol acelera a calcificação, e o impacto reduz o desgaste das articulações.", "os osteoblastos são inibidos, o cálcio passa a substituir o colágeno da matriz, e o exercício reduz a demanda por osso.", "os osteoclastos se convertem em condrócitos, o sol fornece cálcio à pele, e o impacto transforma cartilagem em osso.", "a produção de estrógeno pelos ossos aumenta, o sol estimula a divisão dos osteócitos, e o cálcio dispensa a vitamina D."], "correta": "A", "comentario": "Inibir os osteoclastos reduz a reabsorção e preserva a massa óssea. A radiação UVB do sol permite a síntese de vitamina D na pele, que, ativada, aumenta a absorção intestinal de cálcio. A carga mecânica dos exercícios de impacto estimula a atividade dos osteoblastos. A matriz óssea combina colágeno (flexibilidade) e sais de cálcio (rigidez): um não substitui o outro."}, {"modulo": 7, "nivel": "Fácil", "subtema": "Nomenclatura binomial e categorias taxonômicas", "texto": "<p>A onça-pintada (<em>Panthera onca</em>) e o leão (<em>Panthera leo</em>) pertencem ao mesmo gênero. A jaguatirica (<em>Leopardus pardalis</em>) e o gato-maracajá (<em>Leopardus wiedii</em>) pertencem a outro gênero. Todos esses animais fazem parte da família Felidae.</p>", "comando": "Com base nos nomes científicos, é correto afirmar que", "alternativas": ["a onça-pintada e a jaguatirica pertencem à mesma espécie, pois são da mesma família.", "o termo <em>onca</em>, sozinho, já identifica a espécie, sem necessidade do nome do gênero.", "a jaguatirica e o gato-maracajá pertencem à mesma espécie, já que compartilham o gênero.", "o leão e a onça-pintada são mais aparentados entre si do que com a jaguatirica.", "a família é a categoria mais específica da classificação, abaixo de gênero e espécie."], "correta": "D", "comentario": "Na nomenclatura binomial, o nome da espécie é formado pelo gênero (com inicial maiúscula) mais o epíteto específico: o epíteto sozinho não identifica a espécie. Espécies do mesmo gênero são mais aparentadas entre si do que com espécies de outros gêneros da mesma família. A hierarquia, da categoria mais ampla para a mais específica, é: reino, filo, classe, ordem, família, gênero e espécie."}, {"modulo": 7, "nivel": "Difícil", "subtema": "Cladística e filogenia", "texto": "<p>O cladograma representa uma hipótese de parentesco evolutivo entre cinco grupos de vertebrados. Os números indicam o surgimento de algumas características compartilhadas.</p>\n<figure class=\"figura-q\">\n<svg viewBox=\"0 0 520 280\" role=\"img\" aria-label=\"Cladograma: o tubarão se separa primeiro; depois do marco 1 (quatro membros) separa-se o sapo; depois do marco 2 (ovo amniótico) separa-se o lagarto; depois do marco 3 (coração com quatro cavidades e moela) crocodilo e ave aparecem como grupos-irmãos.\">\n  <g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\">\n    <line x1=\"460\" y1=\"40\" x2=\"245\" y2=\"255\"/>\n    <line x1=\"60\" y1=\"40\" x2=\"260\" y2=\"240\"/>\n    <line x1=\"160\" y1=\"40\" x2=\"310\" y2=\"190\"/>\n    <line x1=\"260\" y1=\"40\" x2=\"360\" y2=\"140\"/>\n    <line x1=\"360\" y1=\"40\" x2=\"410\" y2=\"90\"/>\n  </g>\n  <g stroke=\"currentColor\" stroke-width=\"3\">\n    <line x1=\"277\" y1=\"207\" x2=\"293\" y2=\"223\"/>\n    <line x1=\"327\" y1=\"157\" x2=\"343\" y2=\"173\"/>\n    <line x1=\"377\" y1=\"107\" x2=\"393\" y2=\"123\"/>\n  </g>\n  <g font-size=\"19\" font-weight=\"700\" fill=\"currentColor\" text-anchor=\"middle\">\n    <text x=\"304\" y=\"234\">1</text>\n    <text x=\"354\" y=\"184\">2</text>\n    <text x=\"404\" y=\"134\">3</text>\n  </g>\n  <g font-size=\"19\" fill=\"currentColor\" text-anchor=\"middle\">\n    <text x=\"60\" y=\"26\">Tubarão</text>\n    <text x=\"160\" y=\"26\">Sapo</text>\n    <text x=\"260\" y=\"26\">Lagarto</text>\n    <text x=\"360\" y=\"26\">Crocodilo</text>\n    <text x=\"460\" y=\"26\">Ave</text>\n  </g>\n</svg>\n<figcaption>1 – quatro membros; 2 – ovo amniótico; 3 – coração com quatro cavidades e moela.</figcaption>\n</figure>", "comando": "Com base no cladograma, é correto afirmar que", "alternativas": ["o crocodilo é mais aparentado com o lagarto do que com a ave, pois ambos são répteis.", "o sapo é o ancestral direto do lagarto, do crocodilo e da ave.", "a ave tem um ancestral comum mais recente com o crocodilo do que com o lagarto.", "o tubarão é o animal mais primitivo do grupo e deu origem aos demais.", "o ovo amniótico surgiu de forma independente no lagarto e na ave."], "correta": "C", "comentario": "Em um cladograma, o grau de parentesco é dado pelo ancestral comum mais recente. Crocodilo e ave saem do mesmo nó, depois do marco 3, por isso são grupos-irmãos: o crocodilo é mais aparentado com as aves do que com os lagartos. Isso mostra que o grupo \"répteis\", sem as aves, não reúne todos os descendentes de um mesmo ancestral (é parafilético). Os grupos nas pontas são atuais: nenhum é ancestral direto de outro. O ovo amniótico surgiu uma única vez (marco 2) e foi herdado."}, {"modulo": 8, "nivel": "Fácil", "subtema": "Anfíbios e bioindicadores", "texto": "<p>Pesquisadores consideram os anfíbios, como sapos, rãs e pererecas, excelentes bioindicadores da qualidade ambiental. O declínio de suas populações em diversas regiões do mundo tem sido associado à poluição de rios e lagos e à disseminação de um fungo patogênico.</p>", "comando": "Uma característica dos anfíbios que os torna especialmente sensíveis a alterações no ambiente é", "alternativas": ["a pele fina, úmida e permeável, que participa das trocas gasosas e absorve substâncias do meio.", "o corpo coberto por escamas impermeáveis, que acumulam poluentes.", "a presença de penas, que retêm partículas tóxicas do ar.", "a reprodução exclusivamente terrestre, com ovos protegidos por casca calcária, que dispensa a presença de água.", "a respiração exclusivamente branquial durante toda a vida."], "correta": "A", "comentario": "A pele dos anfíbios é fina, úmida, vascularizada e permeável, e participa da respiração cutânea. Por isso absorve poluentes com facilidade e é vulnerável a patógenos, como o fungo quitrídio. Além disso, a maioria depende da água para a reprodução, com ovos sem casca e larvas aquáticas (girinos) de respiração branquial, o que os expõe aos dois ambientes."}, {"modulo": 8, "nivel": "Médio", "subtema": "Artrópodes e muda", "texto": "<p>Catadores de caranguejo dos manguezais sabem que o caranguejo-uçá passa por períodos em que se esconde na toca e para de se alimentar. Nessa fase, ele abandona a carapaça antiga e permanece algum tempo com uma nova carapaça ainda mole, até que ela endureça. Medidas feitas ao longo da vida do animal mostram que seu tamanho aumenta de forma descontínua, em “saltos”.</p>", "comando": "Esse comportamento e o padrão de crescimento observado estão relacionados ao(à)", "alternativas": ["esqueleto interno de cartilagem, que é substituído por osso na fase adulta.", "pele permeável, que precisa ser renovada para garantir a respiração cutânea.", "exoesqueleto rígido, que não acompanha o crescimento e precisa ser trocado periodicamente.", "metamorfose completa, na qual a larva se transforma em pupa dentro da toca.", "regeneração de partes do corpo, que ocorre apenas durante a reprodução."], "correta": "C", "comentario": "Os artrópodes têm exoesqueleto de quitina, que nos crustáceos é reforçado com carbonato de cálcio. Ele protege, evita a perda de água e serve de apoio aos músculos, mas não cresce. Por isso o animal passa por mudas (ecdises), controladas por hormônios: troca o exoesqueleto e cresce enquanto o novo ainda está mole. Nessa fase fica vulnerável e se esconde, e o crescimento acontece em saltos."}, {"modulo": 9, "nivel": "Médio", "subtema": "Hormônios vegetais", "texto": "<p>Para acelerar o amadurecimento de abacates comprados ainda verdes, é comum embrulhá-los em jornal junto com uma banana madura. Já os distribuidores armazenam frutas em câmaras ventiladas, às vezes com filtros que retêm determinadas substâncias, para prolongar sua vida útil.</p>", "comando": "Essas práticas baseiam-se no controle de um hormônio vegetal gasoso, o", "alternativas": ["etileno, que estimula o amadurecimento dos frutos e é liberado pelos próprios frutos maduros.", "auxina, que é liberada pelo jornal e acelera a respiração dos frutos.", "gás carbônico, que é produzido na fotossíntese dos frutos verdes e induz o amadurecimento de toda a fruteira.", "giberelina, que se acumula nas câmaras ventiladas e impede o amadurecimento.", "oxigênio, que é consumido pela banana e retarda o amadurecimento do abacate."], "correta": "A", "comentario": "O etileno é o único hormônio vegetal gasoso. Frutos maduros, como a banana, liberam etileno, que estimula o amadurecimento dos frutos próximos; o jornal concentra o gás em volta do abacate. Nas câmaras, a ventilação e os filtros removem o etileno do ar, retardando o amadurecimento. A fotossíntese consome CO<sub>2</sub>, não o produz."}, {"modulo": 9, "nivel": "Difícil", "subtema": "Metabolismo CAM e adaptações", "texto": "<p>Plantas como o mandacaru, comum na Caatinga, e o abacaxi realizam um tipo especial de metabolismo fotossintético. Medições ao longo de 24 horas mostram que essas plantas absorvem gás carbônico principalmente à noite, quando a acidez de suas folhas aumenta. Durante o dia, a acidez diminui, enquanto ocorre a produção de açúcares.</p>", "comando": "Esse padrão é uma adaptação a ambientes secos porque permite", "alternativas": ["realizar a fotossíntese completa no escuro, usando a energia luminosa armazenada durante o dia.", "dispensar a luz na produção de açúcares, que passa a ocorrer somente durante a noite.", "absorver água pela superfície das folhas durante a noite, quando a umidade do ar é maior.", "liberar o oxigênio produzido na fotossíntese apenas à noite, evitando o aquecimento das folhas.", "fechar os estômatos nas horas quentes e usar, de dia, o CO<sub>2</sub> fixado à noite em ácidos orgânicos."], "correta": "E", "comentario": "No metabolismo CAM, os estômatos abrem à noite, quando a temperatura é menor e a perda de água por transpiração é pequena. O CO<sub>2</sub> absorvido é fixado em ácidos orgânicos (como o ácido málico), armazenados no vacúolo, o que explica o aumento da acidez noturna. De dia, com os estômatos fechados, esses ácidos liberam CO<sub>2</sub> para o ciclo de Calvin, que depende dos produtos da etapa fotoquímica e, portanto, da luz."}, {"modulo": 10, "nivel": "Fácil", "subtema": "Imunização ativa e passiva", "texto": "<p>Uma pessoa picada por uma serpente peçonhenta foi levada a um hospital, onde recebeu soro antiofídico. Em outra situação, uma criança recebeu a vacina contra o sarampo, conforme o calendário de vacinação.</p>", "comando": "Comparando os dois procedimentos, é correto afirmar que", "alternativas": ["ambos estimulam o próprio organismo a produzir anticorpos, garantindo memória imunológica duradoura.", "o soro traz anticorpos prontos e age de imediato; a vacina induz a produção de anticorpos e de células de memória.", "o soro contém antígenos atenuados, enquanto a vacina contém anticorpos produzidos em cavalos.", "a vacina tem ação imediata e curativa, sendo indicada logo após o contato com o agente causador da doença.", "o soro é preventivo e deve ser aplicado periodicamente, assim como a vacina."], "correta": "B", "comentario": "O soro é imunização passiva: fornece anticorpos prontos (no caso do antiofídico, produzidos em cavalos) que neutralizam o veneno rapidamente, mas não geram memória. A vacina é imunização ativa: contém antígenos (agente inativado, atenuado ou partes dele) que estimulam o próprio organismo a produzir anticorpos e células de memória. Soro trata; vacina previne."}, {"modulo": 10, "nivel": "Médio", "subtema": "Controle glicêmico e diabetes", "texto": "<p>Em um exame de tolerância à glicose, uma pessoa em jejum ingere uma solução açucarada, e sua glicemia é medida em intervalos regulares. Em uma pessoa saudável, a glicemia sobe após a ingestão e volta aos níveis normais em cerca de duas horas. Em uma pessoa com diabetes tipo 1, a glicemia permanece elevada por muito mais tempo.</p>", "comando": "A diferença entre os resultados é explicada porque, no diabetes tipo 1,", "alternativas": ["o fígado passa a produzir insulina em excesso, o que bloqueia a entrada de glicose nas células.", "o pâncreas produz pouco glucagon, o que impede a quebra do glicogênio armazenado no fígado.", "há excesso de receptores de insulina nas células, que ficam saturadas e deixam de absorver glicose.", "as células beta do pâncreas são destruídas por autoimunidade, e falta insulina para a captação de glicose.", "a tireoide deixa de produzir tiroxina, hormônio que seria responsável por reduzir a glicemia."], "correta": "D", "comentario": "O diabetes tipo 1 é autoimune: o sistema imunológico destrói as células beta das ilhotas pancreáticas, que produzem insulina. Sem insulina, músculos e tecido adiposo captam pouca glicose e o fígado não a armazena como glicogênio, então a glicemia fica alta. No diabetes tipo 2 há insulina, mas as células respondem mal a ela (resistência à insulina). O glucagon tem efeito oposto: eleva a glicemia."}, {"modulo": 10, "nivel": "Difícil", "subtema": "Sistema excretor e ADH", "texto": "<p>O consumo de bebidas alcoólicas aumenta o volume de urina produzido e, frequentemente, provoca sede e desidratação no dia seguinte. Esse efeito ocorre porque o etanol inibe a liberação do hormônio antidiurético (ADH) pela neuro-hipófise.</p>", "comando": "Na falta do ADH, o volume urinário aumenta porque", "alternativas": ["os glomérulos filtram menos sangue, acumulando água nos néfrons.", "a reabsorção de glicose no túbulo proximal é interrompida, e a glicose que permanece no néfron arrasta água para a urina.", "a permeabilidade à água dos túbulos distais e ductos coletores diminui, reduzindo a reabsorção de água.", "a bexiga passa a produzir urina diretamente a partir do plasma sanguíneo.", "a aldosterona deixa de ser produzida pelo pâncreas, aumentando a eliminação de sódio."], "correta": "C", "comentario": "O ADH aumenta a inserção de aquaporinas (canais de água) nas células dos túbulos distais e, principalmente, dos ductos coletores, permitindo que a água volte ao sangue. Sem ADH, esses segmentos ficam pouco permeáveis à água, e a urina sai abundante e diluída. A alternativa B descreve o que ocorre no diabetes mellitus descompensado (glicose na urina). A aldosterona é produzida pelo córtex das glândulas suprarrenais."}, {"modulo": 11, "nivel": "Fácil", "subtema": "Eutrofização", "texto": "<p>Após o lançamento de esgoto doméstico sem tratamento em uma lagoa, observou-se, em poucas semanas, a proliferação intensa de algas na superfície, seguida da morte de muitos peixes.</p>", "comando": "A mortandade dos peixes está diretamente relacionada à", "alternativas": ["elevação da temperatura da água, causada pela fotossíntese das algas.", "liberação de gás carbônico pelas algas, tóxico para os peixes em qualquer concentração.", "redução dos nutrientes da água, totalmente consumidos pelas algas.", "acumulação de metais pesados nas algas, que são transferidos aos peixes pela cadeia alimentar e causam intoxicação aguda.", "diminuição do gás oxigênio dissolvido, consumido por bactérias aeróbias na decomposição da matéria orgânica."], "correta": "E", "comentario": "O esgoto adiciona nutrientes (principalmente nitrogênio e fósforo), causando a proliferação das algas. A camada superficial bloqueia a luz, e algas e outros organismos morrem. A grande quantidade de matéria orgânica é decomposta por bactérias aeróbias, que consomem o oxigênio dissolvido, e os peixes morrem por falta de O<sub>2</sub>. Esse processo é a eutrofização."}, {"modulo": 11, "nivel": "Médio", "subtema": "Ciclo do nitrogênio", "texto": "<p>Uma prática agrícola sustentável é a adubação verde: o agricultor cultiva plantas leguminosas, como a mucuna e o feijão-de-porco, e depois as incorpora ao solo antes de plantar a cultura principal. Essa prática reduz a necessidade de fertilizantes nitrogenados industriais.</p>", "comando": "A redução no uso de fertilizantes ocorre porque as leguminosas", "alternativas": ["associam-se a bactérias que fixam o nitrogênio do ar em compostos assimiláveis.", "absorvem o nitrogênio atmosférico diretamente pelas folhas e o armazenam nas sementes.", "realizam desnitrificação, transformando o nitrato do solo em gás nitrogênio.", "produzem nitrogênio na fotossíntese e o liberam pelas raízes.", "impedem a ação dos decompositores, evitando a perda de nutrientes do solo."], "correta": "A", "comentario": "Nas raízes das leguminosas há nódulos com bactérias do gênero <em>Rhizobium</em>, em mutualismo com a planta. Elas fazem a fixação biológica do nitrogênio, convertendo N<sub>2</sub> em amônia, que a planta usa para produzir proteínas. Quando a biomassa é incorporada ao solo, os decompositores liberam esse nitrogênio para a próxima cultura. A desnitrificação (alternativa C) faz o contrário: devolve N<sub>2</sub> à atmosfera."}, {"modulo": 11, "nivel": "Difícil", "subtema": "Sucessão ecológica", "texto": "<p>Uma área de Mata Atlântica foi desmatada para pastagem e, anos depois, abandonada. Ao longo de décadas, a área passou por sucessão ecológica secundária: surgiram inicialmente gramíneas e arbustos, depois árvores pioneiras de crescimento rápido e, por fim, espécies típicas de floresta madura.</p>", "comando": "À medida que essa comunidade se aproxima do estágio clímax, espera-se que", "alternativas": ["a biomassa diminua e a produtividade líquida aumente, pois a comunidade se simplifica.", "a diversidade de espécies diminua, pois as pioneiras eliminam as demais espécies.", "a produtividade líquida atinja seu valor máximo, com acúmulo crescente de matéria orgânica a cada ano.", "o microclima se torne mais instável, favorecendo espécies que toleram sol intenso.", "a biomassa e a diversidade aumentem, e a produtividade líquida diminua."], "correta": "E", "comentario": "Ao longo da sucessão, a comunidade acumula biomassa, ganha diversidade e cria um microclima mais estável (sombra, umidade). No clímax, quase toda a matéria orgânica produzida é consumida pela respiração da própria comunidade: a produtividade líquida tende a zero, enquanto a bruta é alta. A produtividade líquida é maior nos estágios intermediários, quando a comunidade ainda está crescendo."}, {"modulo": 11, "nivel": "Difícil", "subtema": "Bioacumulação e biomagnificação", "texto": "<p>Em regiões da Amazônia afetadas pelo garimpo ilegal de ouro, o mercúrio lançado nos rios é convertido por microrganismos em metilmercúrio, forma facilmente absorvida e pouco excretada pelos organismos. Estudos com populações ribeirinhas e indígenas encontraram níveis de mercúrio acima do recomendado, sobretudo entre pessoas que consomem com frequência peixes carnívoros, como o tucunaré e a piranha.</p>", "comando": "Considerando o comportamento do metilmercúrio nas cadeias alimentares, uma medida individual que reduz a exposição dessas populações, enquanto a contaminação persiste, é", "alternativas": ["priorizar peixes de níveis tróficos mais baixos, como os que comem frutos, sementes ou detritos.", "cozinhar o peixe por mais tempo, já que o calor elimina o metilmercúrio dos tecidos.", "preferir peixes grandes e mais velhos, que tiveram mais tempo para excretar o mercúrio.", "consumir o peixe apenas salgado e seco, pois o mercúrio é eliminado junto com a água.", "filtrar a água de beber, medida suficiente porque a água é a principal via de contaminação humana."], "correta": "A", "comentario": "Como é pouco excretado, o metilmercúrio se acumula nos tecidos (bioacumulação) e sua concentração aumenta a cada nível trófico (biomagnificação). Predadores de topo, como tucunaré e piranha, concentram mais mercúrio. Ele se liga às proteínas do músculo: cozinhar, salgar ou secar não o elimina, e secar até concentra. Peixes maiores e mais velhos acumulam mais, e a dieta, não a água, é a principal via de exposição. A solução estrutural é coletiva: combater o garimpo ilegal."}, {"modulo": 12, "nivel": "Fácil", "subtema": "Vírus e antibióticos", "texto": "<p>Durante um surto de gripe, muitas pessoas procuraram farmácias pedindo antibióticos. Os farmacêuticos foram orientados a não vender esses medicamentos sem receita e a explicar que eles não têm efeito sobre a gripe.</p>", "comando": "Os antibióticos não são eficazes contra a gripe porque o agente causador dessa doença", "alternativas": ["é uma bactéria multirresistente, que não responde a nenhum dos medicamentos conhecidos.", "é um protozoário que se instala no interior das hemácias, onde fica protegido.", "é um fungo que forma esporos resistentes à ação dos medicamentos.", "é um vírus, sem parede celular nem ribossomos próprios, alvos comuns dos antibióticos.", "é um verme que se aloja nas vias respiratórias e se protege em cistos."], "correta": "D", "comentario": "A gripe é causada pelo vírus influenza. Antibióticos agem sobre estruturas e processos de bactérias, como a parede celular e os ribossomos bacterianos. Vírus não têm metabolismo próprio: usam a maquinaria da célula hospedeira. Tomar antibiótico sem necessidade ainda favorece a seleção de bactérias resistentes. Contra a gripe, a principal proteção é a vacina anual."}, {"modulo": 12, "nivel": "Médio", "subtema": "Protozooses: doença de Chagas", "texto": "<p>Surtos de doença de Chagas no Pará têm sido associados ao consumo de açaí processado artesanalmente. Durante a colheita e o armazenamento, insetos conhecidos como barbeiros podem ser triturados junto com os frutos ou contaminá-los com suas fezes.</p><p>Uma das medidas recomendadas pelas autoridades sanitárias é o branqueamento dos frutos: imersão em água a cerca de 80 °C por 10 segundos, seguida de resfriamento.</p>", "comando": "A medida recomendada é eficaz porque", "alternativas": ["elimina o vírus causador da doença, presente na casca do fruto.", "mata os ovos do barbeiro que ficam presos na casca, impedindo que se desenvolvam no intestino humano.", "destrói a bactéria transmitida pela picada do barbeiro.", "impede a reprodução do mosquito vetor da doença nos frutos.", "inativa o protozoário <em>Trypanosoma cruzi</em>, que pode estar presente nos frutos contaminados."], "correta": "E", "comentario": "A doença de Chagas é causada pelo protozoário <em>Trypanosoma cruzi</em>, transmitido pelo barbeiro, um inseto hemíptero, e não um mosquito. Além da transmissão vetorial (fezes do barbeiro em contato com a pele lesionada ou mucosas), há a transmissão oral, por alimentos contaminados, hoje uma das principais formas no Brasil. O calor do branqueamento inativa o protozoário sem cozinhar a polpa."}, {"modulo": 12, "nivel": "Difícil", "subtema": "Arboviroses e controle biológico", "texto": "<p>No Brasil, o Método Wolbachia consiste em liberar mosquitos <em>Aedes aegypti</em> portadores da bactéria <em>Wolbachia</em>, que reduz a capacidade de os vírus da dengue, zika e chikungunya se multiplicarem no mosquito. A bactéria é transmitida da fêmea para os descendentes pelos ovos.</p><p>Quando machos com <em>Wolbachia</em> cruzam com fêmeas sem a bactéria, os ovos não se desenvolvem. Já as fêmeas com <em>Wolbachia</em> têm descendentes viáveis ao cruzar com machos com ou sem a bactéria.</p>", "comando": "Após um período de liberações, a proporção de mosquitos com <em>Wolbachia</em> na população local tende a", "alternativas": ["diminuir, pois as fêmeas sem <em>Wolbachia</em> têm vantagem reprodutiva, já que conseguem cruzar com qualquer macho da população.", "permanecer constante, pois a bactéria não interfere em nenhum aspecto da reprodução dos mosquitos.", "aumentar, pois as fêmeas portadoras têm prole em qualquer cruzamento, e as demais falham com machos portadores.", "aumentar, pois a bactéria passa às pessoas pela picada e delas para novos mosquitos que as picam.", "diminuir, pois a <em>Wolbachia</em> mata os mosquitos adultos pouco tempo depois de sua liberação."], "correta": "C", "comentario": "Esse fenômeno é a incompatibilidade citoplasmática. Fêmeas portadoras têm sucesso reprodutivo em qualquer cruzamento e passam a bactéria a toda a prole; fêmeas não portadoras perdem os ovos quando cruzam com machos portadores. Assim, a frequência de mosquitos com <em>Wolbachia</em> cresce até predominar, e a população se mantém portadora sem novas liberações. O método não mata os mosquitos e a bactéria não infecta pessoas: o objetivo é reduzir a transmissão dos vírus."}]};
  // URL do Apps Script (termina em /exec) que grava na planilha.
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbyo_J8sU_udq_YDiB2xj3x_2fjEc55xso4XLh2gxbmVhV8qA4YS8ony-oUgPAYWjTDd/exec";
</script>
<script>
(function () {
  'use strict';

  var CFG = DADOS.config;
  var MODS = DADOS.modulos;
  var QS = DADOS.questoes;
  var LETRAS = ['A', 'B', 'C', 'D', 'E'];
  var NIVEIS = ['Fácil', 'Médio', 'Difícil'];
  var CHAVE = 'bioemcasa-teste:' + CFG.versao;
  var NO_APPS_SCRIPT = /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(ENDPOINT);

  var app = document.getElementById('app');
  var modalRaiz = document.getElementById('modal-raiz');
  var relogio = null;
  var modalAberto = false;
  var filtroGabarito = 'todas';

  // ------------------------------------------------------------------ estado
  function novoEstado(aluno) {
    return {
      etapa: 'inicio',
      aluno: aluno || { nome: '', email: '', whatsapp: '', contato: false },
      respostas: QS.map(function () { return null; }),
      riscadas: QS.map(function () { return []; }),
      revisar: QS.map(function () { return false; }),
      atual: 0,
      inicio: null,
      fim: null,
      envio: 'pendente'
    };
  }
  function guardar() {
    try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) { /* navegador sem armazenamento: segue sem salvar */ }
  }
  function recuperar() {
    try {
      var s = JSON.parse(localStorage.getItem(CHAVE));
      if (s && Array.isArray(s.respostas) && s.respostas.length === QS.length) return s;
    } catch (e) {}
    return null;
  }
  var estado = recuperar() || novoEstado();

  // ------------------------------------------------------------------ utilidades
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function nomeModulo(id) {
    for (var i = 0; i < MODS.length; i++) if (MODS[i].id === id) return MODS[i].nome;
    return 'Módulo ' + id;
  }
  function doisDig(n) { return (n < 10 ? '0' : '') + n; }
  function relogioTexto(seg) {
    var h = Math.floor(seg / 3600), m = Math.floor((seg % 3600) / 60), s = seg % 60;
    return (h ? h + ':' + doisDig(m) : m) + ':' + doisDig(s);
  }
  function duracaoTexto(seg) {
    var min = Math.max(1, Math.round(seg / 60));
    if (min < 60) return min + ' min';
    return Math.floor(min / 60) + ' h ' + doisDig(min % 60) + ' min';
  }
  function segundosDeProva() {
    if (!estado.inicio) return 0;
    return Math.floor(((estado.fim || Date.now()) - estado.inicio) / 1000);
  }
  function pct(a, t) { return t ? a / t : 0; }
  function porcento(x) { return Math.round(x * 100) + '%'; }
  function respondidas() { return estado.respostas.filter(function (r) { return r; }).length; }

  // ------------------------------------------------------------------ roteamento
  function render() {
    pararRelogio();
    window.scrollTo(0, 0);
    if (estado.etapa === 'prova') renderProva();
    else if (estado.etapa === 'resultado') renderLaudo();
    else renderInicio();
  }

  // ================================================================== INÍCIO
  function renderInicio() {
    var a = estado.aluno;
    var listaMods = MODS.map(function (m) { return '<li>' + esc(m.nome) + '</li>'; }).join('');
    app.innerHTML =
      '<main class="inicio">' +
        '<div>' +
          '<p class="marca-curso">' + esc(CFG.curso) + '</p>' +
          '<h1>Quanto da biologia do ENEM você já domina?</h1>' +
          '<p class="lead">' + QS.length + ' questões no modelo ENEM, cobrindo os ' + MODS.length + ' módulos do ' + esc(CFG.curso) + '. No fim, você recebe um laudo com o seu desempenho em cada módulo e a ordem do que estudar primeiro.</p>' +
          '<ul class="fatos">' +
            '<li><strong>' + QS.length + ' questões</strong>de múltipla escolha</li>' +
            '<li><strong>' + CFG.tempoSugeridoMin + ' minutos</strong>de tempo sugerido</li>' +
            '<li><strong>3 níveis</strong>fácil, médio e difícil</li>' +
          '</ul>' +
          '<h2>Módulos avaliados</h2>' +
          '<ol class="lista-modulos">' + listaMods + '</ol>' +
        '</div>' +
        '<div class="ficha-id">' +
          '<div class="ficha-id-topo"><h2>Identificação</h2>' +
            '<span class="amostra" aria-hidden="true"><span></span><span class="cheia"></span><span></span><span></span><span></span></span></div>' +
          '<form id="form-inicio" novalidate>' +
            campo('nome', 'Nome completo', 'text', a.nome, 'name', '') +
            campo('email', 'E-mail', 'email', a.email, 'email', '') +
            campo('whatsapp', 'WhatsApp', 'tel', a.whatsapp, 'tel', '') +
            '<label class="aceite"><input type="checkbox" id="contato"' + (a.contato ? ' checked' : '') + '> <span>Aceito receber o meu resultado e conteúdos do ' + esc(CFG.curso) + ' por e-mail e WhatsApp.</span></label>' +
            '<button class="btn" type="submit">Começar o teste</button>' +
            '<p class="dica">Faça sem consultar material: assim o laudo mostra o seu nível real. Se precisar sair, o progresso fica salvo neste navegador.</p>' +
          '</form>' +
        '</div>' +
      '</main>';

    document.getElementById('form-inicio').addEventListener('submit', function (e) {
      e.preventDefault();
      var nome = val('nome'), email = val('email'), whats = val('whatsapp');
      var ok = true;
      limparErros();
      if (nome.length < 3) { erroCampo('nome', 'Escreva seu nome completo.'); ok = false; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { erroCampo('email', 'Confira o e-mail: ele precisa ter o formato nome@provedor.com.'); ok = false; }
      var digitos = whats.replace(/\D/g, '');
      if (digitos.length < 10 || digitos.length > 13) { erroCampo('whatsapp', 'Use o DDD e o número, por exemplo (11) 91234-5678.'); ok = false; }
      if (!ok) { var inv = app.querySelector('[aria-invalid="true"]'); if (inv) inv.focus(); return; }
      estado.aluno = { nome: nome, email: email, whatsapp: whats, contato: document.getElementById('contato').checked };
      estado.etapa = 'prova';
      estado.inicio = Date.now();
      estado.atual = 0;
      guardar();
      render();
    });
  }
  function campo(id, rotulo, tipo, valor, auto, extra) {
    return '<div class="campo"><label for="' + id + '">' + rotulo + extra + '</label>' +
      '<input id="' + id + '" type="' + tipo + '" autocomplete="' + auto + '" value="' + esc(valor) + '" aria-describedby="' + id + '-erro">' +
      '<p class="msg-erro" id="' + id + '-erro" hidden></p></div>';
  }
  function val(id) { return document.getElementById(id).value.trim(); }
  function erroCampo(id, msg) {
    var inp = document.getElementById(id), p = document.getElementById(id + '-erro');
    inp.setAttribute('aria-invalid', 'true'); p.textContent = msg; p.hidden = false;
  }
  function limparErros() {
    app.querySelectorAll('[aria-invalid]').forEach(function (el) { el.removeAttribute('aria-invalid'); });
    app.querySelectorAll('.msg-erro').forEach(function (p) { p.hidden = true; });
  }

  // ================================================================== PROVA
  function renderProva() {
    app.innerHTML =
      '<header class="topo"><div class="topo-in">' +
        '<span class="marca-curso">' + esc(CFG.curso) + '</span>' +
        '<span class="topo-titulo">' + esc(CFG.titulo) + '</span>' +
        '<div class="topo-dir">' +
          '<span class="cronometro" id="cronometro" title="Tempo de prova (sugerido: ' + CFG.tempoSugeridoMin + ' min)">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg>' +
            '<span class="sr">Tempo de prova: </span><span id="cronometro-valor">0:00</span></span>' +
          '<button class="btn btn-sec btn-cartao" id="abrir-cartao" type="button" aria-controls="cartao" aria-expanded="false">Cartão <span id="conta-curta"></span></button>' +
        '</div>' +
      '</div><div class="progresso" aria-hidden="true"><span id="barra"></span></div></header>' +
      '<div class="prova">' +
        '<main class="questao" id="questao"></main>' +
        '<aside class="cartao" id="cartao" aria-label="Cartão-resposta">' +
          '<div class="cartao-topo"><h2>Cartão-resposta</h2><span class="cartao-conta" id="conta"></span>' +
            '<button class="btn-fechar" id="fechar-cartao" type="button">Fechar</button></div>' +
          '<ol class="cartao-linhas" id="linhas"></ol>' +
          '<p class="cartao-legenda"><i aria-hidden="true"></i> Marcadas para revisar</p>' +
          '<button class="btn" id="finalizar" type="button">Finalizar teste</button>' +
        '</aside>' +
      '</div>' +
      '<div class="veu" id="veu"></div>';

    document.getElementById('abrir-cartao').addEventListener('click', abrirCartao);
    document.getElementById('fechar-cartao').addEventListener('click', fecharCartao);
    document.getElementById('veu').addEventListener('click', fecharCartao);
    document.getElementById('finalizar').addEventListener('click', confirmarFim);
    document.getElementById('linhas').addEventListener('click', function (e) {
      var b = e.target.closest('.linha');
      if (!b) return;
      fecharCartao();
      irPara(+b.getAttribute('data-i'));
    });

    mostrarQuestao(false);
    pintarCartao();
    iniciarRelogio();
  }

  function mostrarQuestao(focar) {
    var i = estado.atual, q = QS[i], ultima = i === QS.length - 1;
    var alts = q.alternativas.map(function (txt, k) {
      var L = LETRAS[k];
      return '<li class="alt" data-l="' + L + '">' +
        '<button type="button" class="alt-escolher" role="radio" aria-checked="false">' +
          '<span class="bolha" aria-hidden="true">' + L + '</span><span class="alt-texto"><span class="sr">Alternativa ' + L + ': </span>' + txt + '</span></button>' +
        '<button type="button" class="alt-riscar" aria-pressed="false" aria-label="Riscar alternativa ' + L + '">Riscar</button>' +
      '</li>';
    }).join('');

    var box = document.getElementById('questao');
    box.innerHTML =
      '<div class="q-cab">' +
        '<h2 id="q-titulo" tabindex="-1">Questão ' + (i + 1) + ' <span>de ' + QS.length + '</span></h2>' +
        '<button type="button" class="btn-revisar" id="btn-revisar" aria-pressed="false">Marcar para revisar</button>' +
      '</div>' +
      '<div class="q-texto">' + q.texto + '</div>' +
      '<p class="q-comando" id="q-comando">' + q.comando + '</p>' +
      '<ul class="alts" role="radiogroup" aria-labelledby="q-comando">' + alts + '</ul>' +
      '<div class="q-nav">' +
        '<button type="button" class="btn btn-sec" id="anterior"' + (i === 0 ? ' disabled' : '') + '>Anterior</button>' +
        (ultima
          ? '<button type="button" class="btn" id="proxima">Finalizar teste</button>'
          : '<button type="button" class="btn" id="proxima">Próxima</button>') +
      '</div>' +
      '<p class="atalhos">Atalhos: teclas A a E marcam a alternativa; as setas ← e → mudam de questão.</p>';

    box.querySelector('.alts').addEventListener('click', function (e) {
      var li = e.target.closest('.alt');
      if (!li) return;
      var L = li.getAttribute('data-l');
      if (e.target.closest('.alt-riscar')) riscar(i, L);
      else responder(i, L);
    });
    document.getElementById('btn-revisar').addEventListener('click', function () {
      estado.revisar[i] = !estado.revisar[i];
      guardar(); pintarAlternativas(); pintarCartao();
    });
    document.getElementById('anterior').addEventListener('click', function () { irPara(i - 1); });
    document.getElementById('proxima').addEventListener('click', function () { ultima ? confirmarFim() : irPara(i + 1); });

    pintarAlternativas();
    if (focar) {
      var topo = box.getBoundingClientRect().top + window.pageYOffset - 80;
      if (window.pageYOffset > topo) window.scrollTo(0, Math.max(0, topo));
      document.getElementById('q-titulo').focus({ preventScroll: true });
    }
  }

  function pintarAlternativas() {
    var i = estado.atual, resp = estado.respostas[i], risc = estado.riscadas[i];
    document.querySelectorAll('#questao .alt').forEach(function (li) {
      var L = li.getAttribute('data-l'), marcada = resp === L, riscada = risc.indexOf(L) >= 0;
      li.classList.toggle('marcada', marcada);
      li.classList.toggle('riscada', riscada);
      li.querySelector('.alt-escolher').setAttribute('aria-checked', marcada ? 'true' : 'false');
      var r = li.querySelector('.alt-riscar');
      r.setAttribute('aria-pressed', riscada ? 'true' : 'false');
      r.textContent = riscada ? 'Desfazer' : 'Riscar';
    });
    var br = document.getElementById('btn-revisar');
    if (br) {
      br.setAttribute('aria-pressed', estado.revisar[i] ? 'true' : 'false');
      br.textContent = estado.revisar[i] ? 'Marcada para revisar' : 'Marcar para revisar';
    }
  }

  function responder(i, L) {
    estado.respostas[i] = estado.respostas[i] === L ? null : L;
    var k = estado.riscadas[i].indexOf(L);
    if (estado.respostas[i] && k >= 0) estado.riscadas[i].splice(k, 1);
    guardar(); pintarAlternativas(); pintarCartao();
  }
  function riscar(i, L) {
    var r = estado.riscadas[i], k = r.indexOf(L);
    if (k >= 0) r.splice(k, 1);
    else { r.push(L); if (estado.respostas[i] === L) estado.respostas[i] = null; }
    guardar(); pintarAlternativas(); pintarCartao();
  }
  function irPara(i) {
    if (i < 0 || i >= QS.length) return;
    estado.atual = i;
    guardar();
    mostrarQuestao(true);
    pintarCartao();
  }

  function pintarCartao() {
    var linhas = document.getElementById('linhas');
    if (!linhas) return;
    linhas.innerHTML = QS.map(function (q, i) {
      var r = estado.respostas[i];
      var cls = 'linha' + (i === estado.atual ? ' atual' : '') + (estado.revisar[i] ? ' revisar' : '');
      var rotulo = 'Questão ' + (i + 1) + ': ' + (r ? 'resposta ' + r : 'em branco') + (estado.revisar[i] ? ', marcada para revisar' : '');
      var bolhas = LETRAS.map(function (L) { return '<span class="b' + (r === L ? ' cheia' : '') + '">' + L + '</span>'; }).join('');
      return '<li><button type="button" class="' + cls + '" data-i="' + i + '" aria-label="' + rotulo + '"' + (i === estado.atual ? ' aria-current="step"' : '') + '>' +
        '<span class="num" aria-hidden="true">' + doisDig(i + 1) + '</span><span class="bolhas" aria-hidden="true">' + bolhas + '</span></button></li>';
    }).join('');
    var n = respondidas();
    document.getElementById('conta').textContent = n + ' de ' + QS.length + ' respondidas';
    document.getElementById('conta-curta').textContent = n + '/' + QS.length;
    document.getElementById('barra').style.width = (n / QS.length * 100) + '%';
  }

  function abrirCartao() {
    document.getElementById('cartao').classList.add('aberto');
    document.getElementById('veu').classList.add('aberto');
    document.getElementById('abrir-cartao').setAttribute('aria-expanded', 'true');
    var atual = document.querySelector('#linhas .linha.atual');
    if (atual) atual.focus();
  }
  function fecharCartao() {
    var c = document.getElementById('cartao');
    if (!c || !c.classList.contains('aberto')) return;
    c.classList.remove('aberto');
    document.getElementById('veu').classList.remove('aberto');
    var b = document.getElementById('abrir-cartao');
    b.setAttribute('aria-expanded', 'false');
    b.focus();
  }

  function iniciarRelogio() {
    var alvo = document.getElementById('cronometro-valor');
    var caixa = document.getElementById('cronometro');
    function tique() {
      var s = segundosDeProva();
      alvo.textContent = relogioTexto(s);
      caixa.classList.toggle('passou', s > CFG.tempoSugeridoMin * 60);
    }
    tique();
    relogio = setInterval(tique, 1000);
  }
  function pararRelogio() { if (relogio) { clearInterval(relogio); relogio = null; } }

  function confirmarFim() {
    fecharCartao();
    var brancos = QS.length - respondidas();
    var revisar = estado.revisar.filter(Boolean).length;
    var corpo = '';
    if (brancos) corpo += '<p>Você deixou <strong>' + brancos + (brancos === 1 ? ' questão' : ' questões') + ' em branco</strong>. No ENEM não há desconto por erro, então vale marcar todas.</p>';
    if (revisar) corpo += '<p>' + revisar + (revisar === 1 ? ' questão está marcada' : ' questões estão marcadas') + ' para revisar.</p>';
    if (!corpo) corpo = '<p>Todas as questões foram respondidas. Depois de finalizar, não será possível alterar as respostas.</p>';
    abrirModal('Finalizar o teste?', corpo, [
      { texto: 'Voltar ao teste', sec: true },
      { texto: 'Finalizar e ver meu laudo', acao: finalizar }
    ]);
  }
  function finalizar() {
    estado.fim = Date.now();
    estado.etapa = 'resultado';
    guardar();
    render();
    enviarResultado();
  }

  // ------------------------------------------------------------------ modal
  function abrirModal(titulo, corpoHtml, botoes) {
    var anterior = document.activeElement;
    modalAberto = true;
    modalRaiz.innerHTML =
      '<div class="modal-fundo"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">' +
        '<h2 id="modal-titulo">' + titulo + '</h2>' + corpoHtml +
        '<div class="modal-acoes">' + botoes.map(function (b, k) {
          return '<button type="button" class="btn' + (b.sec ? ' btn-sec' : '') + '" data-k="' + k + '">' + b.texto + '</button>';
        }).join('') + '</div></div></div>';
    var fechar = function () {
      modalAberto = false; modalRaiz.innerHTML = '';
      document.removeEventListener('keydown', teclaModal, true);
      if (anterior && document.body.contains(anterior)) anterior.focus();
    };
    var teclaModal = function (e) {
      if (e.key === 'Escape') { e.stopPropagation(); fechar(); }
      if (e.key === 'Tab') {
        var f = modalRaiz.querySelectorAll('button'), a = f[0], z = f[f.length - 1];
        if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
        else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
      }
    };
    document.addEventListener('keydown', teclaModal, true);
    modalRaiz.querySelector('.modal-fundo').addEventListener('click', function (e) {
      if (e.target === e.currentTarget) { fechar(); return; }
      var b = e.target.closest('button[data-k]');
      if (!b) return;
      var acao = botoes[+b.getAttribute('data-k')].acao;
      fechar();
      if (acao) acao();
    });
    var btns = modalRaiz.querySelectorAll('button');
    btns[btns.length - 1].focus();
  }

  // ------------------------------------------------------------------ teclado na prova
  document.addEventListener('keydown', function (e) {
    if (estado.etapa !== 'prova' || modalAberto) return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target.closest && e.target.closest('input, textarea, select')) return;
    var k = LETRAS.indexOf(String(e.key).toUpperCase());
    if (k >= 0 && document.getElementById('questao')) { e.preventDefault(); responder(estado.atual, LETRAS[k]); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); irPara(estado.atual + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); irPara(estado.atual - 1); }
    else if (e.key === 'Escape') fecharCartao();
  });

  // ================================================================== CORREÇÃO
  function corrigir() {
    var r = { acertos: 0, brancos: 0, niveis: {}, modulos: [] };
    NIVEIS.forEach(function (n) { r.niveis[n] = { a: 0, t: 0 }; });
    MODS.forEach(function (m) { r.modulos.push({ id: m.id, nome: m.nome, a: 0, t: 0, marcas: [], erros: [] }); });
    QS.forEach(function (q, i) {
      var resp = estado.respostas[i], ok = resp === q.correta;
      var mod = r.modulos.filter(function (m) { return m.id === q.modulo; })[0];
      if (ok) r.acertos++;
      if (!resp) r.brancos++;
      if (r.niveis[q.nivel]) { r.niveis[q.nivel].t++; if (ok) r.niveis[q.nivel].a++; }
      if (mod) {
        mod.t++; mod.marcas.push(ok);
        if (ok) mod.a++; else mod.erros.push({ n: i + 1, subtema: q.subtema });
      }
    });
    r.modulos.forEach(function (m) {
      m.p = pct(m.a, m.t);
      m.status = m.p >= CFG.metas.modulo ? 'meta' : (m.a === 0 ? 'prioridade' : 'revisar');
    });
    r.p = pct(r.acertos, QS.length);
    r.faixa = CFG.faixas.filter(function (f) { return r.p >= f.min; })[0] || CFG.faixas[CFG.faixas.length - 1];
    r.prioridades = r.modulos.filter(function (m) { return m.t && m.status !== 'meta'; })
      .sort(function (a, b) { return (a.p - b.p) || (b.t - a.t) || (a.id - b.id); });
    return r;
  }

  // ================================================================== LAUDO
  function renderLaudo() {
    var r = corrigir();
    var seg = segundosDeProva();
    var data = new Date(estado.fim || Date.now()).toLocaleDateString('pt-BR');

    var nomesNivel = { 'Fácil': 'Questões fáceis', 'Médio': 'Questões médias', 'Difícil': 'Questões difíceis' };
    var linhasNivel = [['Total', r.acertos, QS.length, CFG.metas.geral]].concat(NIVEIS.map(function (n) {
      return [nomesNivel[n], r.niveis[n].a, r.niveis[n].t, CFG.metas[n]];
    })).map(function (l) {
      var p = pct(l[1], l[2]), metaNum = Math.ceil(l[3] * l[2] - 1e-9), ok = l[1] >= metaNum;
      return '<tr><td>' + l[0] + '</td><td>' + l[1] + ' de ' + l[2] + ' <span class="vazio pct">(' + porcento(p) + ')</span></td>' +
        '<td>' + metaNum + ' ou mais</td><td class="sit ' + (ok ? 'ok' : 'baixo') + '">' + (ok ? 'Na meta' : '▼ Abaixo') + '</td></tr>';
    }).join('');

    var rotulos = { meta: 'Dentro da meta', revisar: 'Revisar', prioridade: 'Prioridade' };
    var linhasMod = r.modulos.map(function (m) {
      var segs = m.marcas.map(function (ok) { return '<i' + (ok ? ' class="ok"' : '') + '></i>'; }).join('');
      return '<li class="mod"><span class="mod-nome">' + esc(m.nome) + '</span>' +
        '<span class="segs" aria-hidden="true">' + segs + '</span>' +
        '<span class="mod-val">' + m.a + ' de ' + m.t + '</span>' +
        '<span class="tag ' + m.status + '">' + rotulos[m.status] + '</span></li>';
    }).join('');

    var blocoPrioridades = r.prioridades.length
      ? '<ol class="prioridades">' + r.prioridades.map(function (m) {
          var itens = m.erros.map(function (e) { return e.subtema.charAt(0).toLowerCase() + e.subtema.slice(1) + ' (questão ' + e.n + ')'; });
          var lista = itens.length > 1 ? itens.slice(0, -1).join(', ') + ' e ' + itens[itens.length - 1] : itens[0];
          return '<li><strong>' + esc(m.nome) + '</strong><p>Revise: ' + esc(lista) + '.</p></li>';
        }).join('') + '</ol>'
      : '<p class="sub">Você ficou dentro da meta em todos os módulos. Para continuar evoluindo, treine questões difíceis com tempo marcado e revise os comentários das que errou.</p>';

    var pF = pct(r.niveis['Fácil'].a, r.niveis['Fácil'].t), pD = pct(r.niveis['Difícil'].a, r.niveis['Difícil'].t);
    var notaTri = pF < pD
      ? '<p class="nota-tri"><strong>Atenção à coerência das respostas.</strong> Você acertou proporcionalmente mais questões difíceis do que fáceis. No ENEM, a nota é calculada pela TRI, que valoriza quem acerta as fáceis: errar questões fáceis e acertar difíceis pode ser interpretado como chute e reduzir a nota. Revise com calma as fáceis que errou.</p>'
      : '';

    var cta = CFG.ctaLink
      ? '<div class="cta"><p>' + esc(CFG.ctaDescricao) + '</p><a class="btn" href="' + esc(CFG.ctaLink) + '" target="_blank" rel="noopener">' + esc(CFG.ctaTexto) + '</a></div>'
      : '';

    app.innerHTML =
      '<main class="laudo"><article class="laudo-folha">' +
        '<header class="laudo-cab">' +
          '<div><p class="marca-curso" style="margin:0">' + esc(CFG.curso) + '</p><h1>Laudo de desempenho</h1></div>' +
          '<dl class="ficha">' +
            '<dt>Estudante</dt><dd>' + esc(estado.aluno.nome) + '</dd>' +
            '<dt>Data</dt><dd>' + data + '</dd>' +
            '<dt>Tempo de prova</dt><dd>' + duracaoTexto(seg) + '</dd>' +
          '</dl>' +
        '</header>' +

        '<section class="placar" aria-label="Resultado geral">' +
          '<p class="placar-valor"><span class="num">' + r.acertos + '</span><span class="de">/' + QS.length + '</span>' +
            '<span class="placar-legenda">questões certas (' + porcento(r.p) + ')' + (r.brancos ? ', ' + r.brancos + ' em branco' : '') + '</span></p>' +
          '<div><p class="faixa">Faixa de desempenho: <strong>' + esc(r.faixa.nome) + '</strong></p><p class="texto">' + esc(r.faixa.texto) + '</p></div>' +
        '</section>' + notaTri +

        '<section aria-labelledby="t-niveis"><h2 id="t-niveis">Resultado por nível</h2>' +
          '<p class="sub">A meta indica o desempenho esperado de quem disputa vagas concorridas.</p>' +
          '<div class="tabela-rolagem"><table class="exame"><thead><tr><th>Exame</th><th>Resultado</th><th>Meta</th><th>Situação</th></tr></thead><tbody>' + linhasNivel + '</tbody></table></div>' +
        '</section>' +

        '<section aria-labelledby="t-mods"><h2 id="t-mods">Resultado por módulo</h2>' +
          '<p class="sub">Cada barra é uma questão do módulo; as preenchidas são as que você acertou.</p>' +
          '<ul class="mods">' + linhasMod + '</ul>' +
        '</section>' +

        '<section aria-labelledby="t-prior"><h2 id="t-prior">Por onde começar</h2>' +
          (r.prioridades.length ? '<p class="sub">Módulos fora da meta, do mais urgente para o menos urgente, com os temas das questões que você errou.</p>' : '') +
          blocoPrioridades + cta +
        '</section>' +

        '<section id="gabarito" aria-labelledby="t-gab"><h2 id="t-gab">Gabarito comentado</h2>' +
          '<p class="sub">Abra cada questão para ver as alternativas e a explicação.</p>' +
          '<div class="filtro" role="group" aria-label="Filtrar questões">' +
            '<button type="button" data-f="todas" aria-pressed="' + (filtroGabarito === 'todas') + '">Todas</button>' +
            '<button type="button" data-f="erros" aria-pressed="' + (filtroGabarito === 'erros') + '">Só as que errei</button>' +
          '</div>' +
          '<div id="lista-gabarito"></div>' +
        '</section>' +

        '<div class="laudo-acoes">' +
          '<button type="button" class="btn btn-sec" id="imprimir">Imprimir laudo</button>' +
          '<button type="button" class="btn btn-sec" id="refazer">Refazer o teste</button>' +
        '</div>' +
        '<p class="envio" id="envio" role="status"></p>' +
      '</article></main>';

    pintarGabarito();
    pintarEnvio();
    app.querySelector('.filtro').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-f]');
      if (!b) return;
      filtroGabarito = b.getAttribute('data-f');
      app.querySelectorAll('.filtro button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      pintarGabarito();
    });
    document.getElementById('imprimir').addEventListener('click', function () { window.print(); });
    document.getElementById('refazer').addEventListener('click', function () {
      abrirModal('Refazer o teste?', '<p>Suas respostas atuais serão apagadas deste navegador e o teste recomeça do zero. O resultado já registrado continua salvo.</p>', [
        { texto: 'Cancelar', sec: true },
        { texto: 'Refazer o teste', acao: function () { estado = novoEstado(estado.aluno); guardar(); render(); } }
      ]);
    });
  }

  function pintarGabarito() {
    var alvo = document.getElementById('lista-gabarito');
    var html = QS.map(function (q, i) {
      var resp = estado.respostas[i], ok = resp === q.correta;
      if (filtroGabarito === 'erros' && ok) return '';
      var tag = ok ? '<span class="tag meta">Acertou</span>' : (resp ? '<span class="tag prioridade">Errou</span>' : '<span class="tag branco">Em branco</span>');
      var info = esc(nomeModulo(q.modulo)) + ', nível ' + q.nivel.toLowerCase() + '. ' +
        (resp ? 'Sua resposta: ' + resp + '. ' : 'Sem resposta. ') + 'Correta: ' + q.correta + '.';
      var alts = q.alternativas.map(function (txt, k) {
        var L = LETRAS[k], cls = L === q.correta ? 'certa' : (L === resp ? 'errada' : '');
        var rot = L === q.correta ? (L === resp ? 'Sua resposta, correta' : 'Correta') : (L === resp ? 'Sua resposta' : '');
        return '<li class="' + cls + '"><span class="l">' + L + '</span><span>' + txt + (rot ? '<em class="rotulo">' + rot + '</em>' : '') + '</span></li>';
      }).join('');
      return '<details class="gq"><summary><span class="gq-num">Questão ' + (i + 1) + '</span>' + tag + '<span class="gq-info">' + info + '</span></summary>' +
        '<div class="gq-corpo"><div class="q-texto">' + q.texto + '</div><p class="q-comando">' + q.comando + '</p>' +
        '<ul class="gq-alts">' + alts + '</ul>' +
        '<div class="comentario"><h3>Comentário</h3><p>' + q.comentario + '</p></div></div></details>';
    }).join('');
    alvo.innerHTML = html || '<p class="vazio">Você acertou todas as questões. Use o filtro "Todas" para rever os comentários.</p>';
  }

  // ------------------------------------------------------------------ envio para a planilha
  function enviarResultado() {
    if (estado.envio === 'enviado') return;
    if (!NO_APPS_SCRIPT) { estado.envio = 'previa'; guardar(); pintarEnvio(); return; }
    estado.envio = 'enviando'; pintarEnvio();
    var payload = {
      nome: estado.aluno.nome,
      email: estado.aluno.email,
      whatsapp: estado.aluno.whatsapp,
      contato: !!estado.aluno.contato,
      respostas: estado.respostas,
      tempoSegundos: segundosDeProva(),
      versao: CFG.versao
    };
    fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(payload), redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j || !j.ok) throw new Error('falhou'); estado.envio = 'enviado'; guardar(); pintarEnvio(); })
      .catch(function () { estado.envio = 'falhou'; guardar(); pintarEnvio(); });
  }
  function pintarEnvio() {
    var p = document.getElementById('envio');
    if (!p) return;
    p.classList.toggle('falhou', estado.envio === 'falhou');
    if (estado.envio === 'enviado') p.textContent = 'Resultado registrado.';
    else if (estado.envio === 'enviando') p.textContent = 'Registrando seu resultado…';
    else if (estado.envio === 'previa') p.textContent = 'Modo de visualização: neste arquivo o resultado não é enviado para a planilha.';
    else if (estado.envio === 'falhou') {
      p.innerHTML = 'Não foi possível registrar seu resultado agora. Seu laudo continua válido. <button type="button" id="reenviar">Tentar de novo</button>';
      document.getElementById('reenviar').addEventListener('click', function () { estado.envio = 'pendente'; enviarResultado(); });
    } else p.textContent = '';
  }

  render();
  if (estado.etapa === 'resultado' && (estado.envio === 'pendente' || estado.envio === 'enviando')) enviarResultado();
})();
</script>
</body>
</html>
