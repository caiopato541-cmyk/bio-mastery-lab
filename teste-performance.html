<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Teste de Performance ENEM – Biologia | Bio em Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  /* ============ Cores e fontes (ajuste aqui a identidade visual) ============ */
  :root {
    --papel: #F2F5F1;
    --folha: #FFFFFF;
    --tinta: #14201A;
    --tinta-2: #4A5A52;
    --tinta-3: #6C7B73;
    --linha: #D3DDD6;
    --linha-forte: #A8B7AE;
    --clorofila: #0D6B4C;
    --clorofila-2: #09523A;
    --clorofila-claro: #E2EFE8;
    --marca: #FFE680;
    --marca-borda: #E3C335;
    --erro: #B3261E;
    --erro-claro: #FBEAE8;
    --atencao: #8A5300;
    --atencao-claro: #FFF1D6;
    --raio-s: 6px;
    --raio-m: 12px;
    --ui: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { color-scheme: light; -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--papel); color: var(--tinta); font: 400 1rem/1.5 var(--ui); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--clorofila); outline-offset: 2px; }
  [tabindex="-1"]:focus { outline: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  h1, h2, h3 { line-height: 1.15; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 46px; padding: .625rem 1.25rem; border-radius: var(--raio-s); border: 1.5px solid var(--clorofila); background: var(--clorofila); color: #fff; font-weight: 700; cursor: pointer; text-decoration: none; }
  .btn:hover { background: var(--clorofila-2); border-color: var(--clorofila-2); }
  .btn-sec { background: transparent; color: var(--clorofila); }
  .btn-sec:hover { background: var(--clorofila-claro); }
  .btn[disabled] { opacity: .35; cursor: not-allowed; }
  .btn[disabled]:hover { background: transparent; }
  .marca-curso { font-weight: 700; color: var(--clorofila); letter-spacing: .01em; }

  /* ================================ Início ================================ */
  .inicio { max-width: 1100px; margin: 0 auto; padding: 36px 20px 64px; display: grid; gap: 36px; }
  .inicio h1 { font-size: clamp(2rem, 5vw, 3.1rem); letter-spacing: -.02em; margin: .6rem 0 1rem; max-width: 15ch; }
  .lead { font-size: 1.125rem; color: var(--tinta-2); max-width: 52ch; margin: 0; }
  .fatos { display: flex; flex-wrap: wrap; gap: 12px 32px; margin: 28px 0 32px; padding: 0; list-style: none; }
  .fatos li { color: var(--tinta-2); font-size: .9375rem; }
  .fatos strong { display: block; color: var(--tinta); font-size: 1.5rem; line-height: 1.2; }
  .inicio h2 { font-size: 1rem; margin: 0 0 12px; }
  .lista-modulos { margin: 0; padding: 0 0 0 1.6em; columns: 2; column-gap: 28px; color: var(--tinta-2); font-size: .9375rem; }
  .lista-modulos li { break-inside: avoid; padding: 2px 0; }
  .lista-modulos li::marker { color: var(--clorofila); font-weight: 700; }

  .ficha-id { background: var(--folha); border: 1px solid var(--linha); border-radius: var(--raio-m); overflow: hidden; }
  .ficha-id-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 22px; border-bottom: 1px solid var(--linha); }
  .ficha-id-topo h2 { margin: 0; font-size: 1rem; }
  .amostra { display: flex; gap: 4px; align-items: center; }
  .amostra span { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--tinta-3); }
  .amostra span.cheia { background: var(--tinta); border-color: var(--tinta); }
  .ficha-id form { padding: 20px 22px 24px; display: grid; gap: 16px; }
  .campo label { display: block; font-weight: 700; font-size: .9375rem; margin-bottom: 6px; }
  .campo .opc { font-weight: 400; color: var(--tinta-3); }
  .campo input { width: 100%; min-height: 46px; padding: 10px 12px; border: 1.5px solid var(--linha-forte); border-radius: var(--raio-s); background: var(--folha); }
  .campo input:focus { border-color: var(--clorofila); outline: none; box-shadow: 0 0 0 3px var(--clorofila-claro); }
  .campo input[aria-invalid="true"] { border-color: var(--erro); }
  .msg-erro { color: var(--erro); font-size: .875rem; margin: 6px 0 0; }
  .aceite { display: flex; gap: 10px; align-items: flex-start; font-size: .9375rem; color: var(--tinta-2); }
  .aceite input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--clorofila); flex: none; }
  .dica { font-size: .875rem; color: var(--tinta-3); margin: 0; }
  @media (min-width: 900px) {
    .inicio { grid-template-columns: 1.15fr .85fr; align-items: start; padding-top: 72px; column-gap: 56px; }
    .ficha-id { position: sticky; top: 24px; }
  }
  @media (max-width: 420px) { .lista-modulos { columns: 1; } }

  /* ================================ Prova ================================ */
  .topo { position: sticky; top: 0; z-index: 20; background: var(--folha); border-bottom: 1px solid var(--linha); }
  .topo-in { max-width: 1200px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 12px 20px; }
  .topo-titulo { color: var(--tinta-3); font-size: .9375rem; }
  .topo-dir { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .cronometro { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cronometro svg { width: 18px; height: 18px; }
  .cronometro.passou { color: var(--atencao); }
  .btn-cartao { display: none; min-height: 40px; padding: 6px 12px; }
  .progresso { height: 4px; background: var(--linha); }
  .progresso span { display: block; height: 100%; background: var(--clorofila); transition: width .3s ease; }

  .prova { max-width: 1200px; margin: 0 auto; padding: 24px 20px 96px; display: grid; gap: 28px; }
  @media (min-width: 1024px) { .prova { grid-template-columns: minmax(0, 1fr) 316px; align-items: start; } }

  .questao { background: var(--folha); border: 1px solid var(--linha); border-radius: var(--raio-m); padding: clamp(20px, 4vw, 40px); }
  .q-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .q-cab h2 { font-size: 1.375rem; margin: 0; }
  .q-cab h2 span { color: var(--tinta-3); font-weight: 400; font-size: 1rem; }
  .btn-revisar { display: inline-flex; align-items: center; gap: 6px; border: 1.5px dashed var(--linha-forte); background: none; border-radius: 999px; padding: 6px 14px; font-size: .875rem; cursor: pointer; color: var(--tinta-2); }
  .btn-revisar[aria-pressed="true"] { background: var(--marca); border: 1.5px solid var(--marca-borda); color: var(--tinta); font-weight: 700; }
  .q-texto, .q-comando { font-family: var(--serif); font-size: 1.125rem; line-height: 1.68; max-width: 68ch; }
  .q-texto p { margin: 0 0 1em; }
  .q-comando { font-weight: 600; margin: 1.25em 0 1.1em; }
  .tabela-rolagem { overflow-x: auto; margin: 0 0 1em; }
  .tabela-q { border-collapse: collapse; font-family: var(--ui); font-size: .9375rem; min-width: 440px; }
  .tabela-q th, .tabela-q td { border: 1px solid var(--linha-forte); padding: 7px 12px; text-align: center; }
  .tabela-q th { background: var(--papel); }
  .tabela-q td:first-child, .tabela-q th:first-child { text-align: left; font-weight: 700; }
  .figura-q { margin: 0 0 1em; max-width: 520px; }
  .figura-q svg { display: block; width: 100%; height: auto; color: var(--tinta); font-family: var(--ui); }
  .figura-q figcaption { font-family: var(--ui); font-size: .9375rem; color: var(--tinta-2); margin-top: 8px; }

  .alts { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .alt { display: flex; align-items: stretch; border: 1.5px solid var(--linha); border-radius: var(--raio-s); background: var(--folha); }
  .alt:hover { border-color: var(--linha-forte); }
  .alt-escolher { flex: 1; display: flex; gap: 14px; align-items: flex-start; text-align: left; background: none; border: 0; padding: 12px 14px; cursor: pointer; font-family: var(--serif); font-size: 1.0625rem; line-height: 1.55; border-radius: var(--raio-s) 0 0 var(--raio-s); }
  .bolha { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--tinta-2); display: grid; place-items: center; font: 700 .875rem var(--ui); margin-top: -2px; transition: background .12s ease; }
  .alt.marcada { border-color: var(--tinta); box-shadow: inset 0 0 0 1px var(--tinta); }
  .alt.marcada .bolha { background: var(--tinta); border-color: var(--tinta); color: #fff; }
  .alt.riscada .alt-texto { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--tinta-3); }
  .alt.riscada .bolha { opacity: .45; }
  .alt-riscar { flex: none; min-width: 72px; border: 0; border-left: 1px solid var(--linha); background: none; padding: 0 10px; font-size: .8125rem; color: var(--tinta-3); cursor: pointer; border-radius: 0 var(--raio-s) var(--raio-s) 0; }
  .alt-riscar:hover { color: var(--tinta); background: var(--papel); }
  .alt-riscar[aria-pressed="true"] { color: var(--tinta); font-weight: 700; }

  .q-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; }
  .q-nav .btn { min-width: 130px; }
  .atalhos { margin: 16px 0 0; font-size: .8125rem; color: var(--tinta-3); }
  @media (hover: none) { .atalhos { display: none; } }

  /* Cartão-resposta */
  .cartao { background: var(--folha); border: 1px solid var(--linha); border-radius: var(--raio-m); padding: 16px 16px 18px; position: sticky; top: 76px; }
  .cartao-topo { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .cartao-topo h2 { font-size: 1rem; margin: 0; }
  .cartao-conta { font-size: .875rem; color: var(--tinta-2); }
  .btn-fechar { display: none; border: 0; background: none; font-size: .9375rem; color: var(--clorofila); font-weight: 700; cursor: pointer; padding: 4px; }
  .cartao-linhas { list-style: none; margin: 12px 0 14px; padding: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(15, auto); grid-auto-flow: column; column-gap: 8px; }
  .linha { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; padding: 3px 4px; border-radius: 4px; cursor: pointer; }
  .linha:hover { background: var(--papel); }
  .linha .num { font-weight: 700; font-size: .8125rem; width: 20px; text-align: right; font-variant-numeric: tabular-nums; }
  .bolhas { display: flex; gap: 2px; }
  .b { width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--tinta-3); font-size: .5625rem; line-height: 1; display: grid; place-items: center; color: var(--tinta-3); font-weight: 700; }
  .b.cheia { background: var(--tinta); border-color: var(--tinta); color: #fff; }
  .linha.revisar, .linha.revisar:hover { background: var(--marca); }
  .linha.atual { box-shadow: inset 0 0 0 2px var(--clorofila); }
  .cartao-legenda { display: flex; align-items: center; gap: 8px; font-size: .8125rem; color: var(--tinta-2); margin: 0 0 14px; }
  .cartao-legenda i { width: 22px; height: 12px; background: var(--marca); border-radius: 2px; }
  .cartao .btn { width: 100%; }
  .veu { display: none; }

  @media (max-width: 1023px) {
    .btn-cartao { display: inline-flex; }
    .topo-titulo { display: none; }
    .cartao { position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 40; border-radius: 16px 16px 0 0; max-height: 86vh; overflow: auto; padding: 18px 20px 22px;
      transform: translateY(105%); visibility: hidden; transition: transform .25s ease, visibility 0s linear .25s; box-shadow: 0 -10px 30px rgba(20, 32, 26, .18); }
    .cartao.aberto { transform: none; visibility: visible; transition: transform .25s ease; }
    .btn-fechar { display: inline-block; }
    .veu.aberto { display: block; position: fixed; inset: 0; background: rgba(20, 32, 26, .4); z-index: 30; }
    .b { width: 22px; height: 22px; font-size: .6875rem; }
    .linha { padding: 5px 4px; }
  }
  @media (max-width: 520px) {
    .alt-escolher { padding: 12px 10px; gap: 10px; }
    .alt-riscar { min-width: 58px; padding: 0 6px; }
    .q-nav .btn { min-width: 0; flex: 1; }
    .b { width: 19px; height: 19px; font-size: .625rem; }
  }

  /* ================================ Modal ================================ */
  .modal-fundo { position: fixed; inset: 0; background: rgba(20, 32, 26, .45); display: grid; place-items: center; padding: 20px; z-index: 60; }
  .modal { background: var(--folha); border-radius: var(--raio-m); max-width: 460px; width: 100%; padding: 26px; box-shadow: 0 20px 50px rgba(20, 32, 26, .25); }
  .modal h2 { margin: 0 0 10px; font-size: 1.25rem; }
  .modal p { margin: 0 0 12px; color: var(--tinta-2); }
  .modal-acoes { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* ================================ Laudo ================================ */
  .laudo { max-width: 880px; margin: 0 auto; padding: 32px 20px 80px; }
  .laudo-folha { background: var(--folha); border: 1px solid var(--linha); border-radius: var(--raio-m); padding: clamp(20px, 4.5vw, 48px); }
  .laudo-cab { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 32px; padding-bottom: 18px; border-bottom: 2px solid var(--tinta); }
  .laudo h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(1.75rem, 4.5vw, 2.4rem); letter-spacing: -.01em; margin: .3rem 0 0; }
  .ficha { display: grid; grid-template-columns: auto auto; gap: 4px 18px; margin: 0; font-size: .9375rem; }
  .ficha dt { color: var(--tinta-3); }
  .ficha dd { margin: 0; font-weight: 700; }
  .laudo section { margin-top: 40px; }
  .laudo h2 { font-family: var(--serif); font-weight: 600; font-size: 1.375rem; margin: 0 0 6px; }
  .laudo .sub { color: var(--tinta-2); margin: 0 0 18px; max-width: 62ch; }

  .placar { display: grid; gap: 18px 36px; align-items: center; margin-top: 32px; }
  @media (min-width: 640px) { .placar { grid-template-columns: auto 1fr; } }
  .placar-valor { margin: 0; font-family: var(--serif); line-height: .9; font-variant-numeric: lining-nums; }
  .placar-valor .num { font-size: clamp(4.5rem, 14vw, 6.5rem); font-weight: 600; letter-spacing: -.03em; }
  .placar-valor .de { font-size: 1.5rem; color: var(--tinta-3); margin-left: 4px; }
  .placar-legenda { display: block; font: 400 .9375rem var(--ui); color: var(--tinta-2); margin-top: 8px; }
  .faixa { margin: 0 0 6px; font-size: 1.125rem; }
  .placar p.texto { margin: 0; color: var(--tinta-2); max-width: 56ch; }
  .nota-tri { margin-top: 18px; padding: 14px 16px; border-left: 4px solid var(--marca-borda); background: #FFFBEA; border-radius: 0 var(--raio-s) var(--raio-s) 0; font-size: .9375rem; }

  .exame { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .exame th { text-align: left; font-size: .875rem; color: var(--tinta-2); font-weight: 700; border-bottom: 1.5px solid var(--tinta); padding: 8px 10px 8px 0; }
  .exame td { padding: 12px 10px 12px 0; border-bottom: 1px solid var(--linha); }
  .exame td:first-child { font-weight: 700; }
  .sit { font-weight: 700; white-space: nowrap; }
  .sit.ok { color: var(--clorofila); }
  .sit.baixo { color: var(--erro); }
  @media (max-width: 520px) {
    .exame { font-size: .9375rem; }
    .exame .pct { display: block; }
    .q-texto, .q-comando { font-size: 1.0625rem; }
    .alt-escolher { font-size: 1rem; }
  }

  .mods { list-style: none; margin: 0; padding: 0; border-top: 1.5px solid var(--tinta); }
  .mod { display: grid; grid-template-columns: minmax(0, 1fr) auto 64px 116px; align-items: center; gap: 8px 16px; padding: 12px 0; border-bottom: 1px solid var(--linha); }
  .mod-nome { font-weight: 700; }
  .segs { display: flex; gap: 4px; }
  .segs i { width: 30px; height: 12px; border-radius: 2px; border: 1.5px solid var(--linha-forte); }
  .segs i.ok { background: var(--clorofila); border-color: var(--clorofila); }
  .mod-val { font-variant-numeric: tabular-nums; color: var(--tinta-2); font-size: .9375rem; }
  .tag { display: inline-block; justify-self: start; padding: 3px 10px; border-radius: 999px; font-size: .8125rem; font-weight: 700; white-space: nowrap; }
  .tag.meta { background: var(--clorofila-claro); color: var(--clorofila-2); }
  .tag.revisar { background: var(--atencao-claro); color: var(--atencao); }
  .tag.prioridade { background: var(--erro-claro); color: var(--erro); }
  .tag.branco { background: var(--papel); color: var(--tinta-2); }
  @media (max-width: 560px) {
    .mod { grid-template-columns: auto 1fr auto; }
    .mod-nome { grid-column: 1 / -1; }
  }

  .prioridades { margin: 0; padding: 0 0 0 1.5em; display: grid; gap: 14px; }
  .prioridades li::marker { font-weight: 700; color: var(--erro); }
  .prioridades strong { font-size: 1.0625rem; }
  .prioridades p { margin: 2px 0 0; color: var(--tinta-2); }

  .cta { margin-top: 40px; padding: 24px; border-radius: var(--raio-m); background: var(--clorofila); color: #fff; }
  .cta p { margin: 0 0 16px; max-width: 58ch; font-size: 1.0625rem; }
  .cta .btn { background: #fff; color: var(--clorofila-2); border-color: #fff; }
  .cta .btn:hover { background: var(--clorofila-claro); }

  .filtro { display: inline-flex; border: 1.5px solid var(--clorofila); border-radius: var(--raio-s); overflow: hidden; margin-bottom: 16px; }
  .filtro button { border: 0; background: none; padding: 8px 14px; cursor: pointer; color: var(--clorofila); font-weight: 700; font-size: .9375rem; }
  .filtro button[aria-pressed="true"] { background: var(--clorofila); color: #fff; }
  .gq { border: 1px solid var(--linha); border-radius: var(--raio-s); margin-bottom: 10px; }
  .gq summary { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: center; padding: 12px 14px; cursor: pointer; list-style: none; }
  .gq summary::-webkit-details-marker { display: none; }
  .gq summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--tinta-2); border-bottom: 2px solid var(--tinta-2); transform: rotate(-45deg); transition: transform .15s ease; grid-row: 1 / span 2; }
  .gq[open] summary::before { transform: rotate(45deg); }
  .gq-num { font-weight: 700; }
  .gq-info { color: var(--tinta-2); font-size: .875rem; grid-column: 2 / -1; }
  .gq summary .tag { grid-column: 3; grid-row: 1; }
  .gq-corpo { padding: 4px 18px 20px; border-top: 1px solid var(--linha); }
  .gq-corpo .q-texto, .gq-corpo .q-comando { font-size: 1.0625rem; }
  .gq-alts { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 6px; font-family: var(--serif); }
  .gq-alts li { display: flex; gap: 10px; padding: 8px 10px; border-radius: var(--raio-s); align-items: flex-start; }
  .gq-alts .l { font: 700 .875rem var(--ui); width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--tinta-3); display: grid; place-items: center; flex: none; margin-top: 1px; }
  .gq-alts .certa { background: var(--clorofila-claro); }
  .gq-alts .certa .l { background: var(--clorofila); border-color: var(--clorofila); color: #fff; }
  .gq-alts .errada { background: var(--erro-claro); }
  .gq-alts .errada .l { background: var(--erro); border-color: var(--erro); color: #fff; }
  .gq-alts em.rotulo { font: 700 .8125rem var(--ui); font-style: normal; margin-left: 6px; white-space: nowrap; }
  .gq-alts .certa em.rotulo { color: var(--clorofila-2); }
  .gq-alts .errada em.rotulo { color: var(--erro); }
  .comentario { background: var(--papel); border-radius: var(--raio-s); padding: 14px 16px; }
  .comentario h3 { font-size: .9375rem; margin: 0 0 6px; }
  .comentario p { margin: 0; line-height: 1.6; }
  .vazio { color: var(--tinta-2); }

  .laudo-acoes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 36px; }
  .envio { font-size: .875rem; color: var(--tinta-3); margin: 14px 0 0; }
  .envio.falhou { color: var(--erro); }
  .envio button { border: 0; background: none; color: var(--clorofila); font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; }

  @media print {
    body { background: #fff; }
    .laudo { padding: 0; }
    .laudo-folha { border: 0; padding: 0; }
    .laudo-acoes, .filtro, .envio, .cta, #gabarito { display: none !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
