e uma samambaia. No musgo, a parte verde e duradoura forma um tapete baixo e sustenta hastes finas com uma cápsula na ponta. Na samambaia, a planta verde tem folhas grandes, e na face inferior das folhas há pontinhos marrons.<\/p>", "cmd": "Assinale a alternativa correta.", "alts": {"a": "Os pontinhos marrons sob as folhas da samambaia são sementes, que caem no solo e germinam formando novas samambaias, como ocorre nas plantas com flores.", "b": "A fase verde duradoura é o gametófito (n) no musgo e o esporófito (2n), vascular, na samambaia, cujos soros reúnem esporângios, que produzem esporos.", "c": "Musgos e samambaias não têm vasos condutores de seiva; por isso ambos precisam de ambientes úmidos e dependem da água para a fecundação e o transporte interno.", "d": "Nas duas plantas, a fase verde duradoura é o esporófito diploide (2n), como em todas as plantas; a fase haploide (n) corresponde apenas aos gametas, como nos animais."}, "gab": "b", "eq": {"a": {"nome": "Esporos (soros) = sementes", "exp": "O aluno interpreta os soros como sementes, mas samambaias não produzem sementes; os soros contêm esporângios que liberam esporos, estruturas unicelulares que originam o gametófito (prótalo)."}, "c": {"nome": "Pteridófitas sem vasos", "exp": "O aluno agrupa musgos e samambaias por dependerem da água, mas as samambaias já têm xilema e floema (são vasculares), o que permite porte maior; só as briófitas são avasculares."}, "d": {"nome": "Esporófito sempre dominante (ciclo gamético)", "exp": "O aluno transfere o ciclo animal para as plantas, mas nelas há alternância de gerações com um gametófito multicelular, que é justamente a fase dominante nas briófitas."}}, "ok": "Plantas têm alternância de gerações entre gametófito (n) e esporófito (2n). Nas briófitas (musgos), o gametófito é a fase verde e duradoura, e o esporófito (haste com cápsula) depende dele. Nas pteridófitas (samambaias), o esporófito é dominante e vascular, mas não há flores nem sementes: a dispersão é feita por esporos, produzidos em esporângios agrupados nos soros.", "int": "Construir com a turma o ciclo de vida de um musgo e de uma samambaia lado a lado, marcando n e 2n, e montar uma tabela de novidades evolutivas (vasos, sementes, flores/frutos) por grupo."}, {"id": "FIS1", "area": "Saúde humana e fisiologia", "ponto": "Digestão de gorduras: a bile (produzida pelo fígado, armazenada na vesícula) emulsifica e não é enzima; a lipase pancreática é que digere", "html": "<p>Um paciente teve a vesícula biliar removida e foi orientado a evitar refeições muito gordurosas. A digestão de proteínas e de carboidratos, porém, continuou normal após a cirurgia.<\/p>", "cmd": "Por que a retirada da vesícula prejudica sobretudo a digestão de refeições gordurosas?", "alts": {"a": "A vesícula produz a bile, uma enzima que quebra as gorduras em ácidos graxos e glicerol; sem ela, a digestão química das gorduras deixa de ocorrer no intestino.", "b": "A vesícula é o órgão onde as gorduras digeridas são absorvidas para o sangue; sem ela, as gorduras não são aproveitadas e passam direto para as fezes.", "c": "A vesícula produz a lipase, a enzima que digere as gorduras; sem a vesícula, falta essa enzima no intestino, e as gorduras deixam de ser digeridas.", "d": "A bile, feita pelo fígado e guardada na vesícula, emulsifica as gorduras e facilita a ação da lipase; sem vesícula, falta bile concentrada nas refeições."}, "gab": "d", "eq": {"a": {"nome": "Bile como enzima (produzida pela vesícula)", "exp": "O aluno atribui à bile a quebra química das gorduras, mas quem as hidrolisa é a lipase; a bile, feita pelo fígado e apenas armazenada na vesícula, só as fragmenta em gotículas (emulsificação), aumentando a superfície de ação da enzima."}, "b": {"nome": "Vesícula como órgão de absorção", "exp": "O aluno imagina a vesícula como parte do trajeto do alimento, mas nenhum alimento passa por ela: a vesícula só armazena bile, e a absorção das gorduras ocorre no intestino delgado."}, "c": {"nome": "Vesícula como glândula produtora da lipase", "exp": "O aluno atribui à vesícula a produção da enzima que digere as gorduras, mas a lipase vem do pâncreas; a vesícula apenas armazena e concentra a bile produzida pelo fígado."}}, "ok": "A bile é produzida pelo fígado, armazenada e concentrada na vesícula e liberada no duodeno quando chega uma refeição gordurosa. Não tem enzimas digestivas: seus sais emulsificam as gorduras em gotículas, aumentando a superfície de ação da lipase pancreática, que é a enzima que as hidrolisa. Sem a vesícula, a bile escorre continuamente para o intestino, e falta bile concentrada na hora de uma refeição rica em gordura.", "int": "Montar um quadro órgão × secreção × enzima × substrato × produto, destacando que a bile não aparece na coluna das enzimas e que a vesícula só armazena, e fazer a demonstração de emulsificação com óleo, água e detergente."}, {"id": "FIS2", "area": "Saúde humana e fisiologia", "ponto": "Artéria é o vaso que sai do coração, não o que leva sangue oxigenado", "html": "<p>Um estudante afirmou: “Artérias carregam sangue rico em oxigênio, e veias carregam sangue pobre em oxigênio.” O professor pediu que ele verificasse a regra no caso da artéria pulmonar e das veias pulmonares.<\/p>", "cmd": "Sobre os vasos sanguíneos humanos, assinale a alternativa correta.", "alts": {"a": "A regra do estudante está correta; a artéria pulmonar só recebe esse nome por ser calibrosa e ter parede espessa, mas, por levar sangue pobre em O2, é na verdade uma veia.", "b": "Artéria é o vaso que sai do coração, e veia é o que chega a ele, qualquer que seja o teor de O2; assim, a artéria pulmonar leva aos pulmões sangue pobre em O2.", "c": "Artéria é o vaso que traz o sangue dos órgãos de volta ao coração, e veia é o que leva o sangue do coração para o corpo; por isso a artéria pulmonar chega ao coração com sangue pobre em O2.", "d": "No coração humano, o sangue oxigenado e o não oxigenado se misturam; por isso todas as artérias, inclusive a pulmonar, levam sangue parcialmente oxigenado, e a regra vale só como aproximação."}, "gab": "b", "eq": {"a": {"nome": "Artéria = sangue oxigenado", "exp": "O aluno define o vaso pelo tipo de sangue, mas o critério é o sentido do fluxo em relação ao coração; a artéria pulmonar sai do ventrículo direito com sangue pobre em O2 e é artéria de fato."}, "c": {"nome": "Sentido de artérias e veias invertido", "exp": "O aluno troca a direção: artérias saem do coração (e têm parede mais espessa e elástica) e veias chegam a ele."}, "d": {"nome": "Mistura de sangue no coração humano", "exp": "O aluno supõe que os lados do coração se comunicam, mas nos mamíferos a circulação é dupla e completa: o septo separa totalmente o sangue pobre em O2 (lado direito) do oxigenado (lado esquerdo)."}}, "ok": "Artérias são os vasos que saem do coração; veias são os que chegam a ele, independentemente do teor de O2. Na circulação sistêmica, as artérias levam sangue oxigenado; na pulmonar, a artéria pulmonar sai do ventrículo direito com sangue pobre em O2 e as veias pulmonares chegam ao átrio esquerdo com sangue oxigenado.", "int": "Traçar com a turma o trajeto completo do sangue num esquema do coração, classificando cada vaso apenas pelo sentido (sai/chega) e anotando separadamente o teor de O2."}, {"id": "FIS3", "area": "Saúde humana e fisiologia", "ponto": "Insulina reduz a glicemia, glucagon eleva; diabetes tipo 1 × tipo 2", "html": "<p>Após uma refeição rica em carboidratos, a glicose no sangue de uma pessoa saudável sobe e, cerca de duas horas depois, volta ao nível normal. Em jejum de algumas horas, a glicemia também se mantém estável, sem cair muito.<\/p>", "cmd": "Sobre esse controle da glicemia, assinale a alternativa correta.", "alts": {"a": "Após a refeição, a insulina estimula músculos e tecido adiposo a captar glicose e o fígado a formar glicogênio; no jejum, o glucagon faz o fígado liberar glicose.", "b": "Após a refeição, o pâncreas libera glucagon, que retira a glicose do sangue e a guarda no fígado; no jejum, libera insulina, que eleva a glicemia fornecendo açúcar às células.", "c": "O controle é feito pela insulina; no diabetes tipo 1, o pâncreas a produz normalmente, mas as células não respondem a ela, e no tipo 2 o pâncreas deixa de produzi-la por destruição das células.", "d": "Após a refeição, a glicemia volta ao normal porque os rins eliminam o excesso de glicose na urina; é por isso que pessoas saudáveis sempre apresentam glicose na urina após comer doces."}, "gab": "a", "eq": {"b": {"nome": "Insulina e glucagon invertidos", "exp": "O aluno troca as funções dos hormônios, mas a insulina é hipoglicemiante (liberada quando a glicemia sobe) e o glucagon é hiperglicemiante (liberado quando ela cai)."}, "c": {"nome": "Tipos de diabetes trocados", "exp": "O aluno inverte os tipos: no tipo 1 há destruição autoimune das células beta e falta de insulina; no tipo 2 há resistência das células à insulina, muitas vezes com produção insuficiente, geralmente associada a obesidade e sedentarismo."}, "d": {"nome": "Rim como regulador normal da glicemia", "exp": "O aluno acha que o excesso de glicose sai pela urina, mas em pessoas saudáveis os rins reabsorvem praticamente toda a glicose filtrada; glicose na urina é sinal de glicemia muito alta, como no diabetes descontrolado."}}, "ok": "A insulina, liberada pelas células beta do pâncreas quando a glicemia sobe, aumenta a captação de glicose por células como as musculares e adiposas e a síntese de glicogênio, reduzindo a glicemia. O glucagon, liberado quando a glicemia cai, estimula a quebra de glicogênio no fígado e eleva a glicemia. No diabetes tipo 1 falta insulina; no tipo 2 há resistência à insulina, muitas vezes com produção insuficiente.", "int": "Analisar com os alunos gráficos de glicemia, insulina e glucagon ao longo do dia (após refeição e em jejum) e comparar curvas de pessoas sem diabetes, com tipo 1 e com tipo 2."}, {"id": "FIS4", "area": "Saúde humana e fisiologia", "ponto": "Vacina (imunização ativa, memória, preventiva) × soro (imunização passiva, anticorpos prontos, efeito imediato e temporário)", "html": "<p>No mesmo dia, duas pessoas procuraram um posto de saúde: uma havia acabado de ser picada por uma jararaca; a outra ia tomar a vacina contra a febre amarela, pois faria uma viagem para uma região de mata dali a um mês.<\/p>", "cmd": "Sobre a conduta adequada em cada caso e o modo de ação de cada produto, assinale a alternativa correta.", "alts": {"a": "A vítima da picada deve receber a vacina antiofídica, pois ela age em poucos minutos neutralizando o veneno e ainda protege contra novas picadas no futuro.", "b": "A vacina contra a febre amarela contém anticorpos prontos contra o vírus, que passam a circular no sangue e protegem a pessoa, sem ativar seu sistema imune.", "c": "A vítima deve receber soro, com anticorpos prontos, de ação imediata e sem memória; a vacina faz o organismo produzir anticorpos e células de memória.", "d": "A vítima da picada deve receber soro, que estimula o organismo dela a produzir os próprios anticorpos e células de memória, protegendo-a de novas picadas."}, "gab": "c", "eq": {"a": {"nome": "Vacina como tratamento imediato (troca vacina × soro)", "exp": "O aluno usa &quot;vacina&quot; para qualquer injeção protetora, mas a vacina leva dias ou semanas para induzir resposta; em uma emergência é preciso soro, com anticorpos já prontos."}, "b": {"nome": "Vacina contém anticorpos (vacina como imunização passiva)", "exp": "O aluno acha que a vacina já traz anticorpos, mas ela contém antígenos (vírus atenuado, inativado ou partes dele) que estimulam o organismo a produzir os próprios anticorpos e células de memória (imunização ativa)."}, "d": {"nome": "Soro como imunização ativa (soro gera memória)", "exp": "O aluno acerta a conduta, mas atribui ao soro o mecanismo da vacina; o soro traz anticorpos produzidos por outro animal, que neutralizam o veneno e são eliminados em semanas, sem ativar a produção de anticorpos nem deixar memória."}}, "ok": "O soro fornece anticorpos prontos (produzidos em outro animal): a imunização é passiva, de ação imediata e temporária, sem memória, e é usado em emergências como picadas e tétano acidental. A vacina contém antígenos que induzem imunização ativa, com produção de anticorpos e células de memória, sendo preventiva e duradoura, mas leva dias a semanas para proteger.", "int": "Montar uma tabela comparativa vacina × soro (o que contém, tipo de imunização, rapidez, duração, memória, uso) e discutir casos reais de conduta, como picadas de animais peçonhentos e vacinação antes de viagens."}, {"id": "BIO1", "area": "Biodiversidade", "ponto": "Vírus: acelulares, parasitas intracelulares obrigatórios; antibióticos não agem sobre eles", "html": "<p>Um pesquisador preparou um meio de cultura estéril, rico em glicose, aminoácidos e sais, sem células vivas, mantido a 37 °C, e adicionou um antibiótico para evitar contaminação por bactérias. Em seguida, adicionou ao meio o vírus da gripe. Após uma semana, o número de partículas virais não havia aumentado.<\/p>", "cmd": "Por que o número de partículas virais não aumentou?", "alts": {"a": "Os vírus não se multiplicaram porque são acelulares e não têm metabolismo nem ribossomos próprios; só se replicam dentro de células vivas, usando a maquinaria delas.", "b": "Os vírus da gripe só se multiplicam no interior de bactérias, e o antibiótico adicionado ao meio eliminou as bactérias que poderiam hospedá-los.", "c": "Os vírus se reproduzem por divisão binária, como as bactérias, porém muito mais lentamente; uma semana foi um tempo curto demais para perceber o aumento no número de partículas.", "d": "O antibiótico adicionado ao meio destruiu os vírus, impedindo sua multiplicação; sem ele, os vírus teriam se multiplicado normalmente usando os nutrientes disponíveis."}, "gab": "a", "eq": {"b": {"nome": "Hospedeiro errado: vírus humano replicado em bactérias", "exp": "O aluno sabe que o vírus precisa de uma célula, mas supõe que ela seja uma bactéria (ou que “micróbios” se hospedem uns nos outros); o vírus da gripe se replica em células de animais, como as do trato respiratório, e o meio não tinha células de nenhum tipo."}, "c": {"nome": "Vírus = bactéria pequena (divisão binária)", "exp": "O aluno aplica aos vírus a reprodução bacteriana, mas vírus não se dividem; são montados dentro da célula hospedeira a partir de componentes que ela sintetiza sob comando do genoma viral."}, "d": {"nome": "Antibiótico age sobre vírus", "exp": "O aluno acha que antibióticos matam qualquer micróbio, mas eles atuam em alvos bacterianos (parede, ribossomos bacterianos) ausentes nos vírus; mesmo sem antibiótico, o vírus não se multiplicaria sem células."}}, "ok": "Vírus são acelulares: não têm citoplasma, ribossomos nem metabolismo próprio. São parasitas intracelulares obrigatórios, pois só se replicam dentro de células vivas, usando os ribossomos, as enzimas e a energia da hospedeira. Por isso são cultivados em células (ovos embrionados, culturas celulares), e antibióticos não os afetam.", "int": "Comparar com a turma um esquema de bactéria e de vírus, listando o que cada um tem (membrana, ribossomos, metabolismo), e descrever passo a passo o ciclo de replicação viral dentro de uma célula."}, {"id": "BIO2", "area": "Biodiversidade", "ponto": "Fungos não são plantas: heterótrofos por absorção, parede de quitina, reserva de glicogênio; mais próximos dos animais", "html": "<p>Cogumelos crescem sobre troncos caídos, no interior escuro da mata, e durante muito tempo foram estudados junto com as plantas. Hoje os fungos formam um reino próprio, o reino Fungi.<\/p>", "cmd": "Qual alternativa apresenta características que justificam essa separação?", "alts": {"a": "Fungos são plantas sem clorofila que retiram o alimento pronto do solo e da madeira por meio das hifas, que funcionam como raízes; diferem das outras plantas apenas pela cor.", "b": "Fungos têm parede celular de celulose e armazenam amido, como as plantas; foram separados delas somente porque não têm clorofila e não fazem fotossíntese.", "c": "Fungos são heterótrofos por absorção (digestão extracelular), têm parede celular de quitina e reserva de glicogênio; são mais aparentados aos animais que às plantas.", "d": "Fungos são animais primitivos, pois são heterótrofos que ingerem pedaços de matéria orgânica e os digerem em uma cavidade interna, como fazem os vermes e outros animais."}, "gab": "c", "eq": {"a": {"nome": "Fungo é planta (hifa = raiz)", "exp": "O aluno mantém os fungos no grupo das plantas por viverem fixos no substrato, mas hifas não são raízes: os fungos liberam enzimas e absorvem o alimento digerido, um modo de nutrição que não existe nas plantas."}, "b": {"nome": "Fungos com celulose e amido", "exp": "O aluno supõe que fungos são plantas sem clorofila e com a mesma bioquímica, mas a parede dos fungos é de quitina (como o exoesqueleto de artrópodes) e a reserva é glicogênio (como nos animais)."}, "d": {"nome": "Parentesco = pertencer ao grupo (fungo é animal que ingere)", "exp": "O aluno transforma &quot;mais próximos dos animais&quot; em &quot;são animais&quot; e atribui-lhes ingestão, mas fungos não têm cavidade digestiva: digerem fora do corpo e absorvem; formam um reino-irmão dos animais, não parte dele."}}, "ok": "Fungos são eucariontes heterótrofos por absorção: secretam enzimas que digerem a matéria orgânica fora do corpo e absorvem os produtos pelas hifas. Sua parede celular é de quitina e a reserva energética é o glicogênio. Dados moleculares mostram que fungos e animais compartilham um ancestral comum mais recente do que com as plantas.", "int": "Construir uma tabela comparativa plantas × fungos × animais (nutrição, parede celular, reserva, organização do corpo) e discutir o papel dos fungos como decompositores."}, {"id": "BIO3", "area": "Biodiversidade", "ponto": "Bactérias: a maioria não é patogênica; decomposição, fixação de N e microbiota; são procariontes (sem núcleo)", "html": "<p>Um anúncio de produto de limpeza dizia: “Elimina 99,9% das bactérias — porque toda bactéria é uma ameaça à sua saúde.” Uma professora usou a frase para discutir o papel das bactérias nos ecossistemas e no corpo humano.<\/p>", "cmd": "Sobre as bactérias, assinale a alternativa correta.", "alts": {"a": "A frase do anúncio está correta: se fosse possível eliminar todas as bactérias do ambiente e do corpo humano, tanto a saúde das pessoas quanto os ecossistemas seriam beneficiados.", "b": "A maioria das bactérias não causa doenças; muitas atuam na decomposição da matéria orgânica, algumas fixam o nitrogênio do ar e outras compõem a microbiota intestinal.", "c": "Bactérias não participam dos ciclos da matéria: na natureza, a decomposição é feita só por fungos, e as plantas fixam sozinhas o nitrogênio do ar, pelas folhas.", "d": "Bactérias são células com núcleo organizado que se reproduzem por mitose, como as do corpo humano; por isso, antibióticos que as atacam também lesam nossas células."}, "gab": "b", "eq": {"a": {"nome": "Bactéria = germe (toda bactéria é nociva)", "exp": "O aluno associa bactérias só a doenças, mas a grande maioria é inofensiva ou benéfica; sem elas, a ciclagem de nutrientes pararia e o corpo perderia a microbiota que ajuda na digestão e na defesa."}, "c": {"nome": "Bactérias sem papel nos ciclos da matéria", "exp": "O aluno atribui a fungos e plantas as funções ecológicas das bactérias, mas bactérias são decompositoras ao lado dos fungos, e as plantas não conseguem usar o N2 do ar, que é fixado por bactérias (como as dos nódulos de leguminosas)."}, "d": {"nome": "Bactéria como célula eucariótica (núcleo e mitose)", "exp": "O aluno aplica às bactérias o modelo de célula eucariótica, mas bactérias são procariontes, sem núcleo organizado, e se reproduzem por divisão binária; justamente por serem diferentes, podem ser atingidas por antibióticos sem dano às nossas células."}}, "ok": "Só uma pequena parte das bactérias é patogênica; a maioria é inofensiva ou essencial: decompositoras reciclam nutrientes, fixadoras (como <i>Rhizobium<\/i> nas raízes de leguminosas) tornam o nitrogênio disponível para as plantas, e a microbiota intestinal ajuda na digestão, produz vitaminas e protege contra patógenos. Bactérias são procariontes, sem núcleo, e se reproduzem por divisão binária; por isso antibióticos podem atingir estruturas delas sem lesar nossas células.", "int": "Discutir exemplos de bactérias benéficas (ciclo do nitrogênio, microbiota, alimentos, biotecnologia) e propor uma estimativa de consequências de um mundo sem bactérias."}, {"id": "BIO4", "area": "Biodiversidade", "ponto": "Agente × vetor: malária (protozoário Plasmodium, mosquito Anopheles) × dengue (vírus, Aedes aegypti) × tuberculose (bactéria, via aérea)", "html": "<p>Três pacientes foram atendidos em um hospital: um com malária, um com dengue e um com tuberculose. Para decidir o tratamento e as medidas de prevenção, o médico precisa saber o agente causador e a forma de transmissão de cada doença.<\/p>", "cmd": "Qual alternativa relaciona corretamente cada doença a seu agente causador e à sua transmissão?", "alts": {"a": "Malária: vírus, transmitido pelo mosquito <i>Anopheles<\/i>; dengue: vírus, transmitido pelo mosquito <i>Aedes aegypti<\/i>; tuberculose: vírus, transmitido pelo ar, como a gripe.", "b": "Malária: protozoário (<i>Plasmodium<\/i>), transmitido pelo mosquito <i>Aedes aegypti<\/i>; dengue: vírus, transmitido pelo mosquito <i>Anopheles<\/i>; tuberculose: bactéria, transmitida pelo ar.", "c": "Malária: causada pelo mosquito <i>Anopheles<\/i>, que é o próprio agente; dengue: causada pelo mosquito <i>Aedes aegypti<\/i>, o próprio agente; tuberculose: bactéria, transmitida pelo ar.", "d": "Malária: protozoário (<i>Plasmodium<\/i>), transmitido pelo <i>Anopheles<\/i>; dengue: vírus, transmitido pelo <i>Aedes aegypti<\/i>; tuberculose: bactéria, transmitida pelo ar."}, "gab": "d", "eq": {"a": {"nome": "Toda doença infecciosa é virose", "exp": "O aluno atribui qualquer infecção a vírus, mas a malária é causada por um protozoário (<i>Plasmodium<\/i>) e a tuberculose por uma bactéria; o tipo de agente define o tratamento (antimaláricos, antibióticos)."}, "b": {"nome": "Vetores trocados (Anopheles × Aedes)", "exp": "O aluno acerta os agentes, mas troca os mosquitos: a malária é transmitida pelo <i>Anopheles<\/i> e a dengue pelo <i>Aedes aegypti<\/i>, o que muda os hábitos do vetor e as medidas de prevenção."}, "c": {"nome": "Vetor = agente causador", "exp": "O aluno confunde quem transmite com quem causa a doença: o mosquito é o vetor; o agente etiológico é o <i>Plasmodium<\/i>, na malária, e o vírus da dengue, na dengue."}}, "ok": "A malária é causada por protozoários do gênero <i>Plasmodium<\/i>, transmitidos pela picada da fêmea do mosquito <i>Anopheles<\/i>, e é tratada com antimaláricos. A dengue é causada por um vírus transmitido pelo <i>Aedes aegypti<\/i>, sem antiviral específico. A tuberculose é causada por uma bactéria (<i>Mycobacterium tuberculosis<\/i>), transmitida por via aérea; entre as três, só ela tem antibióticos como tratamento principal. O mosquito é vetor, não agente.", "int": "Montar com a turma uma tabela doença × agente (tipo de ser vivo) × vetor/transmissão × tratamento × prevenção, distinguindo sempre agente etiológico e vetor."}, {"id": "ECO1", "area": "Ecologia", "ponto": "Energia flui em sentido único e se perde como calor (~10%); a matéria circula", "html": "<p>Considere a cadeia alimentar: capim → gafanhoto → sapo → cobra. Um estudante afirmou: “A energia e a matéria passam de um nível para o outro e, quando os organismos morrem, voltam ao capim pela ação dos decompositores, fechando um ciclo.”<\/p>", "cmd": "Assinale a alternativa correta.", "alts": {"a": "O estudante está correto: tanto a matéria quanto a energia são recicladas pelos decompositores, e por isso o ecossistema não precisa de uma fonte externa de energia para se manter.", "b": "A energia não volta ao capim porque vai se acumulando ao longo da cadeia; a cobra, no topo, concentra a energia de todos os níveis anteriores e é o nível com mais energia disponível.", "c": "A matéria circula e volta ao capim pela decomposição, mas a energia flui em sentido único: a cada nível, grande parte se dissipa como calor, e a cadeia depende da luz solar.", "d": "Nem a matéria nem a energia retornam ao capim: ambas são consumidas pelos organismos e deixam de existir a cada nível, por isso a cadeia tem poucos níveis tróficos."}, "gab": "c", "eq": {"a": {"nome": "Energia reciclada", "exp": "O aluno aplica à energia o mesmo raciocínio da matéria, mas a energia química é convertida em calor na respiração e não pode ser reaproveitada pelos produtores; o ecossistema depende de entrada contínua de luz."}, "b": {"nome": "Energia acumulada no topo", "exp": "O aluno imagina que o predador soma a energia de toda a cadeia, mas cada nível recebe só cerca de 10% da energia do anterior; o topo é o nível com menos energia disponível."}, "d": {"nome": "Matéria e energia destruídas (\"consumidas\")", "exp": "O aluno entende &quot;consumir&quot; como fazer desaparecer, mas matéria e energia se conservam: os átomos são reciclados pelos decompositores, e a energia é transformada em calor, não destruída."}}, "ok": "A matéria circula no ecossistema: os decompositores transformam a matéria orgânica em CO2 e nutrientes minerais, reaproveitados pelos produtores. A energia entra como luz, é fixada na fotossíntese e flui em sentido único: em cada transferência, grande parte da energia é dissipada como calor na respiração ou passa aos decompositores em restos e fezes (e também acaba como calor); em média, só cerca de 10% (de 5% a 20%) passa ao nível seguinte.", "int": "Desenhar o mesmo ecossistema duas vezes, uma com setas de energia (entrada solar, saída como calor) e outra com setas de carbono (ciclo fechado), e comparar as duas figuras com a turma."}, {"id": "ECO2", "area": "Ecologia", "ponto": "Pirâmide de energia nunca é invertida; pirâmides de números e de biomassa podem ser", "html": "<p>Em uma árvore frondosa vivem milhares de pulgões, que se alimentam de sua seiva, e centenas de joaninhas, que comem os pulgões. Um estudante representou esse sistema com pirâmides ecológicas de números, de biomassa e de energia.<\/p>", "cmd": "Assinale a alternativa correta.", "alts": {"a": "Todas as pirâmides desse sistema, de números, de biomassa e de energia, ficam invertidas na base, pois há apenas um produtor para milhares de consumidores.", "b": "Nenhuma das pirâmides pode aparecer invertida, pois as pirâmides ecológicas sempre têm base larga; se o desenho ficou invertido, houve erro na contagem dos indivíduos.", "c": "A pirâmide de biomassa nunca pode ser invertida, mas a de energia pode, dependendo do número de indivíduos em cada nível, e por isso nesse sistema ela fica invertida na base.", "d": "A pirâmide de números fica invertida na base, pois uma árvore sustenta milhares de pulgões, mas a de energia não pode ser invertida, já que a energia diminui a cada nível trófico."}, "gab": "d", "eq": {"a": {"nome": "Todas as pirâmides se comportam igual", "exp": "O aluno transfere o formato da pirâmide de números para as outras, mas a biomassa da árvore supera muito a dos pulgões, e a energia disponível sempre diminui de um nível para o seguinte."}, "b": {"nome": "Pirâmide nunca invertida", "exp": "O aluno toma o nome &quot;pirâmide&quot; como regra de forma, mas a pirâmide de números inverte quando um produtor grande sustenta muitos consumidores pequenos, e a de biomassa pode inverter em alguns ambientes aquáticos."}, "c": {"nome": "Troca de qual pirâmide pode inverter", "exp": "O aluno inverte a regra: é a pirâmide de energia que nunca inverte; a de biomassa pode inverter (como no fitoplâncton de renovação rápida), e o número de indivíduos não altera a quantidade de energia."}}, "ok": "Pirâmides de números podem ser invertidas quando um produtor grande sustenta muitos consumidores (árvore → pulgões) ou em cadeias de parasitas. Pirâmides de biomassa podem se inverter em ambientes aquáticos, onde o fitoplâncton se renova rapidamente. A pirâmide de energia nunca é invertida, porque cada nível recebe apenas parte da energia do anterior; o restante é dissipado como calor.", "int": "Construir com a turma as três pirâmides para os mesmos sistemas (árvore–pulgões–joaninhas; campo–gado–humanos; fitoplâncton–zooplâncton) e discutir por que só a de energia mantém sempre o mesmo formato."}, {"id": "ECO3", "area": "Ecologia", "ponto": "Efeito estufa (natural, intensificado por CO2 e CH4) × camada de ozônio (filtra UV; destruída por CFCs)", "html": "<p>Em uma redação, um aluno escreveu: “O buraco na camada de ozônio deixa entrar mais calor do Sol na Terra, e é isso que causa o aquecimento global. Portanto, para resolver o problema, o efeito estufa deve ser eliminado.”<\/p>", "cmd": "Assinale a alternativa correta.", "alts": {"a": "O efeito estufa é natural e essencial, mas intensificado por CO2 e CH4; a camada de ozônio filtra a radiação ultravioleta e foi degradada sobretudo por CFCs; são fenômenos distintos.", "b": "O aluno está certo: o buraco na camada de ozônio é a principal causa do aquecimento global, pois permite a entrada de mais radiação solar, e o efeito estufa é o nome desse processo.", "c": "O efeito estufa é um fenômeno causado exclusivamente pela poluição humana; se ele fosse eliminado, como propõe o aluno, a temperatura média da Terra voltaria ao valor natural e ideal para a vida.", "d": "Os CFCs são os principais gases responsáveis pelo efeito estufa, e o CO2 liberado pela queima de combustíveis é o principal destruidor da camada de ozônio; os dois fenômenos têm a mesma origem."}, "gab": "a", "eq": {"b": {"nome": "Buraco de ozônio causa aquecimento global", "exp": "O aluno funde os dois fenômenos, mas o ozônio filtra principalmente radiação ultravioleta, cujo aumento eleva o risco de câncer de pele e danos aos seres vivos; o aquecimento global resulta da retenção de calor por gases de efeito estufa."}, "c": {"nome": "Efeito estufa é só poluição (deve ser eliminado)", "exp": "O aluno vê o efeito estufa como algo apenas nocivo e artificial, mas ele é natural e, sem ele, a temperatura média da Terra seria muito abaixo de zero; o problema é sua intensificação pelas atividades humanas."}, "d": {"nome": "Gases trocados (CFC × CO2)", "exp": "O aluno inverte os gases: os CFCs são os principais destruidores do ozônio estratosférico (também retêm calor, mas sua marca é destruir o ozônio), e o CO2, junto com o metano, é o principal responsável pela intensificação do efeito estufa."}}, "ok": "O efeito estufa é a retenção de parte do calor (radiação infravermelha) emitido pela superfície por gases como CO2, CH4 e vapor de água; é natural e essencial, mas vem sendo intensificado pela queima de combustíveis fósseis e pelo desmatamento, causando o aquecimento global. A camada de ozônio, na estratosfera, absorve radiação ultravioleta e foi degradada principalmente por CFCs; após o Protocolo de Montreal, que os baniu, ela está em lenta recuperação.", "int": "Montar um quadro comparativo entre os dois fenômenos (radiação envolvida, gases responsáveis, consequências, acordos internacionais) e corrigir coletivamente frases que os misturam."}, {"id": "ECO4", "area": "Ecologia", "ponto": "Magnificação trófica: poluentes persistentes se concentram nos predadores de topo", "html": "<p>Um inseticida persistente e solúvel em gordura, como o DDT, foi aplicado em plantações próximas a um lago. Anos depois, mediu-se sua concentração na água, no fitoplâncton, em peixes pequenos, em peixes grandes e em aves que se alimentam de peixes.<\/p>", "cmd": "Em que ponto a concentração do inseticida tende a ser maior, e por quê?", "alts": {"a": "Na água do lago, pois foi lá que o inseticida chegou; os organismos só contêm o que absorvem diretamente da água ao seu redor, e por isso nenhum deles supera a concentração da água.", "b": "Nas aves que comem peixes, pois o inseticida persistente se acumula nos tecidos e cada predador ingere muitas presas contaminadas; a concentração cresce a cada nível trófico.", "c": "No fitoplâncton, que absorve o inseticida diretamente da água; como só cerca de 10% passa de um nível trófico para o seguinte, a concentração diminui dos produtores para os predadores.", "d": "Nos peixes pequenos, pois são os mais numerosos e se alimentam com mais frequência do fitoplâncton contaminado; as aves, em menor número e maiores, diluem o inseticida no corpo."}, "gab": "b", "eq": {"a": {"nome": "Contaminação só por contato (poluente maior na fonte)", "exp": "O aluno acha que o poluente entra só pelo contato com a água, mas substâncias persistentes e lipossolúveis são acumuladas pelos organismos e transferidas pela alimentação, superando muito a concentração no ambiente."}, "c": {"nome": "Regra dos 10% aplicada ao poluente", "exp": "O aluno transfere a perda de energia para o poluente, mas a energia se dissipa como calor e o poluente persistente não: ele fica retido nos tecidos e se concentra a cada nível."}, "d": {"nome": "Acúmulo ligado ao número de indivíduos", "exp": "O aluno associa a contaminação à abundância e à frequência de alimentação, mas o que importa é a posição trófica: o predador de topo reúne o poluente de todas as presas que comeu ao longo da vida."}}, "ok": "Poluentes persistentes (não biodegradáveis), como o DDT (acumulado na gordura) e o metilmercúrio (ligado a proteínas), são pouco excretados e se acumulam no organismo (bioacumulação). Como cada consumidor ingere grande quantidade de presas contaminadas, a concentração aumenta a cada nível trófico (magnificação trófica), atingindo os maiores valores nos predadores de topo.", "int": "Simular a magnificação com a turma (por exemplo, fichas marcadas passando de &#x27;presas&#x27; para &#x27;predadores&#x27; que comem várias delas) e contrastar com o fluxo de energia, que diminui ao longo da cadeia."}];
const AREAS = ["Bioquímica", "Biologia celular", "Genética", "Evolução", "Filogenia", "Zoologia", "Botânica", "Saúde humana e fisiologia", "Biodiversidade", "Ecologia"];
const N = DATA.length;
const DRAFT_KEY = "bc-teste-performance-rascunho";
const KEY_KEY = "bc-teste-performance-chave";
const $app = document.getElementById("app");
let state = {view:"start", nome:"", turma:"", email:"", telefone:"", answers:Array(N).fill(null), step:0};
let lastResult = null;
const configured = /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(ENDPOINT);

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function loadDraft(){try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");if(d&&Array.isArray(d.answers)&&d.answers.length===N){state=Object.assign(state,d);}}catch(e){}}
function saveDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({nome:state.nome,turma:state.turma,email:state.email,telefone:state.telefone,answers:state.answers,step:state.step,view:state.view==="result"?"result":(state.view==="prof"?"start":state.view),sent:!!state.sent}))}catch(e){}}
function band(s){return s>=4?"ok":s===3?"warn":"crit"}
function bandName(s){return s>=4?"Domínio":s===3?"Atenção":"Prioridade"}
function grade(ans){
  const per={}; AREAS.forEach(a=>per[a]=0);
  const wrong=[]; let total=0;
  DATA.forEach((q,i)=>{const a=ans[i]; if(a===q.gab){per[q.area]++;total++;} else wrong.push({i,q,a});});
  return {per,total,wrong};
}
function encodeCode(){
  const payload={n:state.nome,t:state.turma,e:state.email||"",f:state.telefone||"",a:state.answers.map(x=>x||"-").join("")};
  const b=btoa(unescape(encodeURIComponent(JSON.stringify(payload)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return "BC1."+b;
}
function decodeCode(s){
  s=s.trim(); if(!s.startsWith("BC1.")) return null;
  try{let b=s.slice(4).replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4)b+="=";
    const p=JSON.parse(decodeURIComponent(escape(atob(b))));
    if(typeof p.a!=="string"||!/^[abcd-]{40}$/.test(p.a)) return null;
    return {nome:String(p.n||"Sem nome").slice(0,80),turma:String(p.t||"").slice(0,40),email:String(p.e||"").slice(0,120),telefone:String(p.f||"").slice(0,40),respostas:p.a};
  }catch(e){return null}
}

/* envio para a planilha: POST de texto simples (sem pré-verificação de CORS) */
async function send(payload){
  if(!configured) return false;
  try{
    const r=await fetch(ENDPOINT,{method:"POST",body:JSON.stringify(payload),redirect:"follow"});
    const j=await r.json();
    return !!(j&&j.ok);
  }catch(e){
    return false;
  }
}

/* ---------------- aluno ---------------- */
function renderStart(){
  const answered=state.answers.filter(Boolean).length;
  $app.innerHTML=`
  <section class="card">
    <h2>Antes de começar</h2>
    <p class="muted">Este teste não vale nota. Cada alternativa errada revela uma ideia específica — é isso que o professor precisa enxergar para planejar as aulas.</p>
    <div class="facts"><div><b>40</b><span>questões</span></div><div><b>10</b><span>áreas</span></div><div><b>1 h</b><span>tempo sugerido</span></div></div>
    <ul class="areas-list">${AREAS.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>
  </section>
  <section class="card">
    <form id="f-start" class="row" novalidate>
      <label class="fl" for="nome">Seu nome completo<input type="text" id="nome" autocomplete="name" required value="${esc(state.nome)}"></label>
      <label class="fl" for="email">Seu e-mail<input type="email" id="email" autocomplete="email" required value="${esc(state.email||"")}"></label>
      <label class="fl" for="telefone">Seu telefone (com DDD)<input type="tel" id="telefone" autocomplete="tel" required value="${esc(state.telefone||"")}"></label>
      <label class="fl" for="turma">Turma (opcional)<input type="text" id="turma" value="${esc(state.turma)}"></label>
      <label class="hp" for="site" aria-hidden="true">Não preencha<input type="text" id="site" tabindex="-1" autocomplete="off"></label>
    </form>
    <p class="hint" id="start-err" hidden>Preencha nome, e-mail e telefone para liberar o teste.</p>
    <p class="hint" style="margin-top:10px">Seu nome, e-mail, telefone e suas respostas vão para o professor do Bio em Casa e servem apenas para planejar as aulas e montar o seu diagnóstico.</p>
    <div class="actions" style="margin-top:14px">
      <span class="hint">${answered?`Você já respondeu ${answered} de 40 neste aparelho.`:"Não consulte material. Se não souber, marque o que parecer mais razoável hoje."}</span>
      <button class="btn" id="b-start" type="button">${answered?"Continuar o teste":"Começar o teste"}</button>
    </div>
  </section>`;
  document.getElementById("b-start").onclick=()=>{
    const n=document.getElementById("nome").value.trim();
    const em=document.getElementById("email").value.trim();
    const tel=document.getElementById("telefone").value.trim();
    const emOk=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em);
    const telOk=tel.replace(/\D/g,"").length>=10;
    const err=document.getElementById("start-err");
    if(!n){err.textContent="Escreva seu nome completo.";err.hidden=false;document.getElementById("nome").focus();return;}
    if(!emOk){err.textContent="Escreva um e-mail válido.";err.hidden=false;document.getElementById("email").focus();return;}
    if(!telOk){err.textContent="Escreva um telefone válido, com DDD.";err.hidden=false;document.getElementById("telefone").focus();return;}
    state.nome=n; state.turma=document.getElementById("turma").value.trim(); state.email=em; state.telefone=tel; state.hp=document.getElementById("site").value; state.view="test"; saveDraft(); render(); window.scrollTo(0,0);
  };
}

function renderTest(){
  const area=AREAS[state.step];
  const idx=DATA.map((q,i)=>i).filter(i=>DATA[i].area===area);
  const prog=AREAS.map((a,k)=>`<i class="${k<state.step?"done":k===state.step?"cur":""}"></i>`).join("");
  const answered=state.answers.filter(Boolean).length;
  $app.innerHTML=`
  <div class="progress" aria-hidden="true">${prog}</div>
  <div class="step-h"><h2>${esc(area)}</h2><small>Área ${state.step+1} de 10 · ${answered} de 40 respondidas</small></div>
  ${idx.map(i=>{const q=DATA[i];return `
  <article class="q"><div class="qn">${String(i+1).padStart(2,"0")}</div><div class="qb">${q.html}<p class="cmd">${q.cmd}</p>
  <div class="opts" role="radiogroup" aria-label="Questão ${i+1}">${Object.keys(q.alts).map(k=>`
    <label class="opt"><input type="radio" name="q${i}" id="q${i}${k}" value="${k}" ${state.answers[i]===k?"checked":""}><span class="l">${k}</span><span>${q.alts[k]}</span></label>`).join("")}
  </div></div></article>`}).join("")}
  <div class="actions">
    <button class="btn ghost" id="b-prev" type="button">${state.step===0?"Voltar ao início":"Área anterior"}</button>
    <button class="btn" id="b-next" type="button">${state.step===9?"Revisar e enviar":"Próxima área"}</button>
  </div>`;
  $app.querySelectorAll('input[type=radio]').forEach(r=>r.addEventListener("change",e=>{const i=+e.target.name.slice(1);state.answers[i]=e.target.value;saveDraft();}));
  document.getElementById("b-prev").onclick=()=>{if(state.step===0){state.view="start"}else state.step--;saveDraft();render();window.scrollTo(0,0)};
  document.getElementById("b-next").onclick=()=>{if(state.step===9){state.view="review"}else state.step++;saveDraft();render();window.scrollTo(0,0)};
}

function renderReview(){
  const blank=state.answers.map((a,i)=>a?null:i+1).filter(Boolean);
  $app.innerHTML=`
  <section class="card">
    <h2>Pronto para enviar?</h2>
    ${blank.length?`<p class="note warn">Faltam ${blank.length} questões: ${blank.map(n=>String(n).padStart(2,"0")).join(", ")}. Questões em branco contam como erro e não mostram qual ideia você tem.</p>`:`<p class="note ok">Você respondeu as 40 questões.</p>`}
    <p class="muted small" style="margin-top:12px">Depois de enviar, você vê seu mapa por área e as ideias que precisam de revisão.</p>
    <div class="actions" style="margin-top:12px">
      <button class="btn ghost" id="b-back" type="button">Voltar às questões</button>
      <button class="btn" id="b-send" type="button">Enviar respostas</button>
    </div>
  </section>`;
  document.getElementById("b-back").onclick=()=>{state.view="test";state.step=9;render();window.scrollTo(0,0)};
  document.getElementById("b-send").onclick=submit;
}


async function submit(){
  const btn=document.getElementById("b-send"); btn.disabled=true; btn.textContent="Enviando…";
  const ok=await send({nome:state.nome,turma:state.turma,email:state.email||"",telefone:state.telefone||"",respostas:state.answers.map(x=>x||"-").join(""),fonte:"página",site:state.hp||""});
  state.sent=ok; state.view="result"; lastResult={saved:ok}; saveDraft(); render(); window.scrollTo(0,0);
}

function renderResult(){
  const g=grade(state.answers);
  const saved=lastResult&&lastResult.saved;
  const code=encodeCode();
  const bars=AREAS.map(a=>{const s=g.per[a];return `<div class="bar"><span>${esc(a)}</span><div class="t"><i class="fill-${band(s)}" style="width:${s*25}%"></i></div><span><span class="pill ${band(s)}">${s}/4 · ${bandName(s)}</span></span></div>`}).join("");
  const eqs=g.wrong.map(({i,q,a})=>{
    const e=a&&q.eq[a];
    return `<div class="eq"><h4>${String(i+1).padStart(2,"0")} · ${esc(q.area)} — ${e?esc(e.nome):"Questão em branco"}</h4>
      ${e?`<p>${e.exp}</p>`:""}<p><b>O certo:</b> ${q.ok}</p><small>Você marcou ${a?a.toUpperCase():"—"} · resposta correta ${q.gab.toUpperCase()}</small></div>`}).join("");
  $app.innerHTML=`
  <section class="card">
    <h2>Seu mapa, ${esc(state.nome.split(" ")[0])}</h2>
    <div class="score"><b>${g.total}</b><span class="muted">acertos em 40</span></div>
    <div class="bars">${bars}</div>
    <p class="hint" style="margin-top:10px">Domínio: 4 de 4 · Atenção: 3 de 4 · Prioridade: 0 a 2 de 4.</p>
  </section>
  <section class="card">
    ${saved?`<p class="note ok">Suas respostas foram enviadas ao professor.</p>`:`<p class="note warn"><b>Envie este código ao professor.</b> A página não conseguiu confirmar o envio das suas respostas (pode ter sido a conexão). Copie o código abaixo e mande pelo canal da turma, ou toque em “Tentar enviar de novo”.</p><button class="btn small" id="b-retry" type="button" style="margin-top:8px">Tentar enviar de novo</button>`}
    <details ${saved?"":"open"} style="margin-top:10px"><summary class="small">Código das suas respostas</summary><div class="code" id="code">${code}</div>
      <button class="btn small ghost" id="b-copy" type="button">Copiar código</button> <span class="hint" id="copied"></span></details>
  </section>
  <section class="card">
    <h3>Ideias para revisar (${g.wrong.length})</h3>
    ${g.wrong.length?`<div class="eqlist">${eqs}</div>`:`<p class="muted">Nenhuma. Você acertou as 40 questões.</p>`}
  </section>
  <div class="actions"><span class="hint">Seu resultado fica salvo neste aparelho.</span><button class="btn ghost small" id="b-restart" type="button">Refazer o teste</button></div>`;
  const rt=document.getElementById("b-retry"); if(rt) rt.onclick=async()=>{rt.disabled=true;rt.textContent="Enviando…";const ok=await send({nome:state.nome,turma:state.turma,email:state.email||"",telefone:state.telefone||"",respostas:state.answers.map(x=>x||"-").join(""),fonte:"página",site:state.hp||""});lastResult={saved:ok};state.sent=ok;saveDraft();render();};
  document.getElementById("b-copy").onclick=async()=>{const t=document.getElementById("copied");try{await navigator.clipboard.writeText(code);t.textContent="Copiado."}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById("code"));const s=getSelection();s.removeAllRanges();s.addRange(r);t.textContent="Código selecionado: use copiar do seu aparelho."}};
  const rb=document.getElementById("b-restart"); let armed=false;
  rb.onclick=()=>{if(!armed){armed=true;rb.textContent="Confirmar: apagar respostas";rb.classList.add("danger");return;}
    state={view:"start",nome:state.nome,turma:state.turma,email:state.email,telefone:state.telefone,answers:Array(N).fill(null),step:0};lastResult=null;saveDraft();render();window.scrollTo(0,0)};
}


/* ---------------- professor (abre com #painel no fim do endereço) ---------------- */
let panel={online:[],imp:[],loaded:false,loading:false,error:"",chave:""};
function allSubs(){
  /* se o mesmo aluno enviou mais de uma vez, vale o envio mais recente */
  const norm=v=>String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
  const last={};
  panel.online.slice().sort((a,b)=>String(a.enviadoEm).localeCompare(String(b.enviadoEm))).forEach(d=>{last[norm(d.nome)+"|"+norm(d.turma)]=d;});
  return Object.values(last).map(d=>({...d,src:d.fonte==="código importado"?"código":"página"}));
}
function profBar(){
  return `<div class="profbar"><h2 style="margin:0">Painel da turma</h2><span><button class="btn small ghost" id="b-refresh" type="button">Atualizar</button> <button class="btn small ghost" id="b-logout" type="button">Sair</button></span></div>`;
}
function bindProfBar(){
  const r=document.getElementById("b-refresh"); if(r) r.onclick=()=>loadPanel();
  const o=document.getElementById("b-logout"); if(o) o.onclick=()=>{try{sessionStorage.removeItem(KEY_KEY)}catch(e){} panel={online:[],imp:[],loaded:false,loading:false,error:"",chave:""}; renderLogin();};
}
function renderLogin(msg){
  $app.classList.remove("wide");
  $app.innerHTML=`<section class="card"><h2>Painel da turma</h2>
    ${configured?"":`<p class="note warn">A página ainda não está ligada à planilha. Cole a URL do Apps Script na linha ENDPOINT do arquivo (veja o Guia de instalação).</p>`}
    <p class="muted">Digite a senha definida no script da planilha.</p>
    <form id="f-login" class="row" style="margin-top:10px"><label class="fl" for="chave">Senha do professor<input type="password" id="chave" autocomplete="current-password"></label></form>
    ${msg?`<p class="note warn" style="margin-top:10px">${esc(msg)}</p>`:""}
    <div class="actions" style="margin-top:12px"><a class="small" href="#" id="to-test">Voltar ao teste</a><button class="btn" id="b-login" type="button">Abrir painel</button></div></section>`;
  const go=()=>{panel.chave=document.getElementById("chave").value.trim(); if(!panel.chave) return; try{sessionStorage.setItem(KEY_KEY,panel.chave)}catch(e){} loadPanel();};
  document.getElementById("b-login").onclick=go;
  document.getElementById("f-login").onsubmit=e=>{e.preventDefault();go()};
  document.getElementById("to-test").onclick=e=>{e.preventDefault(); history.replaceState(null,"",location.pathname+location.search); state.view="start"; render();};
}
async function loadPanel(){
  if(!configured){renderLogin();return;}
  panel.loading=true;
  $app.innerHTML=`<section class="card empty"><p>Carregando respostas da planilha…</p></section>`;
  try{
    const r=await fetch(ENDPOINT+"?acao=listar&chave="+encodeURIComponent(panel.chave));
    const j=await r.json();
    if(!j.ok){ try{sessionStorage.removeItem(KEY_KEY)}catch(e){} renderLogin(j.erro==="chave incorreta"?"Senha incorreta.":"A planilha recusou o pedido."); return; }
    panel.online=j.alunos||[]; panel.loaded=true;
    renderProf(); bindProfBar();
  }catch(e){ renderLogin("Não foi possível falar com a planilha. Confira a URL do Apps Script e a conexão."); }
}
function renderProf(){
  const subs=allSubs().filter(s=>typeof s.respostas==="string"&&s.respostas.length===N);
  const n=subs.length;
  const graded=subs.map(s=>({...s,g:grade(s.respostas.split("").map(x=>x==="-"?null:x))}));
  const importBox=`
  <section class="card">
    <h3>Importar códigos</h3>
    <p class="muted small">Alunos que não conseguiram enviar pela página recebem um código que começa com <b>BC1.</b> Cole um ou vários, um por linha.</p>
    <label class="fl" for="imp">Códigos<textarea id="imp" placeholder="BC1.eyJuIjoi…"></textarea></label>
    <div class="actions" style="margin-top:10px"><span class="hint" id="imp-msg"></span><button class="btn small" id="b-imp" type="button">Importar</button></div>
  </section>`;
  if(!n){
    $app.innerHTML=`${profBar()}<section class="card empty"><h2>Nenhuma resposta ainda</h2><p>As respostas aparecem aqui assim que os alunos enviam o teste. Alunos cujo envio falhou recebem um código: importe-o abaixo.</p></section>${importBox}`;
    bindImport();return;
  }
  const areaStats=AREAS.map(a=>{const sc=graded.map(x=>x.g.per[a]);const avg=sc.reduce((p,c)=>p+c,0)/n;
    const cnt={ok:sc.filter(v=>v>=4).length,warn:sc.filter(v=>v===3).length,crit:sc.filter(v=>v<=2).length};return {a,avg,cnt}}).sort((x,y)=>x.avg-y.avg);
  const eqCount={};
  graded.forEach(x=>x.g.wrong.forEach(({i,a})=>{if(!a)return;const k=i+"|"+a;eqCount[k]=(eqCount[k]||0)+1}));
  const topEq=Object.entries(eqCount).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([k,c])=>{const [i,a]=k.split("|");const q=DATA[+i];return {i:+i,a,c,q}});
  const qStats=DATA.map((q,i)=>({i,q,p:graded.filter(x=>x.respostas[i]===q.gab).length/n})).sort((a,b)=>a.p-b.p).slice(0,8);
  const avgTotal=graded.reduce((p,x)=>p+x.g.total,0)/n;
  const pct=v=>Math.round(v*100)+"%";
  $app.classList.add("wide");
  $app.innerHTML=`${profBar()}
  <div class="kpis">
    <div><b>${n}</b><span>alunos responderam</span></div>
    <div><b>${avgTotal.toFixed(1).replace(".",",")}</b><span>acertos médios em 40</span></div>
    <div><b>${esc(areaStats[0].a)}</b><span>área mais frágil da turma</span></div>
    <div><b>${areaStats.filter(s=>s.avg<3).length}</b><span>áreas com média abaixo de 3/4</span></div>
  </div>
  <section class="card">
    <h3>Áreas, da mais frágil à mais sólida</h3>
    <div class="tscroll"><table class="data"><thead><tr><th>Área</th><th>Média</th><th>Distribuição da turma</th><th>Domínio</th><th>Atenção</th><th>Prioridade</th></tr></thead><tbody>
    ${areaStats.map(s=>`<tr><td>${esc(s.a)}</td><td><span class="sc ${band(Math.round(s.avg))}">${s.avg.toFixed(1).replace(".",",")}</span></td>
      <td><div class="dist"><i class="fill-ok" style="width:${100*s.cnt.ok/n}%"></i><i class="fill-warn" style="width:${100*s.cnt.warn/n}%"></i><i class="fill-crit" style="width:${100*s.cnt.crit/n}%"></i></div></td>
      <td class="c">${s.cnt.ok}</td><td class="c">${s.cnt.warn}</td><td class="c">${s.cnt.crit}</td></tr>`).join("")}
    </tbody></table></div>
  </section>
  <section class="card">
    <h3>Equívocos mais frequentes</h3>
    <p class="muted small">Cada linha é uma alternativa errada e a ideia que ela revela. Ideias compartilhadas por muitos alunos viram tema de aula.</p>
    <div class="eqlist">${topEq.map(e=>{const eq=e.q.eq[e.a]||{nome:"—",exp:""};return `<div class="eq"><h4>${pct(e.c/n)} da turma · Q${String(e.i+1).padStart(2,"0")} ${esc(e.q.area)} — ${esc(eq.nome)}</h4><p>${eq.exp}</p><small>Intervenção sugerida: ${e.q.int}</small></div>`}).join("")||`<p class="muted">Nenhum erro registrado.</p>`}</div>
  </section>
  <section class="card">
    <h3>Questões com menor acerto</h3>
    <div class="tscroll"><table class="data"><thead><tr><th>Nº</th><th>Área</th><th>Ponto avaliado</th><th>Acerto</th></tr></thead><tbody>
    ${qStats.map(s=>`<tr><td>${String(s.i+1).padStart(2,"0")}</td><td>${esc(s.q.area)}</td><td>${esc(s.q.ponto)}</td><td class="c">${pct(s.p)}</td></tr>`).join("")}
    </tbody></table></div>
  </section>
  <section class="card">
    <div class="actions"><h3 style="margin:0">Alunos</h3><span><button class="btn small ghost" id="b-tsv" type="button">Copiar tabela para planilha</button> <span class="hint" id="tsv-msg"></span></span></div>
    <div class="tscroll" style="margin-top:10px"><table class="data"><thead><tr><th>Aluno</th><th>Turma</th><th>Total</th>${AREAS.map(a=>`<th title="${esc(a)}">${esc(a.split(" ")[0].slice(0,6))}</th>`).join("")}<th>Envio</th></tr></thead><tbody>
    ${graded.sort((a,b)=>a.g.total-b.g.total).map(x=>`<tr><td>${esc(x.nome||"Sem nome")}</td><td>${esc(x.turma||"")}</td><td class="c"><b>${x.g.total}</b></td>
      ${AREAS.map(a=>`<td class="c"><span class="sc ${band(x.g.per[a])}">${x.g.per[a]}</span></td>`).join("")}
      <td class="small">${esc(x.src)}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="hint" style="margin-top:8px">Colunas: ${AREAS.map(a=>esc(a)).join(" · ")}.</p>
  </section>
  ${importBox}`;
  bindImport();
  document.getElementById("b-tsv").onclick=async()=>{
    const head=["Aluno","Turma","Total",...AREAS].join("\t");
    const rows=graded.map(x=>[x.nome,x.turma,x.g.total,...AREAS.map(a=>x.g.per[a])].join("\t"));
    const txt=[head,...rows].join("\n"); const m=document.getElementById("tsv-msg");
    try{await navigator.clipboard.writeText(txt);m.textContent="Copiado. Cole na planilha."}catch(e){m.textContent="Este aplicativo bloqueou a cópia."}
  };
}

function bindImport(){
  const b=document.getElementById("b-imp"); if(!b) return;
  b.onclick=async()=>{
    const lines=document.getElementById("imp").value.split(/\s+/).filter(Boolean);
    const msg=document.getElementById("imp-msg"); let ok=0,bad=0;
    b.disabled=true; msg.textContent="Importando…";
    for(const l of lines){const d=decodeCode(l); if(!d){bad++;continue;}
      const done=await send({...d,fonte:"código",chave:panel.chave}); if(done) ok++; else bad++;}
    b.disabled=false;
    msg.textContent=`${ok} importado(s)${bad?`, ${bad} não importado(s)`:""}.`;
    if(ok){ document.getElementById("imp").value=""; setTimeout(loadPanel,600); }
  };
}

/* ---------------- roteamento ---------------- */
function render(){
  $app.classList.toggle("wide",state.view==="prof");
  if(state.view==="prof"){ let k=""; try{k=sessionStorage.getItem(KEY_KEY)||""}catch(e){} if(k){panel.chave=k; loadPanel();} else renderLogin(); return; }
  if(state.view==="test") return renderTest();
  if(state.view==="review") return renderReview();
  if(state.view==="result") return renderResult();
  return renderStart();
}
loadDraft();
if(state.view==="result") lastResult={saved:!!state.sent};
if(location.hash==="#painel") state.view="prof";
window.addEventListener("hashchange",()=>{ if(location.hash==="#painel"){state.view="prof";render();} });
render();
</script>
